<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo CRM — Estoque</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('crm_tema')==='dark'?'dark':'light');})();</script>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/crm/shell.css">
<style>
  .busca { max-width:360px; }
  tr.linha-produto-item { cursor:pointer; }
  tr.linha-produto-item:hover td { background:var(--surface-hover); }
  tr.linha-produto-item td { position:relative; }
  .menu-acoes-wrap { position:relative; display:inline-block; }
  .btn-acoes { background:transparent; color:var(--muted); width:32px; height:32px; padding:0; border-radius:6px; }
  .btn-acoes:hover { background:var(--surface-muted); color:var(--text); }
  .menu-acoes { position:absolute; right:0; top:36px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md);
    box-shadow:var(--shadow-md); min-width:150px; z-index:20; padding:6px; }
  .menu-acoes button { display:block; width:100%; text-align:left; background:transparent; color:var(--text); padding:8px 10px; border-radius:6px; font-size:13px; height:auto; }
  .menu-acoes button:hover { background:var(--surface-muted); }
  .menu-acoes button.perigo { color:var(--danger); }
  td.col-observacao { max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
  <header class="topo-app">
    <a class="topo-logo" href="/crm/painel.html" aria-label="Ir para o início">
      <img class="topo-logo-img js-logo-kyvvo" src="/ds/logo.svg" alt="Kyvvo">
      <span class="topo-produto-tag">CRM</span>
    </a>
    <div class="topo-direita">
    <div class="ds-notificacoes" id="notificacoes-sino">
      <button class="ds-notificacoes-btn" id="notificacoes-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Notificações">
        <span data-icon="bell" data-size="20"></span>
        <span class="ds-notificacoes-contagem" id="notificacoes-contagem" hidden></span>
      </button>
      <div class="ds-notificacoes-painel" role="menu" hidden>
        <div class="ds-notificacoes-lista" id="notificacoes-lista"></div>
      </div>
    </div>
    <div class="topo-perfil" id="topo-perfil">
      <button class="topo-perfil-gatilho" id="topo-perfil-gatilho" type="button" aria-haspopup="true" aria-expanded="false">
        <div class="avatar js-avatar-usuario"></div>
        <span class="nome js-nome-usuario"></span>
        <span data-icon="chevron-down" data-size="14"></span>
      </button>
      <div class="menu-perfil" id="menu-perfil" hidden>
        <div class="menu-perfil-usuario">
          <div class="avatar js-avatar-usuario"></div>
          <div class="textos">
            <div class="nome js-nome-usuario"></div>
            <div class="email js-email-usuario"></div>
          </div>
        </div>
        <div class="menu-perfil-divisor"></div>
        <div class="menu-perfil-item menu-perfil-tema">
          <span data-icon="sun-moon" data-size="16"></span><span class="rotulo">Tema</span>
          <button class="toggle-tema" type="button" role="switch" aria-checked="false" aria-label="Alternar tema claro/escuro"><span class="bolinha"></span></button>
        </div>
        <div class="menu-perfil-divisor"></div>
        <button class="menu-perfil-item perigo btn-sair" type="button">
          <span data-icon="log-out" data-size="16"></span><span class="rotulo">Sair da conta</span>
        </button>
      </div>
    </div>
    </div>
  </header>
  <div class="app-shell">
    <nav class="ds-menu" data-ds-menu id="painel-sidebar">
      <div class="ds-menu-topo">
        <button type="button" class="ds-menu-toggle" id="btn-toggle-sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
      <ul class="ds-menu-lista">
        <li><a class="ds-menu-link" href="/crm/painel.html"><span class="ds-menu-icone" data-icon="layout-dashboard"></span><span class="ds-menu-rotulo">Painel Hoje</span></a></li>
        <li><a class="ds-menu-link" href="/crm/quadro.html"><span class="ds-menu-icone" data-icon="kanban"></span><span class="ds-menu-rotulo">Quadro</span></a></li>
        <li><a class="ds-menu-link" href="/crm/clientes.html"><span class="ds-menu-icone" data-icon="users"></span><span class="ds-menu-rotulo">Clientes</span></a></li>
        <li><a class="ds-menu-link" href="/crm/pedidos.html"><span class="ds-menu-icone" data-icon="list"></span><span class="ds-menu-rotulo">Pedidos</span></a></li>
        <li><a class="ds-menu-link" href="/crm/estoque.html"><span class="ds-menu-icone" data-icon="package"></span><span class="ds-menu-rotulo">Estoque</span></a></li>
        <li><a class="ds-menu-link" href="/crm/segmentos.html"><span class="ds-menu-icone" data-icon="funnel"></span><span class="ds-menu-rotulo">Campanhas</span></a></li>
        <li class="ds-menu-grupo">
          <button type="button" class="ds-menu-link ds-menu-grupo-botao" aria-expanded="false">
            <span class="ds-menu-icone" data-icon="settings"></span>
            <span class="ds-menu-rotulo">Configurações</span>
            <span class="ds-menu-seta" data-icon="chevron-down" data-size="14"></span>
          </button>
          <ul class="ds-menu-sub">
            <li><a class="ds-menu-sublink" href="/crm/opcoes-cadastro.html">Cadastro</a></li>
            <li><a class="ds-menu-sublink" href="/crm/whatsapp.html">WhatsApp</a></li>
            <li><a class="ds-menu-sublink" href="/crm/automacoes.html">Automações</a></li>
            <li><a class="ds-menu-sublink" href="/crm/notificacoes.html">Notificações</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <div class="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos">
          <div class="linha-titulo"><h1>Estoque</h1></div>
        </div>
        <div class="acoes">
          <button type="button" id="btn-novo-produto"><span data-icon="plus" data-size="16"></span>Novo produto</button>
        </div>
      </div>

      <div class="busca">
        <input type="search" id="input-busca-produto" placeholder="Buscar por nome, ID, valor ou observação…">
      </div>

      <div class="card" style="padding:0">
        <table>
          <thead>
            <tr><th>Nome</th><th>ID</th><th>Quantidade</th><th>Valor</th><th>Observação</th><th></th></tr>
          </thead>
          <tbody id="tbody-produtos"><tr><td colspan="6"><div class="vazio">Carregando…</div></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer data-ds-rodape></footer>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    let produtos = [];
    let termoBusca = '';

    async function carregar() {
      const res = await apiFetch('/crm/api/produtos');
      produtos = await res.json();
      renderizar();
    }

    function produtoBateNaBusca(p, termo) {
      const alvo = [p.nome, p.identificador_externo, p.observacao, p.preco_referencia != null ? formatarMoeda(p.preco_referencia) : '']
        .filter(Boolean).join(' ').toLowerCase();
      return alvo.includes(termo);
    }

    function renderizar() {
      const tbody = document.getElementById('tbody-produtos');
      const termo = termoBusca.trim().toLowerCase();
      const lista = termo ? produtos.filter((p) => produtoBateNaBusca(p, termo)) : produtos;

      if (!lista.length) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="vazio">${produtos.length ? 'Nenhum produto bate com essa busca.' : 'Nenhum produto cadastrado ainda.'}</div></td></tr>`;
        return;
      }

      tbody.innerHTML = lista.map((p) => `
        <tr class="linha-produto-item" data-id="${p.id}">
          <td>${escapeHtml(p.nome)} ${p.ativo === false ? '<span class="badge neutro">Desativado</span>' : ''}</td>
          <td>${p.identificador_externo ? escapeHtml(p.identificador_externo) : '—'}</td>
          <td>${p.quantidade ?? 0}</td>
          <td>${p.preco_referencia ? formatarMoeda(p.preco_referencia) : '—'}</td>
          <td class="col-observacao" title="${p.observacao ? escapeHtml(p.observacao) : ''}">${p.observacao ? escapeHtml(p.observacao) : '—'}</td>
          <td>
            <div class="menu-acoes-wrap">
              <button type="button" class="btn-acoes" data-abrir-menu="${p.id}" aria-haspopup="true" aria-expanded="false">⋯</button>
              <div class="menu-acoes" data-menu="${p.id}" hidden>
                <button type="button" data-alternar-produto="${p.id}" data-ativo="${p.ativo === false}">${p.ativo === false ? 'Ativar' : 'Desativar'}</button>
                <button type="button" class="perigo" data-apagar-produto="${p.id}">Excluir</button>
              </div>
            </div>
          </td>
        </tr>
      `).join('');

      tbody.querySelectorAll('.linha-produto-item').forEach((tr) => {
        tr.addEventListener('click', (e) => {
          if (e.target.closest('.menu-acoes-wrap')) return;
          abrirModalProduto(produtos.find((p) => p.id === tr.dataset.id));
        });
      });
      ligarEventosLinhasProdutos();
    }

    function fecharMenusAbertosProdutos() {
      document.querySelectorAll('.menu-acoes').forEach((m) => { m.hidden = true; });
    }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.menu-acoes-wrap')) fecharMenusAbertosProdutos();
    });

    function ligarEventosLinhasProdutos() {
      document.querySelectorAll('[data-abrir-menu]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const menu = document.querySelector(`[data-menu="${btn.dataset.abrirMenu}"]`);
          const jaAberto = !menu.hidden;
          fecharMenusAbertosProdutos();
          menu.hidden = jaAberto;
        });
      });
      document.querySelectorAll('[data-alternar-produto]').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          fecharMenusAbertosProdutos();
          await apiFetch(`/crm/api/produtos/${btn.dataset.alternarProduto}`, {
            method: 'PATCH',
            body: JSON.stringify({ ativo: btn.dataset.ativo === 'true' }),
          });
          carregar();
        });
      });
      document.querySelectorAll('[data-apagar-produto]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          fecharMenusAbertosProdutos();
          confirmarAcao('Excluir produto?', 'Deseja excluir o produto?', async () => {
            await apiFetch(`/crm/api/produtos/${btn.dataset.apagarProduto}`, { method: 'DELETE' });
            carregar();
          }, { textoConfirmar: 'Confirmar', textoCancelar: 'Sair' });
        });
      });
    }

    let debounceBuscaProduto;
    document.getElementById('input-busca-produto').addEventListener('input', (e) => {
      clearTimeout(debounceBuscaProduto);
      debounceBuscaProduto = setTimeout(() => { termoBusca = e.target.value; renderizar(); }, 200);
    });

    function abrirModalProduto(produto) {
      const overlay = abrirModal(`<h3>${produto ? 'Editar produto' : 'Novo produto'}</h3>`, `
        <label for="pr-nome">Nome</label>
        <input type="text" id="pr-nome" placeholder="ex.: Vaso decorativo P" value="${produto ? escapeHtml(produto.nome) : ''}">
        <label for="pr-id">ID</label>
        <input type="text" id="pr-id" placeholder="SKU" value="${produto && produto.identificador_externo ? escapeHtml(produto.identificador_externo) : ''}">
        <label for="pr-quantidade">Quantidade</label>
        <input type="text" inputmode="numeric" id="pr-quantidade" placeholder="0" value="${produto ? (produto.quantidade ?? 0) : ''}">
        <label for="pr-preco">Valor</label>
        <input type="text" id="pr-preco" placeholder="0,00" value="${produto && produto.preco_referencia ? Number(produto.preco_referencia).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : ''}">
        <label for="pr-observacao">Observação</label>
        <input type="text" id="pr-observacao" placeholder="opcional" value="${produto && produto.observacao ? escapeHtml(produto.observacao) : ''}">
        <div class="modal-erro" id="pr-erro"></div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="pr-cancelar">Cancelar</button>
          <button type="button" id="pr-salvar">Salvar</button>
        </div>
      `);
      aplicarMascaraMoeda(document.getElementById('pr-preco'));
      document.getElementById('pr-cancelar').addEventListener('click', fecharModal);
      document.getElementById('pr-salvar').addEventListener('click', async () => {
        const nome = document.getElementById('pr-nome').value.trim();
        if (!nome) { document.getElementById('pr-erro').textContent = 'Nome é obrigatório'; return; }
        const corpo = {
          nome,
          identificador_externo: document.getElementById('pr-id').value.trim() || null,
          quantidade: parseInt(document.getElementById('pr-quantidade').value, 10) || 0,
          preco_referencia: valorMoedaParaNumero(document.getElementById('pr-preco')) || null,
          observacao: document.getElementById('pr-observacao').value.trim() || null,
        };
        const res = produto
          ? await apiFetch(`/crm/api/produtos/${produto.id}`, { method: 'PATCH', body: JSON.stringify(corpo) })
          : await apiFetch('/crm/api/produtos', { method: 'POST', body: JSON.stringify(corpo) });
        if (!res.ok) { document.getElementById('pr-erro').textContent = 'Falha ao salvar'; return; }
        fecharModal();
        carregar();
      });
      return overlay;
    }

    document.getElementById('btn-novo-produto').addEventListener('click', () => abrirModalProduto(null));

    carregar();
  </script>
</body>
</html>
