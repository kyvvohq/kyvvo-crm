    <div class="painel-main">
      <header class="ds-pagina-cab">
        <div class="ds-pagina-cab-texto"><h1 class="ds-pagina-cab-titulo">Estoque</h1></div>
        <div class="ds-pagina-cab-acoes">
          <button type="button" class="ds-btn ds-btn-primario" id="btn-novo-produto"><span data-icon="plus" data-size="16"></span>Novo produto</button>
        </div>
      </header>

      <div class="ds-tabela" role="table" aria-label="Estoque"
           style="--ds-colunas: minmax(0,1.4fr) minmax(0,0.8fr) 110px minmax(0,0.8fr) minmax(0,1.2fr) 48px">
        <div class="ds-filtros">
          <div class="ds-pesquisa">
            <svg class="ds-pesquisa-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="ds-pesquisa-input" type="search" id="input-busca-produto" placeholder="Buscar por nome, ID ou observação…" aria-label="Buscar por nome, ID ou observação">
          </div>
        </div>
        <div class="ds-tabela-cabecalho" role="row">
          <span role="columnheader">Nome</span><span role="columnheader">ID</span><span role="columnheader">Quantidade</span>
          <span role="columnheader">Valor</span><span role="columnheader">Observação</span><span role="columnheader"></span>
        </div>
        <div id="linhas-produtos"></div>
        <div class="ds-tabela-rodape"><nav data-ds-paginacao id="paginacao-produtos" data-ds-total="0" data-ds-tamanho="25" data-ds-tamanhos="25,50,100"></nav></div>
      </div>
    </div>
  </div>

  <footer data-ds-rodape data-ds-produto="CRM"></footer>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    let produtos = [];
    let totalProdutos = 0;
    const estadoProdutos = { pagina: 1, tamanho: 25, busca: '' };

    async function carregar() {
      const qs = new URLSearchParams({ pagina: estadoProdutos.pagina, tamanho: estadoProdutos.tamanho });
      if (estadoProdutos.busca) qs.set('busca', estadoProdutos.busca);
      const res = await apiFetch(`/crm/api/produtos?${qs}`);
      const corpo = await res.json();
      produtos = corpo.dados;
      totalProdutos = corpo.total;
      renderizar();
    }

    function renderizar() {
      const container = document.getElementById('linhas-produtos');
      container.innerHTML = produtos.length ? produtos.map((p) => `
        <div class="ds-tabela-linha ds-tabela-linha-clicavel" role="row" tabindex="0" data-id="${p.id}">
          <span role="cell" data-rotulo="Nome"><span class="ds-tabela-primario">${escapeHtml(p.nome)}</span>${p.ativo === false ? ' <span class="ds-badge ds-badge-sm">Desativado</span>' : ''}</span>
          <span role="cell" data-rotulo="ID">${p.identificador_externo ? escapeHtml(p.identificador_externo) : '—'}</span>
          <span role="cell" data-rotulo="Quantidade">${p.quantidade ?? 0}</span>
          <span role="cell" data-rotulo="Valor">${p.preco_referencia ? formatarMoeda(p.preco_referencia) : '—'}</span>
          <span role="cell" data-rotulo="Observação" class="ds-tabela-coluna-observacao" title="${p.observacao ? escapeHtml(p.observacao) : ''}">${p.observacao ? escapeHtml(p.observacao) : '—'}</span>
          <span role="cell">
            <div class="ds-acoes" data-id="${p.id}">
              <button type="button" class="ds-acoes-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Ações de ${escapeHtml(p.nome)}">⋯</button>
              <div class="ds-acoes-menu" role="menu" hidden>
                <button type="button" class="ds-acoes-item" role="menuitem" data-acao="editar">Editar</button>
                <button type="button" class="ds-acoes-item" role="menuitem" data-acao="alternar">${p.ativo === false ? 'Ativar' : 'Desativar'}</button>
                <button type="button" class="ds-acoes-item ds-acoes-item-perigo" role="menuitem" data-acao="excluir">Excluir</button>
              </div>
            </div>
          </span>
        </div>
      `).join('') : `<div class="ds-vazio"><p class="ds-vazio-titulo">${estadoProdutos.busca ? 'Nenhum produto bate com essa busca' : 'Nenhum produto cadastrado ainda'}</p></div>`;

      container.querySelectorAll('.ds-tabela-linha-clicavel').forEach((linha) => {
        linha.addEventListener('click', (e) => {
          if (e.target.closest('.ds-acoes')) return;
          abrirModalProduto(produtos.find((p) => p.id === linha.dataset.id));
        });
      });

      KyvvoDS.paginacaoAtualizar(document.getElementById('paginacao-produtos'), { total: totalProdutos, pagina: estadoProdutos.pagina, tamanho: estadoProdutos.tamanho });
    }

    document.getElementById('linhas-produtos').addEventListener('ds-acoes-escolher', async (e) => {
      const id = e.target.closest('[data-id]').dataset.id;
      const produto = produtos.find((p) => p.id === id);
      if (e.detail.acao === 'editar') {
        abrirModalProduto(produto);
      } else if (e.detail.acao === 'alternar') {
        await apiFetch(`/crm/api/produtos/${id}`, { method: 'PATCH', body: JSON.stringify({ ativo: produto.ativo === false }) });
        carregar();
      } else if (e.detail.acao === 'excluir') {
        confirmarAcao('Excluir produto?', 'Deseja excluir o produto?', async () => {
          await apiFetch(`/crm/api/produtos/${id}`, { method: 'DELETE' });
          carregar();
        }, { textoConfirmar: 'Confirmar', textoCancelar: 'Sair' });
      }
    });

    document.getElementById('paginacao-produtos').addEventListener('ds-paginacao-alterar', (e) => {
      estadoProdutos.pagina = e.detail.pagina;
      estadoProdutos.tamanho = e.detail.tamanho;
      carregar();
    });

    let debounceBuscaProduto;
    document.getElementById('input-busca-produto').addEventListener('input', (e) => {
      clearTimeout(debounceBuscaProduto);
      debounceBuscaProduto = setTimeout(() => {
        estadoProdutos.busca = e.target.value.trim();
        estadoProdutos.pagina = 1;
        carregar();
      }, 300);
    });

    function abrirModalProduto(produto) {
      const overlay = abrirModal(`<h3>${produto ? 'Editar produto' : 'Novo produto'}</h3>`, `
        <div class="ds-form">
          <div class="ds-form-grade">
            <div class="ds-campo ds-campo-largo"><label class="ds-rotulo" for="pr-nome">Nome</label><input class="ds-input" type="text" id="pr-nome" placeholder="ex.: Vaso decorativo P" value="${produto ? escapeHtml(produto.nome) : ''}"></div>
            <div class="ds-campo"><label class="ds-rotulo" for="pr-id">ID</label><input class="ds-input" type="text" id="pr-id" placeholder="SKU" value="${produto && produto.identificador_externo ? escapeHtml(produto.identificador_externo) : ''}"></div>
            <div class="ds-campo"><label class="ds-rotulo" for="pr-quantidade">Quantidade</label><input class="ds-input" type="text" inputmode="numeric" id="pr-quantidade" placeholder="0" value="${produto ? (produto.quantidade ?? 0) : ''}"></div>
            <div class="ds-campo"><label class="ds-rotulo" for="pr-preco">Valor</label><input class="ds-input" type="text" id="pr-preco" placeholder="0,00" value="${produto && produto.preco_referencia ? Number(produto.preco_referencia).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : ''}"></div>
            <div class="ds-campo"><label class="ds-rotulo" for="pr-observacao">Observação</label><input class="ds-input" type="text" id="pr-observacao" placeholder="opcional" value="${produto && produto.observacao ? escapeHtml(produto.observacao) : ''}"></div>
          </div>
          <div class="modal-erro" id="pr-erro"></div>
          <div class="ds-form-acoes">
            <button type="button" class="ds-btn ds-btn-secundario" id="pr-cancelar">Cancelar</button>
            <button type="button" class="ds-btn ds-btn-primario" id="pr-salvar">Salvar</button>
          </div>
        </div>
      `);
      aplicarMascaraMoeda(document.getElementById('pr-preco'));
      document.getElementById('pr-cancelar').addEventListener('click', fecharModal);
      document.getElementById('pr-salvar').addEventListener('click', async () => {
        const nome = document.getElementById('pr-nome').value.trim();
        if (!nome) { document.getElementById('pr-erro').textContent = 'Nome é obrigatório'; return; }
        const corpo = {
          nome,
          identificador_externo: document.getElementById('pr-id').value.trim() || null,
          quantidade: parseInt(document.getElementById('pr-quantidade').value, 10) || 0,
          preco_referencia: valorMoedaParaNumero(document.getElementById('pr-preco')) || null,
          observacao: document.getElementById('pr-observacao').value.trim() || null,
        };
        const res = produto
          ? await apiFetch(`/crm/api/produtos/${produto.id}`, { method: 'PATCH', body: JSON.stringify(corpo) })
          : await apiFetch('/crm/api/produtos', { method: 'POST', body: JSON.stringify(corpo) });
        if (!res.ok) { document.getElementById('pr-erro').textContent = 'Falha ao salvar'; return; }
        fecharModal();
        carregar();
      });
      return overlay;
    }

    document.getElementById('btn-novo-produto').addEventListener('click', () => abrirModalProduto(null));

    carregar();
  </script>
</body>
