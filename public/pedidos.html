<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo CRM — Pedidos</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('crm_tema')==='dark'?'dark':'light');})();</script>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/crm/shell.css">
<style>
  .filtros { display:grid; grid-template-columns:repeat(5,1fr); gap:0 12px; margin-bottom:8px; }
  .filtros > div { min-width:0; }
  .filtros label { margin-top:0; font-size:12px; }
  .filtros input, .filtros select { height:36px; font-size:13px; }
  @media(max-width:1100px) { .filtros { grid-template-columns:repeat(3,1fr); } }
  @media(max-width:640px) { .filtros { grid-template-columns:1fr 1fr; } }
  @media(max-width:420px) { .filtros { grid-template-columns:1fr; } }
  tr.linha-pedido { cursor:pointer; }
  tr.linha-pedido:hover td { background:var(--surface-hover); }
  tr.linha-pedido td { position:relative; }
  .menu-acoes-wrap { position:relative; display:inline-block; }
  .btn-acoes { background:transparent; color:var(--muted); width:32px; height:32px; padding:0; border-radius:6px; }
  .btn-acoes:hover { background:var(--surface-muted); color:var(--text); }
  .menu-acoes { position:absolute; right:0; top:36px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md);
    box-shadow:var(--shadow-md); min-width:190px; z-index:20; padding:6px; }
  .menu-acoes button { display:block; width:100%; text-align:left; background:transparent; color:var(--text); padding:8px 10px; border-radius:6px; font-size:13px; height:auto; }
  .menu-acoes button:hover { background:var(--surface-muted); }
  .menu-acoes button.perigo { color:var(--danger); }
  #tbody-pedidos .badge::before { display:none; }
  .badge-prioridade-altissima { background:color-mix(in srgb, var(--danger) 20%, transparent); color:var(--danger); }
  .badge-prioridade-alta { background:var(--warning-bg); color:var(--warning-text); }
  .badge-prioridade-media { background:color-mix(in srgb, #eab308 20%, transparent); color:#a16207; }
  .badge-prioridade-baixa { background:var(--success-bg); color:var(--success); }
  .modal-compacto input, .modal-compacto select { height:38px; }
  .lista-itens-pedido { border:1px solid var(--border); border-radius:var(--radius-md); padding:2px 10px; margin-top:6px; }
  .linha-item-pedido { padding:7px 0; border-top:1px solid var(--border); font-size:13px; color:var(--text-secondary); }
  .linha-item-pedido:first-child { border-top:none; }
</style>
</head>
<body>
  <header class="topo-app">
    <a class="topo-logo" href="/crm/painel.html" aria-label="Ir para o início">
      <img class="topo-logo-img js-logo-kyvvo" src="/ds/logo.svg" alt="Kyvvo">
      <span class="topo-produto-tag">CRM</span>
    </a>
    <div class="topo-direita">
    <div class="ds-notificacoes" id="notificacoes-sino">
      <button class="ds-notificacoes-btn" id="notificacoes-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Notificações">
        <span data-icon="bell" data-size="20"></span>
        <span class="ds-notificacoes-contagem" id="notificacoes-contagem" hidden></span>
      </button>
      <div class="ds-notificacoes-painel" role="menu" hidden>
        <div class="ds-notificacoes-lista" id="notificacoes-lista"></div>
      </div>
    </div>
    <div class="topo-perfil" id="topo-perfil">
      <button class="topo-perfil-gatilho" id="topo-perfil-gatilho" type="button" aria-haspopup="true" aria-expanded="false">
        <div class="avatar js-avatar-usuario"></div>
        <span class="nome js-nome-usuario"></span>
        <span data-icon="chevron-down" data-size="14"></span>
      </button>
      <div class="menu-perfil" id="menu-perfil" hidden>
        <div class="menu-perfil-usuario">
          <div class="avatar js-avatar-usuario"></div>
          <div class="textos">
            <div class="nome js-nome-usuario"></div>
            <div class="email js-email-usuario"></div>
          </div>
        </div>
        <div class="menu-perfil-divisor"></div>
        <div class="menu-perfil-item menu-perfil-tema">
          <span data-icon="sun-moon" data-size="16"></span><span class="rotulo">Tema</span>
          <button class="toggle-tema" type="button" role="switch" aria-checked="false" aria-label="Alternar tema claro/escuro"><span class="bolinha"></span></button>
        </div>
        <div class="menu-perfil-divisor"></div>
        <button class="menu-perfil-item perigo btn-sair" type="button">
          <span data-icon="log-out" data-size="16"></span><span class="rotulo">Sair da conta</span>
        </button>
      </div>
    </div>
    </div>
  </header>
  <div class="app-shell">
    <nav class="ds-menu" data-ds-menu id="painel-sidebar">
      <button type="button" class="ds-menu-toggle" id="btn-toggle-sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <ul class="ds-menu-lista">
        <li><a class="ds-menu-link" href="/crm/painel.html"><span class="ds-menu-icone" data-icon="layout-dashboard"></span><span class="ds-menu-rotulo">Painel Hoje</span></a></li>
        <li><a class="ds-menu-link" href="/crm/quadro.html"><span class="ds-menu-icone" data-icon="kanban"></span><span class="ds-menu-rotulo">Quadro</span></a></li>
        <li><a class="ds-menu-link" href="/crm/clientes.html"><span class="ds-menu-icone" data-icon="users"></span><span class="ds-menu-rotulo">Clientes</span></a></li>
        <li><a class="ds-menu-link" href="/crm/pedidos.html"><span class="ds-menu-icone" data-icon="list"></span><span class="ds-menu-rotulo">Pedidos</span></a></li>
        <li><a class="ds-menu-link" href="/crm/estoque.html"><span class="ds-menu-icone" data-icon="package"></span><span class="ds-menu-rotulo">Estoque</span></a></li>
        <li><a class="ds-menu-link" href="/crm/segmentos.html"><span class="ds-menu-icone" data-icon="funnel"></span><span class="ds-menu-rotulo">Campanhas</span></a></li>
        <li class="ds-menu-grupo">
          <button type="button" class="ds-menu-link ds-menu-grupo-botao" aria-expanded="false">
            <span class="ds-menu-icone" data-icon="settings"></span>
            <span class="ds-menu-rotulo">Configurações</span>
            <span class="ds-menu-seta" data-icon="chevron-down" data-size="14"></span>
          </button>
          <ul class="ds-menu-sub">
            <li><a class="ds-menu-sublink" href="/crm/opcoes-cadastro.html">Cadastro</a></li>
            <li><a class="ds-menu-sublink" href="/crm/whatsapp.html">WhatsApp</a></li>
            <li><a class="ds-menu-sublink" href="/crm/automacoes.html">Automações</a></li>
            <li><a class="ds-menu-sublink" href="/crm/notificacoes.html">Notificações</a></li>
            <li><a class="ds-menu-sublink" href="/crm/importacao.html">Importação</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <div class="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos">
          <div class="linha-titulo"><h1>Pedidos</h1></div>
          <p class="descricao" id="aviso-filtro-cliente" hidden>Mostrando só os pedidos deste cliente — <a href="/crm/pedidos.html">ver todos</a>.</p>
        </div>
        <div class="acoes">
          <button type="button" id="btn-novo-pedido"><span data-icon="plus" data-size="16"></span>Novo pedido</button>
        </div>
      </div>

      <div class="filtros">
        <div><label for="f-cliente">Cliente</label><input type="search" id="f-cliente" placeholder="Buscar cliente…"></div>
        <div><label for="f-etapa">Etapa</label><select id="f-etapa"><option value="">Qualquer</option></select></div>
        <div><label for="f-recurso">Recurso</label><select id="f-recurso"><option value="">Qualquer</option></select></div>
        <div><label for="f-pagamento">Pagamento</label>
          <select id="f-pagamento">
            <option value="">Qualquer</option>
            <option value="pendente">Pendente</option>
            <option value="parcial">Parcial</option>
            <option value="pago">Pago</option>
          </select>
        </div>
        <div><label for="f-prioridade">Prioridade</label>
          <select id="f-prioridade">
            <option value="">Qualquer</option>
            <option value="altissima">Altíssima</option>
            <option value="alta">Alta</option>
            <option value="media">Média</option>
            <option value="baixa">Baixa</option>
          </select>
        </div>
      </div>

      <div class="card" style="padding:0">
        <table>
          <thead>
            <tr><th>Cliente</th><th>Etapa</th><th>Prioridade</th><th>Pagamento</th><th>Valor do pedido</th><th>Data do pedido</th><th></th></tr>
          </thead>
          <tbody id="tbody-pedidos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer data-ds-rodape data-ds-produto="CRM"></footer>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    let pedidos = [];
    let etapas = [];
    let recursos = [];
    let produtos = [];
    let tiposEntrega = [];
    let termoBuscaCliente = '';

    // Atalho "Pedidos" no menu de ações de um cliente (tela de Clientes)
    // chega aqui como ?cliente_id=... — filtro fixo, não aparece nos
    // selects (não tem um pra "voltar" no meio dos outros filtros).
    const clienteIdFiltroFixo = new URLSearchParams(window.location.search).get('cliente_id');
    document.getElementById('aviso-filtro-cliente').hidden = !clienteIdFiltroFixo;

    async function carregar() {
      const params = new URLSearchParams();
      if (clienteIdFiltroFixo) params.set('cliente_id', clienteIdFiltroFixo);
      if (document.getElementById('f-etapa').value) params.set('etapa_id', document.getElementById('f-etapa').value);
      if (document.getElementById('f-recurso').value) params.set('recurso_id', document.getElementById('f-recurso').value);
      if (document.getElementById('f-pagamento').value) params.set('status_pagamento', document.getElementById('f-pagamento').value);
      if (document.getElementById('f-prioridade').value) params.set('prioridade', document.getElementById('f-prioridade').value);
      const qs = params.toString();

      const [resPedidos, resEtapas, resRecursos, resProdutos, resTiposEntrega] = await Promise.all([
        apiFetch(`/crm/api/pedidos${qs ? '?' + qs : ''}`),
        apiFetch('/crm/api/etapas'),
        apiFetch('/crm/api/recursos'),
        apiFetch('/crm/api/produtos'),
        apiFetch('/crm/api/opcoes-cadastro?tipo=tipo_entrega'),
      ]);
      pedidos = await resPedidos.json();
      etapas = await resEtapas.json();
      recursos = await resRecursos.json();
      produtos = await resProdutos.json();
      tiposEntrega = (await resTiposEntrega.json()).filter((o) => o.ativo);

      document.getElementById('f-etapa').innerHTML = '<option value="">Qualquer</option>' + etapas.map((e) => `<option value="${e.id}" ${e.id === document.getElementById('f-etapa').value ? 'selected' : ''}>${escapeHtml(e.nome)}</option>`).join('');
      document.getElementById('f-recurso').innerHTML = '<option value="">Qualquer</option>' + recursos.map((r) => `<option value="${r.id}">${escapeHtml(r.nome)}</option>`).join('');

      renderizar();
    }

    ['f-etapa', 'f-recurso', 'f-pagamento', 'f-prioridade'].forEach((id) => {
      document.getElementById(id).addEventListener('change', carregar);
    });

    let debounceBuscaCliente;
    document.getElementById('f-cliente').addEventListener('input', (e) => {
      clearTimeout(debounceBuscaCliente);
      debounceBuscaCliente = setTimeout(() => { termoBuscaCliente = e.target.value; renderizar(); }, 200);
    });

    const ROTULO_PRIORIDADE = { altissima: 'Altíssima', alta: 'Alta', media: 'Média', baixa: 'Baixa' };
    const BADGE_PRIORIDADE = { altissima: 'badge-prioridade-altissima', alta: 'badge-prioridade-alta', media: 'badge-prioridade-media', baixa: 'badge-prioridade-baixa' };
    const BADGE_PAGAMENTO = { pendente: 'perigo', parcial: 'aviso', pago: 'sucesso' };

    function renderizar() {
      const tbody = document.getElementById('tbody-pedidos');
      const termo = termoBuscaCliente.trim().toLowerCase();
      const lista = termo ? pedidos.filter((p) => (p.cliente_nome || '').toLowerCase().includes(termo)) : pedidos;
      if (!lista.length) {
        tbody.innerHTML = `<tr><td colspan="7"><div class="vazio">${pedidos.length ? 'Nenhum pedido bate com essa busca.' : 'Nenhum pedido com esses filtros.'}</div></td></tr>`;
        return;
      }
      tbody.innerHTML = lista.map((p) => {
        const etapa = etapas.find((e) => e.id === p.etapa_id);
        return `
        <tr class="linha-pedido" data-id="${p.id}">
          <td>${escapeHtml(p.cliente_nome)}</td>
          <td>${escapeHtml(etapa ? etapa.nome : '—')}</td>
          <td>${p.prioridade ? `<span class="badge ${BADGE_PRIORIDADE[p.prioridade]}">${ROTULO_PRIORIDADE[p.prioridade]}</span>` : '—'}</td>
          <td><span class="badge ${BADGE_PAGAMENTO[p.status_pagamento]}">${p.status_pagamento}</span></td>
          <td>${formatarMoeda(p.valor_total)}</td>
          <td>${formatarData(p.criado_em)}</td>
          <td>
            <div class="menu-acoes-wrap">
              <button type="button" class="btn-acoes" data-abrir-menu="${p.id}" aria-haspopup="true" aria-expanded="false">⋯</button>
              <div class="menu-acoes" data-menu="${p.id}" hidden>
                <button type="button" data-editar-pedido="${p.id}">Editar pedido</button>
                <button type="button" data-pagamento-confirmado="${p.id}">Confirmar Pagamento</button>
                <button type="button" data-acionar-cliente="${p.id}">Chamar Agente</button>
                <button type="button" data-chamar-whatsapp="${p.id}">WhatsApp</button>
                <button type="button" class="perigo" data-cancelar-pedido="${p.id}">Cancelar pedido</button>
              </div>
            </div>
          </td>
        </tr>
      `;
      }).join('');
      ligarEventosLinhas();
    }

    function fecharMenusAbertos() {
      document.querySelectorAll('.menu-acoes').forEach((m) => { m.hidden = true; });
    }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.menu-acoes-wrap')) fecharMenusAbertos();
    });

    function ligarEventosLinhas() {
      document.querySelectorAll('.linha-pedido').forEach((tr) => {
        tr.addEventListener('click', (e) => {
          if (e.target.closest('.menu-acoes-wrap')) return;
          abrirEdicaoPedido(tr.dataset.id);
        });
      });
      document.querySelectorAll('[data-abrir-menu]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const menu = document.querySelector(`[data-menu="${btn.dataset.abrirMenu}"]`);
          const jaAberto = !menu.hidden;
          fecharMenusAbertos();
          menu.hidden = jaAberto;
        });
      });
      document.querySelectorAll('[data-editar-pedido]').forEach((btn) => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); fecharMenusAbertos(); abrirEdicaoPedido(btn.dataset.editarPedido); });
      });
      document.querySelectorAll('[data-pagamento-confirmado]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          fecharMenusAbertos();
          await apiFetch(`/crm/api/pedidos/${btn.dataset.pagamentoConfirmado}/pagamento`, {
            method: 'PATCH',
            body: JSON.stringify({ status_pagamento: 'pago' }),
          });
          carregar();
        });
      });
      // "Chamar Agente" abre a conversa do bot com esse cliente
      // (Configurações > WhatsApp > Conversas) — "WhatsApp" preserva
      // o comportamento antigo (wa.me direto, fora do bot).
      document.querySelectorAll('[data-acionar-cliente]').forEach((btn) => {
        btn.addEventListener('click', () => {
          fecharMenusAbertos();
          const p = pedidos.find((x) => x.id === btn.dataset.acionarCliente);
          if (p && p.cliente_telefone) window.location.href = `/crm/whatsapp.html?telefone=${encodeURIComponent(p.cliente_telefone)}`;
        });
      });
      document.querySelectorAll('[data-chamar-whatsapp]').forEach((btn) => {
        btn.addEventListener('click', () => {
          fecharMenusAbertos();
          const p = pedidos.find((x) => x.id === btn.dataset.chamarWhatsapp);
          if (p && p.cliente_telefone) window.open(linkWhatsapp(p.cliente_telefone), '_blank', 'noopener');
        });
      });
      document.querySelectorAll('[data-cancelar-pedido]').forEach((btn) => {
        btn.addEventListener('click', () => { fecharMenusAbertos(); confirmarCancelarPedido(btn.dataset.cancelarPedido); });
      });
    }

    function confirmarCancelarPedido(pedidoId) {
      const overlay = abrirModal('<h3>Cancelar pedido?</h3>', `
        <p class="modal-texto">Essa ação não pode ser desfeita. O pedido vai pra etapa de "perdido".</p>
        <label for="cancelar-motivo">Motivo</label>
        <textarea id="cancelar-motivo" placeholder="ex.: cliente desistiu, não respondeu, preço..."></textarea>
        <div class="modal-erro" id="cancelar-erro"></div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="cancelar-voltar">Voltar</button>
          <button type="button" class="btn-perigo" id="cancelar-confirmar">Cancelar pedido</button>
        </div>
      `);
      document.getElementById('cancelar-voltar').addEventListener('click', fecharModal);
      document.getElementById('cancelar-confirmar').addEventListener('click', async () => {
        const motivo = document.getElementById('cancelar-motivo').value.trim();
        if (!motivo) { document.getElementById('cancelar-erro').textContent = 'Motivo é obrigatório'; return; }
        const res = await apiFetch(`/crm/api/pedidos/${pedidoId}/cancelar`, { method: 'POST', body: JSON.stringify({ motivo }) });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('cancelar-erro').textContent = dados.error || 'Falha ao cancelar pedido';
          return;
        }
        fecharModal();
        carregar();
      });
    }

    // --- Editar pedido (etapa/recurso/prioridade/pagamento, mesmo shape do
    // modal de detalhe do Quadro) ---------------------------------------------
    const ORIGENS_MARKETPLACE = ['shopee', 'tiktok', 'mercado livre', 'mercadolivre', ' ml'];
    function ehOrigemPropria(origem) {
      const o = ` ${(origem || '').toLowerCase()}`;
      return !ORIGENS_MARKETPLACE.some((m) => o.includes(m));
    }

    function pedirMotivoPerda() {
      return new Promise((resolve) => {
        const overlay = abrirModal('<h3>Motivo da perda</h3>', `
          <label for="motivo-perda-texto">Por que este pedido foi perdido?</label>
          <textarea id="motivo-perda-texto" placeholder="ex.: cliente desistiu, não respondeu, preço..."></textarea>
          <div class="modal-erro" id="motivo-perda-erro"></div>
          <div class="modal-acoes">
            <button type="button" class="btn-secundario" id="motivo-perda-cancelar">Cancelar</button>
            <button type="button" class="btn-perigo" id="motivo-perda-confirmar">Marcar como perdido</button>
          </div>
        `);
        let resolvido = false;
        const finalizar = (valor) => { if (!resolvido) { resolvido = true; resolve(valor); } };
        document.getElementById('motivo-perda-cancelar').addEventListener('click', () => { finalizar(null); fecharModal(); });
        document.getElementById('motivo-perda-confirmar').addEventListener('click', () => {
          const texto = document.getElementById('motivo-perda-texto').value.trim();
          if (!texto) { document.getElementById('motivo-perda-erro').textContent = 'Motivo é obrigatório'; return; }
          finalizar(texto);
          fecharModal();
        });
        overlay.querySelector('#modal-close').addEventListener('click', () => finalizar(null));
        overlay.addEventListener('click', (e) => { if (e.target === overlay) finalizar(null); });
      });
    }

    function abrirEdicaoPedido(pedidoId) {
      const p = pedidos.find((x) => x.id === pedidoId);
      if (!p) return;
      abrirModal(`<h3>${escapeHtml(p.cliente_nome)}</h3>`, `
        <p class="modal-texto">${escapeHtml(p.cliente_telefone || 'sem telefone')} · ${escapeHtml(p.origem)}</p>
        ${ehOrigemPropria(p.origem) ? `<div class="banner-assinatura" style="margin-top:12px"><span>📦 Pedido de canal próprio — não esqueça o cartão de recompra no kit.</span></div>` : ''}
        <div class="grid2">
          <div><label for="e-etapa">Etapa</label>
            <select id="e-etapa">${etapas.map((et) => `<option value="${et.id}" ${et.id === p.etapa_id ? 'selected' : ''}>${escapeHtml(et.nome)}</option>`).join('')}</select>
          </div>
          <div><label for="e-prioridade">Prioridade</label>
            <select id="e-prioridade">
              <option value="">Nenhuma</option>
              <option value="altissima" ${p.prioridade === 'altissima' ? 'selected' : ''}>Altíssima</option>
              <option value="alta" ${p.prioridade === 'alta' ? 'selected' : ''}>Alta</option>
              <option value="media" ${p.prioridade === 'media' ? 'selected' : ''}>Média</option>
              <option value="baixa" ${p.prioridade === 'baixa' ? 'selected' : ''}>Baixa</option>
            </select>
          </div>
        </div>
        <div class="grid2">
          <div><label for="e-status">Pagamento</label>
            <select id="e-status">
              <option value="pendente" ${p.status_pagamento === 'pendente' ? 'selected' : ''}>Pendente</option>
              <option value="parcial" ${p.status_pagamento === 'parcial' ? 'selected' : ''}>Parcial</option>
              <option value="pago" ${p.status_pagamento === 'pago' ? 'selected' : ''}>Pago</option>
            </select>
          </div>
          <div><label for="e-recebido">Valor recebido</label><input id="e-recebido" inputmode="decimal"></div>
        </div>
        <div class="grid2">
          <div><label for="e-tipo-entrega">Tipo de frete</label>
            <select id="e-tipo-entrega"><option value="">Selecione…</option>${tiposEntrega.map((o) => `<option value="${escapeHtml(o.valor)}" ${o.valor === p.tipo_entrega ? 'selected' : ''}>${escapeHtml(o.valor)}</option>`).join('')}</select>
          </div>
          <div><label for="e-frete">Valor de frete</label><input id="e-frete" inputmode="decimal" placeholder="0,00"></div>
        </div>
        <label for="e-entrega">Data de entrega</label><input id="e-entrega" type="date" value="${p.data_entrega ? p.data_entrega.slice(0, 10) : ''}">
        <label for="e-observacoes">Observação</label>
        <textarea id="e-observacoes" placeholder="opcional">${p.observacoes ? escapeHtml(p.observacoes) : ''}</textarea>
        ${p.itens && p.itens.length ? `
          <label>Itens do pedido</label>
          <div class="lista-itens-pedido">
            ${p.itens.map((i) => `<div class="linha-item-pedido">${i.quantidade}x ${escapeHtml(i.descricao || 'Item sem descrição')}</div>`).join('')}
          </div>
        ` : ''}
        <p class="modal-texto" style="margin-top:14px">Valor do pedido: ${formatarMoeda(p.valor_total)}</p>
        <div class="modal-erro" id="e-erro"></div>
        <div class="modal-acoes" style="justify-content:flex-end">
          <button type="button" id="btn-salvar-edicao">Salvar</button>
        </div>
      `, 'modal-compacto');
      const campoRecebido = document.getElementById('e-recebido');
      campoRecebido.value = Number(p.valor_recebido || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      aplicarMascaraMoeda(campoRecebido);
      const campoFreteEdicao = document.getElementById('e-frete');
      campoFreteEdicao.value = p.frete ? Number(p.frete).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
      aplicarMascaraMoeda(campoFreteEdicao);

      document.getElementById('btn-salvar-edicao').addEventListener('click', async () => {
        const novaEtapaId = document.getElementById('e-etapa').value;
        const novaPrioridade = document.getElementById('e-prioridade').value || null;
        const novoStatus = document.getElementById('e-status').value;
        const novoRecebido = valorMoedaParaNumero(campoRecebido);

        if (novaEtapaId !== p.etapa_id) {
          const etapaAlvo = etapas.find((et) => et.id === novaEtapaId);
          let motivoPerda;
          if (etapaAlvo.tipo === 'perdida') {
            motivoPerda = await pedirMotivoPerda();
            if (!motivoPerda) return;
          }
          const res = await apiFetch(`/crm/api/pedidos/${p.id}/etapa`, { method: 'PATCH', body: JSON.stringify({ etapa_id: novaEtapaId, motivo_perda: motivoPerda }) });
          if (!res.ok) {
            const dados = await res.json().catch(() => ({}));
            document.getElementById('e-erro').textContent = dados.error || 'Falha ao mover etapa';
            return;
          }
        }
        if (novaPrioridade !== (p.prioridade || null)) {
          const res = await apiFetch(`/crm/api/pedidos/${p.id}/prioridade`, { method: 'PATCH', body: JSON.stringify({ prioridade: novaPrioridade }) });
          if (!res.ok) { document.getElementById('e-erro').textContent = 'Falha ao atualizar prioridade'; return; }
        }
        const res = await apiFetch(`/crm/api/pedidos/${p.id}/pagamento`, { method: 'PATCH', body: JSON.stringify({ status_pagamento: novoStatus, valor_recebido: novoRecebido }) });
        if (!res.ok) { document.getElementById('e-erro').textContent = 'Falha ao salvar pagamento'; return; }

        const novaEntrega = document.getElementById('e-entrega').value || null;
        const novoTipoEntrega = document.getElementById('e-tipo-entrega').value || null;
        const novoFrete = valorMoedaParaNumero(campoFreteEdicao) || null;
        const novaObservacao = document.getElementById('e-observacoes').value.trim() || null;
        const entregaMudou = novaEntrega !== (p.data_entrega ? p.data_entrega.slice(0, 10) : null)
          || novoTipoEntrega !== (p.tipo_entrega || null)
          || novoFrete !== (p.frete != null ? Number(p.frete) : null)
          || novaObservacao !== (p.observacoes || null);
        if (entregaMudou) {
          const resEntrega = await apiFetch(`/crm/api/pedidos/${p.id}/entrega`, {
            method: 'PATCH',
            body: JSON.stringify({ data_entrega: novaEntrega, tipo_entrega: novoTipoEntrega, frete: novoFrete, observacoes: novaObservacao }),
          });
          if (!resEntrega.ok) { document.getElementById('e-erro').textContent = 'Falha ao salvar dados de entrega'; return; }
        }

        fecharModal();
        carregar();
      });
    }

    // --- Novo pedido (US do Bruno: saiu do Quadro, mora só aqui agora) -------
    document.getElementById('btn-novo-pedido').addEventListener('click', () => {
      fecharMenusAbertos();
      const opcoesRecurso = recursos.map((r) => `<option value="${r.id}">${escapeHtml(r.nome)}</option>`).join('');
      const opcoesProduto = produtos.map((p) => `<option value="${p.id}" data-preco="${p.preco_referencia || ''}">${escapeHtml(p.nome)}</option>`).join('');
      const opcoesTipoEntrega = tiposEntrega.map((o) => `<option value="${escapeHtml(o.valor)}">${escapeHtml(o.valor)}</option>`).join('');
      abrirModal('<h3>Novo pedido</h3>', `
        <div class="grid2">
          <div><label for="p-telefone">Telefone do cliente</label><input id="p-telefone" placeholder="(34) 99999-9999"></div>
          <div><label for="p-nome-cliente">Nome (se cliente novo)</label><input id="p-nome-cliente"></div>
        </div>
        ${produtos.length ? `
        <label for="p-produto">Produto do catálogo (opcional)</label>
        <select id="p-produto"><option value="">— escolher da lista preenche descrição e valor —</option>${opcoesProduto}</select>
        ` : ''}
        <div class="grid2">
          <div><label for="p-descricao">Item / descrição</label><input id="p-descricao" placeholder="ex.: Vaso decorativo P"></div>
          <div><label for="p-quantidade">Quantidade</label><input id="p-quantidade" type="number" min="1" step="1" value="1"></div>
        </div>
        <div class="grid2">
          <div><label for="p-valor">Valor do pedido</label><input id="p-valor" inputmode="decimal" placeholder="0,00"></div>
          <div><label for="p-origem">Origem<span class="obrigatorio">*</span></label><input id="p-origem" placeholder="whatsapp, shopee, site…" required></div>
        </div>
        <div class="grid2">
          <div><label for="p-tipo-entrega">Tipo de frete</label>
            <select id="p-tipo-entrega"><option value="">Selecione…</option>${opcoesTipoEntrega}</select>
          </div>
          <div><label for="p-frete">Valor de frete</label><input id="p-frete" inputmode="decimal" placeholder="0,00"></div>
        </div>
        <div class="grid2">
          <div><label for="p-data-entrega">Data de entrega</label><input id="p-data-entrega" type="date"></div>
          <div><label for="p-recurso">Recurso</label>
            <select id="p-recurso"><option value="">Sem recurso</option>${opcoesRecurso}</select>
          </div>
        </div>
        <div class="modal-erro" id="p-erro"></div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="btn-cancelar-pedido">Cancelar</button>
          <button type="button" id="btn-salvar-pedido">Criar pedido</button>
        </div>
      `);
      const campoValorPedido = document.getElementById('p-valor');
      aplicarMascaraMoeda(campoValorPedido);
      const campoFrete = document.getElementById('p-frete');
      aplicarMascaraMoeda(campoFrete);
      const selectProduto = document.getElementById('p-produto');
      if (selectProduto) {
        selectProduto.addEventListener('change', () => {
          const opcao = selectProduto.selectedOptions[0];
          if (!opcao.value) return;
          document.getElementById('p-descricao').value = opcao.textContent;
          if (opcao.dataset.preco) {
            campoValorPedido.value = Number(opcao.dataset.preco).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          }
        });
      }
      document.getElementById('btn-cancelar-pedido').addEventListener('click', fecharModal);
      document.getElementById('btn-salvar-pedido').addEventListener('click', async () => {
        const origem = document.getElementById('p-origem').value.trim();
        if (!origem) { document.getElementById('p-erro').textContent = 'Origem é obrigatória'; return; }
        const res = await apiFetch('/crm/api/pedidos', {
          method: 'POST',
          body: JSON.stringify({
            telefone: document.getElementById('p-telefone').value.trim() || null,
            nome_cliente: document.getElementById('p-nome-cliente').value.trim() || null,
            produto_id: selectProduto ? (selectProduto.value || null) : null,
            descricao: document.getElementById('p-descricao').value.trim() || null,
            quantidade: Number(document.getElementById('p-quantidade').value) || 1,
            valor_total: valorMoedaParaNumero(campoValorPedido),
            origem,
            tipo_entrega: document.getElementById('p-tipo-entrega').value || null,
            frete: valorMoedaParaNumero(campoFrete) || null,
            data_entrega: document.getElementById('p-data-entrega').value || null,
            recurso_id: document.getElementById('p-recurso').value || null,
          }),
        });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('p-erro').textContent = dados.error || 'Falha ao criar pedido';
          return;
        }
        fecharModal();
        carregar();
      });
    });

    carregar();
  </script>
</body>
</html>
