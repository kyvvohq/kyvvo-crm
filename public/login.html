<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo CRM — Login</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('crm_tema')==='dark'?'dark':'light');})();</script>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/crm/shell.css">
<style>
  /* Página sem sidebar/topbar (fluxo de autenticação) — mesmo
     tokens.css/components.css/shell.css do resto do CRM (2026-10-03: antes
     era tudo hex fixo, sem suporte a tema escuro). */
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:var(--font-ui); }
  .login-card { width:100%; max-width:360px; }
  .login-logo { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .login-logo img { height:22px; width:auto; }
  .login-logo .nome { font-size:16px; font-weight:700; font-family:var(--font-titulo); }
  .login-rodape { text-align:center; font-size:13px; color:var(--muted); margin-top:18px; }
  .login-rodape a { color:var(--accent); font-weight:600; text-decoration:none; }
  .erro { color:var(--danger); font-size:13px; margin-top:12px; min-height:16px; }
</style>
</head>
<body>
  <form class="card login-card" id="form">
    <div class="login-logo"><img src="/ds/logo.svg" class="js-logo-kyvvo" alt="Kyvvo"><div class="nome">Kyvvo CRM</div></div>
    <label for="email">E-mail</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="senha">Senha</label>
    <input id="senha" type="password" required autocomplete="current-password">
    <div class="erro" id="erro"></div>
    <button type="submit" id="btn" style="width:100%;margin-top:24px">Entrar</button>
  </form>
  <p class="login-rodape">Ainda não tem conta? <a href="/crm/cadastro.html">Criar conta</a></p>
  <script>
    // Logo clara/escura conforme o tema — mesma lógica de aplicarLogos()
    // em shell.js, só que inline aqui porque esta página não carrega
    // shell.js (não tem topbar/sidebar autenticados).
    document.querySelectorAll('.js-logo-kyvvo').forEach((img) => {
      img.src = document.documentElement.getAttribute('data-theme') === 'dark' ? '/ds/logo-dark.svg' : '/ds/logo.svg';
    });

    const form = document.getElementById('form');
    const erro = document.getElementById('erro');
    const btn = document.getElementById('btn');

    if (localStorage.getItem('crm_token')) {
      window.location.href = '/crm/painel.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erro.textContent = '';
      btn.disabled = true;
      try {
        const res = await fetch('/crm/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Falha no login');
        localStorage.setItem('crm_token', data.token);
        localStorage.setItem('crm_nome', data.nome || '');
        window.location.href = data.onboarding_pendente ? '/crm/onboarding.html' : '/crm/painel.html';
      } catch (err) {
        erro.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
