<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo CRM — Formulário</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px;
    background:#F8F9FC; color:#0F111A; font-family:'Inter',Arial,Helvetica,sans-serif; }
  .card { width:100%; max-width:420px; background:#FFFFFF; border:1px solid #E7EAF2; border-radius:16px; padding:32px; }
  .logo { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .logo img { height:22px; }
  h1 { font-size:19px; margin:0 0 20px; }
  label { display:block; font-size:13px; font-weight:600; color:#2B3040; margin:14px 0 7px; }
  input, textarea { width:100%; box-sizing:border-box; background:#fff; border:1px solid #D7DCE8; border-radius:12px;
    height:44px; padding:0 14px; color:#0F111A; font-size:14px; font-family:inherit; }
  textarea { height:auto; min-height:70px; padding:10px 14px; resize:vertical; }
  .checkbox-linha { display:flex; align-items:flex-start; gap:8px; margin-top:16px; }
  .checkbox-linha input { width:auto; height:auto; margin-top:2px; }
  .checkbox-linha span { font-size:12.5px; color:#4A4F63; line-height:1.5; }
  button { width:100%; margin-top:20px; background:#7C5CFC; color:#fff; font-weight:600; border:none;
    border-radius:12px; height:44px; font-size:14px; cursor:pointer; }
  button:hover { background:#6344E8; }
  button:disabled { opacity:.6; cursor:default; }
  .erro { color:#F04438; font-size:13px; margin-top:12px; min-height:16px; }
  .sucesso { text-align:center; }
  .sucesso .check { font-size:40px; margin-bottom:10px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo"><img src="/ds/logo.svg" alt="Kyvvo"></div>
    <p>Carregando…</p>
  </div>
  <script>
    const id = new URLSearchParams(window.location.search).get('id');
    const card = document.getElementById('card');

    function erroCarregar(msg) {
      card.innerHTML = `<div class="logo"><img src="/ds/logo.svg" alt="Kyvvo"></div><p>${msg}</p>`;
    }

    async function carregar() {
      if (!id) { erroCarregar('Link inválido.'); return; }
      const res = await fetch(`/crm/api/formularios/publico/${id}`);
      if (!res.ok) { erroCarregar('Este formulário não está mais disponível.'); return; }
      const formulario = await res.json();
      renderizarForm(formulario);
    }

    function renderizarForm(formulario) {
      const extras = Array.isArray(formulario.campos) ? formulario.campos : [];
      card.innerHTML = `
        <div class="logo"><img src="/ds/logo.svg" alt="Kyvvo"></div>
        <h1>${escapeHtmlLocal(formulario.nome)}</h1>
        <form id="form">
          <label for="nome">Nome</label>
          <input id="nome" required>
          <label for="telefone">WhatsApp (com DDD)</label>
          <input id="telefone" type="tel" placeholder="(34) 99999-9999" required>
          <label for="email">E-mail (opcional)</label>
          <input id="email" type="email">
          ${extras.map((pergunta, i) => `
            <label for="extra-${i}">${escapeHtmlLocal(pergunta)}</label>
            <input id="extra-${i}" data-extra="${escapeHtmlLocal(pergunta)}">
          `).join('')}
          <div class="checkbox-linha">
            <input type="checkbox" id="aceite">
            <span>Aceito receber comunicação da empresa por WhatsApp e/ou e-mail.</span>
          </div>
          <div class="erro" id="erro"></div>
          <button type="submit" id="btn">Enviar</button>
        </form>
      `;
      document.getElementById('form').addEventListener('submit', enviar);
    }

    async function enviar(e) {
      e.preventDefault();
      const erroEl = document.getElementById('erro');
      const btn = document.getElementById('btn');
      erroEl.textContent = '';

      const nome = document.getElementById('nome').value.trim();
      const telefone = document.getElementById('telefone').value.trim();
      const aceite = document.getElementById('aceite').checked;
      if (!nome || !telefone) { erroEl.textContent = 'Nome e WhatsApp são obrigatórios.'; return; }
      if (!aceite) { erroEl.textContent = 'Você precisa aceitar receber comunicação pra enviar.'; return; }

      const extras = {};
      document.querySelectorAll('[data-extra]').forEach((input) => {
        extras[input.dataset.extra] = input.value.trim();
      });

      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        const res = await fetch(`/crm/api/formularios/publico/${id}/responder`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nome,
            telefone,
            email: document.getElementById('email').value.trim() || null,
            aceite_comunicacao: aceite,
            extras,
          }),
        });
        const dados = await res.json().catch(() => ({}));
        if (!res.ok) { erroEl.textContent = dados.error || 'Falha ao enviar. Tente novamente.'; btn.disabled = false; btn.textContent = 'Enviar'; return; }
        card.innerHTML = `
          <div class="sucesso">
            <div class="check">✅</div>
            <h1>Recebemos sua resposta!</h1>
            <p style="color:#6B7086;font-size:13.5px">Obrigado por preencher.</p>
          </div>
        `;
      } catch (err) {
        erroEl.textContent = 'Falha ao enviar. Verifique sua conexão e tente de novo.';
        btn.disabled = false;
        btn.textContent = 'Enviar';
      }
    }

    function escapeHtmlLocal(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    carregar();
  </script>
</body>
</html>
