<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo CRM — Clientes</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('crm_tema')==='dark'?'dark':'light');})();</script>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/crm/shell.css">
<style>
  .busca { max-width:320px; }
  .busca input { height:40px; }
  tr.linha-cliente { cursor:pointer; }
  tr.linha-cliente:hover td { background:var(--surface-hover); }
  tr.linha-cliente td { position:relative; }
  .menu-acoes-wrap { position:relative; display:inline-block; }
  .btn-acoes { background:transparent; color:var(--muted); width:32px; height:32px; padding:0; border-radius:6px; }
  .btn-acoes:hover { background:var(--surface-muted); color:var(--text); }
  .menu-acoes { position:absolute; right:0; top:36px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md);
    box-shadow:var(--shadow-md); min-width:190px; z-index:20; padding:6px; }
  .menu-acoes button { display:block; width:100%; text-align:left; background:transparent; color:var(--text); padding:8px 10px; border-radius:6px; font-size:13px; height:auto; }
  .menu-acoes button:hover { background:var(--surface-muted); }
  .menu-acoes button.perigo { color:var(--danger); }
  .badge-bloqueado { background:color-mix(in srgb, var(--danger) 20%, transparent); color:var(--danger); }
</style>
</head>
<body>
  <header class="topo-app">
    <a class="topo-logo" href="/crm/painel.html" aria-label="Ir para o início">
      <img class="topo-logo-img js-logo-kyvvo" src="/ds/logo.svg" alt="Kyvvo">
      <span class="topo-produto-tag">CRM</span>
    </a>
    <div class="topo-perfil" id="topo-perfil">
      <button class="topo-perfil-gatilho" id="topo-perfil-gatilho" type="button" aria-haspopup="true" aria-expanded="false">
        <div class="avatar js-avatar-usuario"></div>
        <span class="nome js-nome-usuario"></span>
        <span data-icon="chevron-down" data-size="14"></span>
      </button>
      <div class="menu-perfil" id="menu-perfil" hidden>
        <div class="menu-perfil-usuario">
          <div class="avatar js-avatar-usuario"></div>
          <div class="textos">
            <div class="nome js-nome-usuario"></div>
            <div class="email js-email-usuario"></div>
          </div>
        </div>
        <div class="menu-perfil-divisor"></div>
        <div class="menu-perfil-item menu-perfil-tema">
          <span data-icon="sun-moon" data-size="16"></span><span class="rotulo">Tema</span>
          <button class="toggle-tema" type="button" role="switch" aria-checked="false" aria-label="Alternar tema claro/escuro"><span class="bolinha"></span></button>
        </div>
        <div class="menu-perfil-divisor"></div>
        <button class="menu-perfil-item perigo btn-sair" type="button">
          <span data-icon="log-out" data-size="16"></span><span class="rotulo">Sair da conta</span>
        </button>
      </div>
    </div>
  </header>
  <div class="app-shell">
    <div class="sidebar-wrap">
      <aside class="painel-sidebar" id="painel-sidebar">
      <nav class="grupo-menu">
        <div class="grupo-titulo">Kyvvo CRM</div>
        <a class="menu-item" href="/crm/painel.html"><span data-icon="layout-dashboard"></span><span class="rotulo">Painel Hoje</span></a>
        <a class="menu-item" href="/crm/clientes.html"><span data-icon="users"></span><span class="rotulo">Clientes</span></a>
        <a class="menu-item" href="/crm/quadro.html"><span data-icon="kanban"></span><span class="rotulo">Quadro</span></a>
        <a class="menu-item" href="/crm/pedidos.html"><span data-icon="list"></span><span class="rotulo">Pedidos</span></a>
        <a class="menu-item" href="/crm/segmentos.html"><span data-icon="funnel"></span><span class="rotulo">Campanhas</span></a>
        <div class="ds-menu-grupo">
          <button type="button" class="menu-item ds-menu-grupo-botao" aria-expanded="false" style="width:100%;border:none;background:transparent;font:inherit;cursor:pointer;text-align:left">
            <span data-icon="settings"></span><span class="rotulo">Configurações</span>
            <span class="ds-menu-seta" data-icon="chevron-down" data-size="14"></span>
          </button>
          <div class="ds-menu-sub">
            <a class="ds-menu-sublink" href="/crm/automacoes.html">Automações</a>
          </div>
        </div>
      </nav>
      </aside>
      <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" type="button" aria-label="Ocultar menu" title="Ocultar menu">&lt;</button>
    </div>

    <div class="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos">
          <div class="linha-titulo"><h1>Clientes</h1><span class="contagem" id="contagem-clientes">—</span></div>
        </div>
        <div class="acoes">
          <button type="button" class="btn-secundario" id="btn-importar">Importar CSV</button>
          <button type="button" class="btn-secundario" id="btn-duplicados">Duplicados</button>
          <button type="button" class="btn-secundario" id="btn-gerenciar-formularios">Formulários</button>
          <button type="button" id="btn-novo-cliente"><span data-icon="plus" data-size="16"></span>Novo cliente</button>
        </div>
      </div>

      <div class="busca">
        <input type="search" id="input-busca" placeholder="Buscar por nome, telefone ou CPF…">
      </div>

      <div class="card" style="padding:0">
        <table>
          <thead>
            <tr><th>Nome</th><th>Telefone</th><th>Cidade</th><th>Segmento</th><th>Origem</th><th>Desde</th><th></th></tr>
          </thead>
          <tbody id="tbody-clientes"></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer data-ds-rodape></footer>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    let clientes = [];
    let tags = [];
    let formularios = [];

    async function carregar(busca) {
      const qs = busca ? `?busca=${encodeURIComponent(busca)}` : '';
      const [resClientes, resTags, resFormularios] = await Promise.all([
        apiFetch(`/crm/api/clientes${qs}`),
        apiFetch('/crm/api/tags'),
        apiFetch('/crm/api/formularios'),
      ]);
      clientes = await resClientes.json();
      tags = await resTags.json();
      formularios = await resFormularios.json();
      renderizar();
    }

    function renderizar() {
      document.getElementById('contagem-clientes').textContent = clientes.length;
      const tbody = document.getElementById('tbody-clientes');
      if (!clientes.length) {
        tbody.innerHTML = `<tr><td colspan="7"><div class="vazio">Nenhum cliente ainda — cadastre o primeiro ou espere o primeiro pedido chegar.</div></td></tr>`;
        return;
      }
      tbody.innerHTML = clientes.map((c) => `
        <tr class="linha-cliente" data-id="${c.id}">
          <td>${escapeHtml(c.nome)} ${c.bloqueado ? '<span class="badge badge-bloqueado">Bloqueado</span>' : ''}</td>
          <td>${escapeHtml(c.telefone || '—')}</td>
          <td>${escapeHtml([c.cidade, c.uf].filter(Boolean).join('/') || '—')}</td>
          <td>${escapeHtml(c.segmento || '—')}</td>
          <td>${escapeHtml(c.origem || '—')}</td>
          <td>${formatarData(c.criado_em)}</td>
          <td>
            <div class="menu-acoes-wrap">
              <button type="button" class="btn-acoes" data-abrir-menu="${c.id}" aria-haspopup="true" aria-expanded="false">⋯</button>
              <div class="menu-acoes" data-menu="${c.id}" hidden>
                <button type="button" data-editar-cliente="${c.id}">Editar</button>
                <button type="button" data-alternar-bloqueio="${c.id}" data-bloqueado="${!c.bloqueado}">${c.bloqueado ? 'Desbloquear' : 'Bloquear'}</button>
                <button type="button" data-ver-pedidos="${c.id}">Pedidos</button>
                <button type="button" data-atendimento="${c.id}">Atendimento</button>
              </div>
            </div>
          </td>
        </tr>
      `).join('');
      tbody.querySelectorAll('.linha-cliente').forEach((tr) => {
        tr.addEventListener('click', (e) => {
          if (e.target.closest('.menu-acoes-wrap')) return;
          window.location.href = `/crm/cliente-detalhe.html?id=${tr.dataset.id}`;
        });
      });
      ligarEventosLinhasClientes();
    }

    function fecharMenusAbertosClientes() {
      document.querySelectorAll('.menu-acoes').forEach((m) => { m.hidden = true; });
    }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.menu-acoes-wrap')) fecharMenusAbertosClientes();
    });

    function ligarEventosLinhasClientes() {
      document.querySelectorAll('[data-abrir-menu]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const menu = document.querySelector(`[data-menu="${btn.dataset.abrirMenu}"]`);
          const jaAberto = !menu.hidden;
          fecharMenusAbertosClientes();
          menu.hidden = jaAberto;
        });
      });
      document.querySelectorAll('[data-editar-cliente]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          window.location.href = `/crm/cliente-detalhe.html?id=${btn.dataset.editarCliente}`;
        });
      });
      document.querySelectorAll('[data-alternar-bloqueio]').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          fecharMenusAbertosClientes();
          await apiFetch(`/crm/api/clientes/${btn.dataset.alternarBloqueio}`, {
            method: 'PATCH',
            body: JSON.stringify({ bloqueado: btn.dataset.bloqueado === 'true' }),
          });
          carregar();
        });
      });
      document.querySelectorAll('[data-ver-pedidos]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          window.location.href = `/crm/pedidos.html?cliente_id=${btn.dataset.verPedidos}`;
        });
      });
      document.querySelectorAll('[data-atendimento]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          fecharMenusAbertosClientes();
          const c = clientes.find((x) => x.id === btn.dataset.atendimento);
          if (c && c.telefone) window.open(linkWhatsapp(c.telefone), '_blank', 'noopener');
        });
      });
    }

    let debounceBusca;
    document.getElementById('input-busca').addEventListener('input', (e) => {
      clearTimeout(debounceBusca);
      debounceBusca = setTimeout(() => carregar(e.target.value.trim()), 300);
    });

    // --- Formulário de captação (US22) --------------------------------------
    document.getElementById('btn-gerenciar-formularios').addEventListener('click', () => abrirModalFormularios());

    function abrirModalFormularios() {
      const opcoesTag = tags.map((t) => `<option value="${t.id}">${escapeHtml(t.nome)}</option>`).join('');
      abrirModal('<h3>Formulários de captação</h3>', `
        <p class="modal-texto">Link público pra pessoa se cadastrar sozinha (ex.: grupo VIP) — substitui Google Forms e já cai na sua base.</p>
        <div id="lista-formularios"></div>
        <label for="fm-nome">Novo formulário</label>
        <input type="text" id="fm-nome" placeholder="ex.: Sorteio VIP 200">
        <label for="fm-tag">Aplica a tag (opcional)</label>
        <select id="fm-tag"><option value="">Nenhuma</option>${opcoesTag}</select>
        <label for="fm-perguntas">Perguntas extras (uma por linha, além de nome/WhatsApp/e-mail)</label>
        <textarea id="fm-perguntas" placeholder="ex.: Quantas peças por mês você revende?"></textarea>
        <div class="modal-erro" id="fm-erro"></div>
        <div class="modal-acoes">
          <button type="button" id="fm-adicionar">Criar formulário</button>
        </div>
      `, 'modal-card-larga');
      renderizarListaFormularios();
      document.getElementById('fm-adicionar').addEventListener('click', async () => {
        const nome = document.getElementById('fm-nome').value.trim();
        if (!nome) { document.getElementById('fm-erro').textContent = 'Nome é obrigatório'; return; }
        const campos = document.getElementById('fm-perguntas').value.split('\n').map((s) => s.trim()).filter(Boolean);
        const res = await apiFetch('/crm/api/formularios', {
          method: 'POST',
          body: JSON.stringify({ nome, campos, tag_id: document.getElementById('fm-tag').value || null }),
        });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('fm-erro').textContent = dados.error || 'Falha ao criar formulário';
          return;
        }
        document.getElementById('fm-nome').value = '';
        document.getElementById('fm-perguntas').value = '';
        await carregar();
        renderizarListaFormularios();
      });
    }

    function renderizarListaFormularios() {
      const el = document.getElementById('lista-formularios');
      if (!el) return;
      el.innerHTML = formularios.length ? formularios.map((f) => {
        const link = `${window.location.origin}/crm/formulario.html?id=${f.id}`;
        return `
          <div class="linha-recurso" style="flex-direction:column;align-items:flex-start;gap:6px">
            <div style="display:flex;justify-content:space-between;width:100%;align-items:center">
              <span>${escapeHtml(f.nome)} ${f.ativo ? '<span class="badge sucesso">ativo</span>' : '<span class="badge neutro">desativado</span>'}</span>
              <div style="display:flex;gap:6px">
                <button type="button" class="btn-secundario btn-remover-recurso" data-copiar-link="${link}">Copiar link</button>
                <button type="button" class="btn-secundario btn-remover-recurso" data-alternar-formulario="${f.id}" data-ativo="${!f.ativo}">${f.ativo ? 'Desativar' : 'Ativar'}</button>
                <button type="button" class="btn-secundario btn-remover-recurso" data-apagar-formulario="${f.id}">Remover</button>
              </div>
            </div>
          </div>
        `;
      }).join('') : '<p class="vazio">Nenhum formulário ainda.</p>';

      el.querySelectorAll('[data-copiar-link]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await navigator.clipboard.writeText(btn.dataset.copiarLink).catch(() => {});
          btn.textContent = 'Copiado!';
          setTimeout(() => { btn.textContent = 'Copiar link'; }, 1500);
        });
      });
      el.querySelectorAll('[data-alternar-formulario]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await apiFetch(`/crm/api/formularios/${btn.dataset.alternarFormulario}`, {
            method: 'PATCH',
            body: JSON.stringify({ ativo: btn.dataset.ativo === 'true' }),
          });
          await carregar();
          renderizarListaFormularios();
        });
      });
      el.querySelectorAll('[data-apagar-formulario]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await apiFetch(`/crm/api/formularios/${btn.dataset.apagarFormulario}`, { method: 'DELETE' });
          await carregar();
          renderizarListaFormularios();
        });
      });
    }

    // --- Importação CSV (US21) ------------------------------------------------
    const CAMPOS_IMPORTACAO = [
      { campo: 'nome', label: 'Nome', obrigatorio: true },
      { campo: 'telefone', label: 'Telefone (WhatsApp)' },
      { campo: 'email', label: 'E-mail' },
      { campo: 'cpf', label: 'CPF' },
      { campo: 'cidade', label: 'Cidade' },
      { campo: 'uf', label: 'UF' },
      { campo: 'segmento', label: 'Segmento' },
      { campo: 'origem', label: 'Origem' },
    ];
    let csvArquivo = null, csvCabecalho = [], csvLinhas = [];

    function parseCsvLinhaSimples(linha, delimitador) {
      const campos = [];
      let campo = '', dentroAspas = false;
      for (let i = 0; i < linha.length; i++) {
        const ch = linha[i];
        if (dentroAspas) {
          if (ch === '"') { if (linha[i + 1] === '"') { campo += '"'; i++; } else dentroAspas = false; }
          else campo += ch;
        } else if (ch === '"') dentroAspas = true;
        else if (ch === delimitador) { campos.push(campo); campo = ''; }
        else campo += ch;
      }
      campos.push(campo);
      return campos;
    }

    document.getElementById('btn-importar').addEventListener('click', () => {
      abrirModal('<h3>Importar clientes (CSV)</h3>', `
        <p class="modal-texto">Planilha antiga, exportação do Google Forms etc. Escolha o arquivo e diga qual coluna é qual.</p>
        <input type="file" id="csv-arquivo" accept=".csv,text/csv">
        <div id="csv-mapeamento" hidden>
          <div id="csv-campos-mapeamento" style="margin-top:14px"></div>
          <div id="csv-preview" style="margin-top:12px"></div>
        </div>
        <div class="modal-erro" id="csv-erro"></div>
        <div class="modal-acoes">
          <button type="button" id="csv-importar" disabled>Importar</button>
        </div>
      `, 'modal-card-larga');

      document.getElementById('csv-arquivo').addEventListener('change', async (e) => {
        const arquivo = e.target.files[0];
        if (!arquivo) return;
        csvArquivo = arquivo;
        const texto = await arquivo.text();
        const s = texto.replace(/^﻿/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        const primeiraLinha = s.split('\n')[0] || '';
        const delimitador = (primeiraLinha.match(/;/g) || []).length > (primeiraLinha.match(/,/g) || []).length ? ';' : ',';
        const linhasTexto = s.split('\n').filter((l) => l.trim() !== '');
        csvCabecalho = parseCsvLinhaSimples(linhasTexto[0], delimitador);
        csvLinhas = linhasTexto.slice(1, 6).map((l) => parseCsvLinhaSimples(l, delimitador));

        const opcoes = ['<option value="">Não importar</option>', ...csvCabecalho.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`)].join('');
        document.getElementById('csv-campos-mapeamento').innerHTML = CAMPOS_IMPORTACAO.map((c) => `
          <div class="grid2" style="align-items:center;margin-bottom:6px">
            <label style="margin:0">${c.label}${c.obrigatorio ? '<span class="obrigatorio">*</span>' : ''}</label>
            <select data-campo-mapeado="${c.campo}">${opcoes}</select>
          </div>
        `).join('');
        // Tenta casar automaticamente por nome parecido da coluna.
        CAMPOS_IMPORTACAO.forEach((c) => {
          const select = document.querySelector(`[data-campo-mapeado="${c.campo}"]`);
          const achado = csvCabecalho.find((h) => h.toLowerCase().trim().includes(c.campo === 'telefone' ? 'telefone' : c.campo) || (c.campo === 'telefone' && h.toLowerCase().includes('whatsapp')));
          if (achado) select.value = achado;
        });

        document.getElementById('csv-preview').innerHTML = `
          <p class="modal-texto" style="margin-bottom:6px">Prévia (${linhasTexto.length - 1} linha(s) no total):</p>
          <div class="card" style="padding:0;overflow:auto">
            <table><thead><tr>${csvCabecalho.map((h) => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
            <tbody>${csvLinhas.map((l) => `<tr>${l.map((v) => `<td>${escapeHtml(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>
          </div>
        `;
        document.getElementById('csv-mapeamento').hidden = false;
        document.getElementById('csv-importar').disabled = false;
      });

      document.getElementById('csv-importar').addEventListener('click', async () => {
        const mapeamento = {};
        document.querySelectorAll('[data-campo-mapeado]').forEach((sel) => { mapeamento[sel.dataset.campoMapeado] = sel.value || null; });
        if (!mapeamento.nome) { document.getElementById('csv-erro').textContent = 'Mapeie pelo menos o campo Nome'; return; }

        const btn = document.getElementById('csv-importar');
        btn.disabled = true;
        btn.textContent = 'Importando…';
        const formData = new FormData();
        formData.append('arquivo', csvArquivo);
        formData.append('mapeamento', JSON.stringify(mapeamento));
        const res = await apiFetch('/crm/api/importacoes/csv', { method: 'POST', body: formData });
        const dados = await res.json().catch(() => ({}));
        if (!res.ok) {
          document.getElementById('csv-erro').textContent = dados.error || 'Falha ao importar';
          btn.disabled = false;
          btn.textContent = 'Importar';
          return;
        }
        document.getElementById('csv-mapeamento').innerHTML = `
          <p class="modal-texto"><strong>${dados.criados}</strong> criado(s), <strong>${dados.atualizados}</strong> atualizado(s)${dados.com_erro ? `, <strong>${dados.com_erro}</strong> com erro` : ''}.</p>
          ${dados.erro ? `<p class="modal-texto" style="color:var(--muted);font-size:12px">${escapeHtml(dados.erro)}</p>` : ''}
        `;
        btn.hidden = true;
        await carregar();
      });
    });

    // --- Duplicados (US17) ---------------------------------------------------
    document.getElementById('btn-duplicados').addEventListener('click', () => abrirModalDuplicados());

    async function abrirModalDuplicados() {
      abrirModal('<h3>Possíveis duplicados</h3>', `
        <p class="modal-texto">Sugestões por CPF igual ou nome + cidade parecidos. A mesclagem nunca é automática — escolha qual ficha fica e confirme.</p>
        <div id="lista-duplicados"><p class="vazio">Carregando…</p></div>
      `, 'modal-card-larga');
      await renderizarListaDuplicados();
    }

    async function renderizarListaDuplicados() {
      const el = document.getElementById('lista-duplicados');
      if (!el) return;
      const res = await apiFetch('/crm/api/clientes/duplicados');
      const grupos = await res.json();
      const ROTULO_MOTIVO = { cpf: 'Mesmo CPF', nome_cidade: 'Nome e cidade parecidos' };
      el.innerHTML = grupos.length ? grupos.map((g, i) => `
        <div class="linha-recurso" style="flex-direction:column;align-items:flex-start;gap:8px">
          <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">${ROTULO_MOTIVO[g.motivo] || g.motivo}</div>
          ${g.clientes.map((c, j) => `
            <label style="display:flex;align-items:center;gap:8px;width:100%;font-size:13.5px">
              <input type="radio" name="grupo-dup-${i}" value="${c.id}" ${j === 0 ? 'checked' : ''}>
              <span>${escapeHtml(c.nome)}${c.telefone ? ' · ' + escapeHtml(c.telefone) : ''}${c.quantidade_pedidos ? ' · ' + c.quantidade_pedidos + ' pedido(s)' : ''}</span>
            </label>
          `).join('')}
          <button type="button" class="btn-secundario" data-mesclar-grupo="${i}">Mesclar — mantém a ficha marcada</button>
        </div>
      `).join('') : '<p class="vazio">Nenhum duplicado encontrado.</p>';

      el.querySelectorAll('[data-mesclar-grupo]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const i = btn.dataset.mesclarGrupo;
          const grupo = grupos[i];
          const manterId = el.querySelector(`input[name="grupo-dup-${i}"]:checked`).value;
          btn.disabled = true;
          btn.textContent = 'Mesclando…';
          for (const c of grupo.clientes) {
            if (c.id === manterId) continue;
            await apiFetch('/crm/api/clientes/mesclar', { method: 'POST', body: JSON.stringify({ manter_id: manterId, descartar_id: c.id }) });
          }
          await carregar();
          await renderizarListaDuplicados();
        });
      });
    }

    function campoFormNovoCliente() {
      return `
        <label for="f-nome">Nome<span class="obrigatorio">*</span></label>
        <input id="f-nome" required>
        <div class="grid2">
          <div><label for="f-telefone">Telefone (WhatsApp)</label><input id="f-telefone" placeholder="(34) 99999-9999"></div>
          <div><label for="f-email">E-mail</label><input id="f-email" type="email"></div>
        </div>
        <div class="grid2">
          <div><label for="f-cidade">Cidade</label><input id="f-cidade"></div>
          <div><label for="f-uf">UF</label><input id="f-uf" maxlength="2" style="text-transform:uppercase"></div>
        </div>
        <label for="f-segmento">Segmento</label>
        <input id="f-segmento" placeholder="ex.: confeitaria, loja de joias, papelaria">
        <label for="f-origem">Origem</label>
        <input id="f-origem" placeholder="ex.: whatsapp, shopee, site, indicação">
        <div class="modal-erro" id="f-erro"></div>
      `;
    }

    document.getElementById('btn-novo-cliente').addEventListener('click', () => {
      const overlay = abrirModal('<h3>Novo cliente</h3>', `
        ${campoFormNovoCliente()}
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="btn-cancelar-cliente">Cancelar</button>
          <button type="button" id="btn-salvar-cliente">Salvar</button>
        </div>
      `);
      document.getElementById('btn-cancelar-cliente').addEventListener('click', fecharModal);
      document.getElementById('btn-salvar-cliente').addEventListener('click', async () => {
        const nome = document.getElementById('f-nome').value.trim();
        if (!nome) { document.getElementById('f-erro').textContent = 'Nome é obrigatório'; return; }
        const res = await apiFetch('/crm/api/clientes', {
          method: 'POST',
          body: JSON.stringify({
            nome,
            telefone: document.getElementById('f-telefone').value.trim() || null,
            email: document.getElementById('f-email').value.trim() || null,
            cidade: document.getElementById('f-cidade').value.trim() || null,
            uf: document.getElementById('f-uf').value.trim() || null,
            segmento: document.getElementById('f-segmento').value.trim() || null,
            origem: document.getElementById('f-origem').value.trim() || null,
          }),
        });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('f-erro').textContent = dados.error || 'Falha ao salvar';
          return;
        }
        fecharModal();
        carregar();
      });
    });

    carregar();
  </script>
</body>
</html>
