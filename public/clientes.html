    <div class="painel-main">
      <header class="ds-pagina-cab">
        <div class="ds-pagina-cab-texto"><h1 class="ds-pagina-cab-titulo">Clientes</h1></div>
        <div class="ds-pagina-cab-acoes">
          <div class="ds-acoes" id="acoes-topo-clientes">
            <button type="button" class="ds-acoes-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Mais ações">⋯</button>
            <div class="ds-acoes-menu" role="menu" hidden>
              <button type="button" class="ds-acoes-item" role="menuitem" data-acao="duplicados">Duplicados</button>
            </div>
          </div>
          <button type="button" class="ds-btn ds-btn-primario" id="btn-novo-cliente"><span data-icon="plus" data-size="16"></span>Novo cliente</button>
        </div>
      </header>

      <div class="ds-tabela" role="table" aria-label="Clientes"
           style="--ds-colunas: minmax(0,1.3fr) minmax(0,1fr) minmax(0,0.9fr) minmax(0,0.8fr) minmax(0,0.8fr) 100px 100px 48px">
        <div class="ds-filtros">
          <div class="ds-pesquisa">
            <svg class="ds-pesquisa-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="ds-pesquisa-input" type="search" id="input-busca" placeholder="Buscar por nome, telefone ou CPF…" aria-label="Buscar por nome, telefone ou CPF">
          </div>
        </div>
        <div class="ds-tabela-cabecalho" role="row">
          <span role="columnheader">Nome</span><span role="columnheader">Telefone</span><span role="columnheader">Cidade</span>
          <span role="columnheader">Segmento</span><span role="columnheader">Origem</span><span role="columnheader">Nascimento</span>
          <span role="columnheader">Desde</span><span role="columnheader"></span>
        </div>
        <div id="linhas-clientes"></div>
        <div class="ds-tabela-rodape"><nav data-ds-paginacao id="paginacao-clientes" data-ds-total="0" data-ds-tamanho="25" data-ds-tamanhos="25,50,100"></nav></div>
      </div>
    </div>

  <footer data-ds-rodape data-ds-produto="CRM"></footer>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    let clientes = [];
    let segmentosOpcoes = [];
    let origensOpcoes = [];

    let totalClientes = 0;
    const estadoClientes = { pagina: 1, tamanho: 25, busca: '' };

    async function carregar() {
      const qs = new URLSearchParams({ pagina: estadoClientes.pagina, tamanho: estadoClientes.tamanho });
      if (estadoClientes.busca) qs.set('busca', estadoClientes.busca);
      const [resClientes, resSegmentos, resOrigens] = await Promise.all([
        apiFetch(`/crm/api/clientes?${qs}`),
        apiFetch('/crm/api/opcoes-cadastro?tipo=segmento'),
        apiFetch('/crm/api/opcoes-cadastro?tipo=origem'),
      ]);
      const corpoClientes = await resClientes.json();
      clientes = corpoClientes.dados;
      totalClientes = corpoClientes.total;
      segmentosOpcoes = await resSegmentos.json();
      origensOpcoes = await resOrigens.json();
      renderizar();
    }

    // Só opções ativas entram no dropdown de Novo Cliente — CRUD de verdade
    // fica em Configurações > Cadastro.
    function opcoesSelectHtml(opcoes) {
      return opcoes.filter((o) => o.ativo).map((o) => `<option value="${escapeHtml(o.valor)}">${escapeHtml(o.valor)}</option>`).join('');
    }

    function renderizar() {
      const container = document.getElementById('linhas-clientes');
      container.innerHTML = clientes.length ? clientes.map((c) => `
        <div class="ds-tabela-linha ds-tabela-linha-clicavel" role="row" tabindex="0" data-id="${c.id}">
          <span role="cell" data-rotulo="Nome"><span class="ds-tabela-primario">${escapeHtml(c.nome)}</span>${c.bloqueado ? ' <span class="ds-badge ds-badge-erro ds-badge-sm">Bloqueado</span>' : ''}</span>
          <span role="cell" data-rotulo="Telefone">${escapeHtml(c.telefone || '—')}</span>
          <span role="cell" data-rotulo="Cidade">${escapeHtml([c.cidade, c.uf].filter(Boolean).join('/') || '—')}</span>
          <span role="cell" data-rotulo="Segmento">${escapeHtml(c.segmento || '—')}</span>
          <span role="cell" data-rotulo="Origem">${escapeHtml(c.origem || '—')}</span>
          <span role="cell" data-rotulo="Nascimento">${formatarDataSemFuso(c.data_nascimento)}</span>
          <span role="cell" data-rotulo="Desde">${formatarData(c.criado_em)}</span>
          <span role="cell">
            <div class="ds-acoes" data-id="${c.id}">
              <button type="button" class="ds-acoes-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Ações de ${escapeHtml(c.nome)}">⋯</button>
              <div class="ds-acoes-menu" role="menu" hidden>
                <button type="button" class="ds-acoes-item" role="menuitem" data-acao="editar">Editar</button>
                <button type="button" class="ds-acoes-item" role="menuitem" data-acao="bloqueio">${c.bloqueado ? 'Desbloquear' : 'Bloquear'}</button>
                <button type="button" class="ds-acoes-item" role="menuitem" data-acao="pedidos">Pedidos</button>
                <button type="button" class="ds-acoes-item" role="menuitem" data-acao="atendimento">Atendimento</button>
              </div>
            </div>
          </span>
        </div>
      `).join('') : `<div class="ds-vazio"><p class="ds-vazio-titulo">Nenhum cliente ainda</p><p class="ds-vazio-texto">Cadastre o primeiro ou espere o primeiro pedido chegar.</p></div>`;

      container.querySelectorAll('.ds-tabela-linha-clicavel').forEach((linha) => {
        linha.addEventListener('click', (e) => {
          if (e.target.closest('.ds-acoes')) return;
          window.location.href = `/crm/cliente-detalhe.html?id=${linha.dataset.id}`;
        });
      });

      KyvvoDS.paginacaoAtualizar(document.getElementById('paginacao-clientes'), { total: totalClientes, pagina: estadoClientes.pagina, tamanho: estadoClientes.tamanho });
    }

    // Ações por linha — delegado no container (as linhas são recriadas a
    // cada renderizar()), mesmo padrão de automacoes.html.
    document.getElementById('linhas-clientes').addEventListener('ds-acoes-escolher', async (e) => {
      const id = e.target.closest('[data-id]').dataset.id;
      const cliente = clientes.find((c) => c.id === id);
      if (e.detail.acao === 'editar') {
        window.location.href = `/crm/cliente-detalhe.html?id=${id}`;
      } else if (e.detail.acao === 'bloqueio') {
        await apiFetch(`/crm/api/clientes/${id}`, { method: 'PATCH', body: JSON.stringify({ bloqueado: !cliente.bloqueado }) });
        carregar();
      } else if (e.detail.acao === 'pedidos') {
        window.location.href = `/crm/pedidos.html?cliente_id=${id}`;
      } else if (e.detail.acao === 'atendimento') {
        if (cliente && cliente.telefone) window.open(linkWhatsapp(cliente.telefone), '_blank', 'noopener');
      }
    });

    document.getElementById('paginacao-clientes').addEventListener('ds-paginacao-alterar', (e) => {
      estadoClientes.pagina = e.detail.pagina;
      estadoClientes.tamanho = e.detail.tamanho;
      carregar();
    });

    let debounceBusca;
    document.getElementById('input-busca').addEventListener('input', (e) => {
      clearTimeout(debounceBusca);
      debounceBusca = setTimeout(() => {
        estadoClientes.busca = e.target.value.trim();
        estadoClientes.pagina = 1;
        carregar();
      }, 300);
    });

    // --- Duplicados (US17) — kebab de topo --
    document.getElementById('acoes-topo-clientes').addEventListener('ds-acoes-escolher', (e) => {
      if (e.detail.acao === 'duplicados') abrirModalDuplicados();
    });

    async function abrirModalDuplicados() {
      abrirModal('<h3>Possíveis duplicados</h3>', `
        <p class="modal-texto">Sugestões por CPF igual ou nome + cidade parecidos. A mesclagem nunca é automática — escolha qual ficha fica e confirme.</p>
        <div id="lista-duplicados"><p class="vazio">Carregando…</p></div>
      `, 'modal-card-larga');
      await renderizarListaDuplicados();
    }

    async function renderizarListaDuplicados() {
      const el = document.getElementById('lista-duplicados');
      if (!el) return;
      const res = await apiFetch('/crm/api/clientes/duplicados');
      const grupos = await res.json();
      const ROTULO_MOTIVO = { cpf: 'Mesmo CPF', nome_cidade: 'Nome e cidade parecidos' };
      el.innerHTML = grupos.length ? grupos.map((g, i) => `
        <div class="linha-recurso" style="flex-direction:column;align-items:flex-start;gap:8px">
          <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">${ROTULO_MOTIVO[g.motivo] || g.motivo}</div>
          ${g.clientes.map((c, j) => `
            <label class="ds-check" style="width:100%">
              <input type="radio" name="grupo-dup-${i}" value="${c.id}" ${j === 0 ? 'checked' : ''}>
              <span>${escapeHtml(c.nome)}${c.telefone ? ' · ' + escapeHtml(c.telefone) : ''}${c.quantidade_pedidos ? ' · ' + c.quantidade_pedidos + ' pedido(s)' : ''}</span>
            </label>
          `).join('')}
          <button type="button" class="ds-btn ds-btn-secundario" data-mesclar-grupo="${i}">Mesclar — mantém a ficha marcada</button>
        </div>
      `).join('') : '<p class="vazio">Nenhum duplicado encontrado.</p>';

      el.querySelectorAll('[data-mesclar-grupo]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const i = btn.dataset.mesclarGrupo;
          const grupo = grupos[i];
          const manterId = el.querySelector(`input[name="grupo-dup-${i}"]:checked`).value;
          btn.disabled = true;
          btn.textContent = 'Mesclando…';
          for (const c of grupo.clientes) {
            if (c.id === manterId) continue;
            await apiFetch('/crm/api/clientes/mesclar', { method: 'POST', body: JSON.stringify({ manter_id: manterId, descartar_id: c.id }) });
          }
          await carregar();
          await renderizarListaDuplicados();
        });
      });
    }

    function campoFormNovoCliente() {
      return `
        <div class="ds-form">
          <div class="ds-form-grade">
            <div class="ds-campo ds-campo-largo"><label class="ds-rotulo" for="f-nome">Nome<span class="obrigatorio">*</span></label><input class="ds-input" id="f-nome" required></div>
            <div class="ds-campo"><label class="ds-rotulo" for="f-telefone">Telefone (WhatsApp)</label><input class="ds-input" id="f-telefone" data-ds-mascara="telefone" placeholder="(34) 99999-9999"></div>
            <div class="ds-campo"><label class="ds-rotulo" for="f-email">E-mail</label><input class="ds-input" id="f-email" type="email"></div>
            <div class="ds-campo"><label class="ds-rotulo" for="f-cidade">Cidade</label><input class="ds-input" id="f-cidade"></div>
            <div class="ds-campo"><label class="ds-rotulo" for="f-uf">UF</label><input class="ds-input" id="f-uf" maxlength="2" style="text-transform:uppercase"></div>
            <div class="ds-campo">
              <label class="ds-rotulo" for="f-segmento">Segmento</label>
              <div class="ds-select"><select id="f-segmento"><option value="">Selecione…</option>${opcoesSelectHtml(segmentosOpcoes)}</select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
            </div>
            <div class="ds-campo">
              <label class="ds-rotulo" for="f-origem">Origem</label>
              <div class="ds-select"><select id="f-origem"><option value="">Selecione…</option>${opcoesSelectHtml(origensOpcoes)}</select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
            </div>
          </div>
          <div class="modal-erro" id="f-erro"></div>
        </div>
      `;
    }

    document.getElementById('btn-novo-cliente').addEventListener('click', () => {
      const overlay = abrirModal('<h3>Novo cliente</h3>', `
        ${campoFormNovoCliente()}
        <div class="ds-form-acoes">
          <button type="button" class="ds-btn ds-btn-secundario" id="btn-cancelar-cliente">Cancelar</button>
          <button type="button" class="ds-btn ds-btn-primario" id="btn-salvar-cliente">Salvar</button>
        </div>
      `);
      document.getElementById('btn-cancelar-cliente').addEventListener('click', fecharModal);
      document.getElementById('btn-salvar-cliente').addEventListener('click', async () => {
        const nome = document.getElementById('f-nome').value.trim();
        if (!nome) { document.getElementById('f-erro').textContent = 'Nome é obrigatório'; return; }
        const res = await apiFetch('/crm/api/clientes', {
          method: 'POST',
          body: JSON.stringify({
            nome,
            telefone: document.getElementById('f-telefone').value.trim() || null,
            email: document.getElementById('f-email').value.trim() || null,
            cidade: document.getElementById('f-cidade').value.trim() || null,
            uf: document.getElementById('f-uf').value.trim() || null,
            segmento: document.getElementById('f-segmento').value.trim() || null,
            origem: document.getElementById('f-origem').value.trim() || null,
          }),
        });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('f-erro').textContent = dados.error || 'Falha ao salvar';
          return;
        }
        fecharModal();
        carregar();
      });
    });

    carregar();
  </script>
</body>
