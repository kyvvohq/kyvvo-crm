<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo CRM — Clientes</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('crm_tema')==='dark'?'dark':'light');})();</script>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/crm/shell.css">
<style>
  .busca { max-width:320px; }
  .busca input { height:40px; }
  tr.linha-cliente { cursor:pointer; }
  tr.linha-cliente:hover td { background:var(--surface-hover); }

  .ficha-metricas { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:16px 0 20px; }
  @media(max-width:560px) { .ficha-metricas { grid-template-columns:1fr 1fr; } }
  .ficha-metrica { background:var(--surface-muted); border-radius:var(--radius-md); padding:10px 12px; }
  .ficha-metrica .lbl { font-size:11px; color:var(--muted); }
  .ficha-metrica .num { font-size:16px; font-weight:700; color:var(--text); font-family:var(--font-display); }
  .ficha-secao { margin-top:20px; }
  .ficha-secao h4 { font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:0 0 8px; }
  .ficha-tags { display:flex; gap:6px; flex-wrap:wrap; }
  .ficha-pedido-linha, .ficha-evento-linha { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--border); font-size:13px; }
  .ficha-pedido-linha:first-child, .ficha-evento-linha:first-child { border-top:none; }
  .ficha-evento-linha .quando { color:var(--muted); font-size:11.5px; white-space:nowrap; }
</style>
</head>
<body>
  <header class="topo-app">
    <a class="topo-logo" href="/crm/painel.html" aria-label="Ir para o início">
      <img class="topo-logo-img js-logo-kyvvo" src="/ds/logo.svg" alt="Kyvvo">
      <span class="topo-produto-tag">CRM</span>
    </a>
    <div class="topo-perfil" id="topo-perfil">
      <button class="topo-perfil-gatilho" id="topo-perfil-gatilho" type="button" aria-haspopup="true" aria-expanded="false">
        <div class="avatar js-avatar-usuario"></div>
        <span class="nome js-nome-usuario"></span>
        <span data-icon="chevron-down" data-size="14"></span>
      </button>
      <div class="menu-perfil" id="menu-perfil" hidden>
        <div class="menu-perfil-usuario">
          <div class="avatar js-avatar-usuario"></div>
          <div class="textos">
            <div class="nome js-nome-usuario"></div>
            <div class="email js-email-usuario"></div>
          </div>
        </div>
        <div class="menu-perfil-divisor"></div>
        <div class="menu-perfil-item menu-perfil-tema">
          <span data-icon="sun-moon" data-size="16"></span><span class="rotulo">Tema</span>
          <button class="toggle-tema" type="button" role="switch" aria-checked="false" aria-label="Alternar tema claro/escuro"><span class="bolinha"></span></button>
        </div>
        <div class="menu-perfil-divisor"></div>
        <button class="menu-perfil-item perigo btn-sair" type="button">
          <span data-icon="log-out" data-size="16"></span><span class="rotulo">Sair da conta</span>
        </button>
      </div>
    </div>
  </header>
  <div class="app-shell">
    <div class="sidebar-wrap">
      <aside class="painel-sidebar" id="painel-sidebar">
      <nav class="grupo-menu">
        <div class="grupo-titulo">Kyvvo CRM</div>
        <a class="menu-item" href="/crm/painel.html"><span data-icon="layout-dashboard"></span><span class="rotulo">Painel Hoje</span></a>
        <a class="menu-item" href="/crm/clientes.html"><span data-icon="users"></span><span class="rotulo">Clientes</span></a>
        <a class="menu-item" href="/crm/pedidos.html"><span data-icon="kanban"></span><span class="rotulo">Pedidos</span></a>
      </nav>
      </aside>
      <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" type="button" aria-label="Ocultar menu" title="Ocultar menu">&lt;</button>
    </div>

    <div class="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos">
          <div class="linha-titulo"><h1>Clientes</h1><span class="contagem" id="contagem-clientes">—</span></div>
        </div>
        <div class="acoes">
          <button type="button" class="btn-secundario" id="btn-gerenciar-campos">Campos customizados</button>
          <button type="button" id="btn-novo-cliente"><span data-icon="plus" data-size="16"></span>Novo cliente</button>
        </div>
      </div>

      <div class="busca">
        <input type="search" id="input-busca" placeholder="Buscar por nome, telefone ou CPF…">
      </div>

      <div class="card" style="padding:0">
        <table>
          <thead>
            <tr><th>Nome</th><th>Telefone</th><th>Cidade</th><th>Segmento</th><th>Origem</th><th>Desde</th></tr>
          </thead>
          <tbody id="tbody-clientes"></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer data-ds-rodape></footer>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    let clientes = [];
    let camposCustomizados = [];

    async function carregar(busca) {
      const qs = busca ? `?busca=${encodeURIComponent(busca)}` : '';
      const [resClientes, resCampos] = await Promise.all([
        apiFetch(`/crm/api/clientes${qs}`),
        apiFetch('/crm/api/campos-customizados'),
      ]);
      clientes = await resClientes.json();
      camposCustomizados = await resCampos.json();
      renderizar();
    }

    function renderizar() {
      document.getElementById('contagem-clientes').textContent = clientes.length;
      const tbody = document.getElementById('tbody-clientes');
      if (!clientes.length) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="vazio">Nenhum cliente ainda — cadastre o primeiro ou espere o primeiro pedido chegar.</div></td></tr>`;
        return;
      }
      tbody.innerHTML = clientes.map((c) => `
        <tr class="linha-cliente" data-id="${c.id}">
          <td>${escapeHtml(c.nome)}</td>
          <td>${escapeHtml(c.telefone || '—')}</td>
          <td>${escapeHtml([c.cidade, c.uf].filter(Boolean).join('/') || '—')}</td>
          <td>${escapeHtml(c.segmento || '—')}</td>
          <td>${escapeHtml(c.origem || '—')}</td>
          <td>${formatarData(c.criado_em)}</td>
        </tr>
      `).join('');
      tbody.querySelectorAll('.linha-cliente').forEach((tr) => {
        tr.addEventListener('click', () => abrirFicha(tr.dataset.id));
      });
    }

    let debounceBusca;
    document.getElementById('input-busca').addEventListener('input', (e) => {
      clearTimeout(debounceBusca);
      debounceBusca = setTimeout(() => carregar(e.target.value.trim()), 300);
    });

    // --- Campos customizados (US16) -----------------------------------------
    const ROTULO_TIPO_CAMPO = { texto: 'Texto', numero: 'Número', booleano: 'Sim/não', data: 'Data', selecao: 'Seleção' };

    document.getElementById('btn-gerenciar-campos').addEventListener('click', () => abrirModalCampos());

    function abrirModalCampos() {
      abrirModal('<h3>Campos customizados</h3>', `
        <p class="modal-texto">Campos extras do cliente, do jeito que o seu negócio precisa (ex.: "É confeiteira?").</p>
        <div id="lista-campos"></div>
        <div class="grid2">
          <div><label for="cc-label">Novo campo</label><input type="text" id="cc-label" placeholder="ex.: É confeiteira?"></div>
          <div><label for="cc-tipo">Tipo</label>
            <select id="cc-tipo">
              <option value="texto">Texto</option>
              <option value="numero">Número</option>
              <option value="booleano">Sim/não</option>
              <option value="data">Data</option>
              <option value="selecao">Seleção</option>
            </select>
          </div>
        </div>
        <div id="cc-opcoes-wrap" hidden>
          <label for="cc-opcoes">Opções (separadas por vírgula)</label>
          <input type="text" id="cc-opcoes" placeholder="ex.: Pequeno, Médio, Grande">
        </div>
        <div class="modal-erro" id="cc-erro"></div>
        <div class="modal-acoes">
          <button type="button" id="cc-adicionar">Adicionar campo</button>
        </div>
      `, 'modal-card-larga');
      renderizarListaCampos();
      document.getElementById('cc-tipo').addEventListener('change', (e) => {
        document.getElementById('cc-opcoes-wrap').hidden = e.target.value !== 'selecao';
      });
      document.getElementById('cc-adicionar').addEventListener('click', async () => {
        const label = document.getElementById('cc-label').value.trim();
        const tipo = document.getElementById('cc-tipo').value;
        if (!label) { document.getElementById('cc-erro').textContent = 'Digite o nome do campo'; return; }
        const opcoesTexto = document.getElementById('cc-opcoes').value.trim();
        const opcoes = tipo === 'selecao' && opcoesTexto ? opcoesTexto.split(',').map((s) => s.trim()).filter(Boolean) : undefined;
        const res = await apiFetch('/crm/api/campos-customizados', { method: 'POST', body: JSON.stringify({ label, tipo, opcoes }) });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('cc-erro').textContent = dados.error || 'Falha ao criar campo';
          return;
        }
        document.getElementById('cc-label').value = '';
        document.getElementById('cc-opcoes').value = '';
        await carregar();
        renderizarListaCampos();
      });
    }

    function renderizarListaCampos() {
      const el = document.getElementById('lista-campos');
      if (!el) return;
      el.innerHTML = camposCustomizados.length ? camposCustomizados.map((c) => `
        <div class="linha-recurso">
          <span>${escapeHtml(c.label)} <span style="color:var(--muted);font-size:12px">(${ROTULO_TIPO_CAMPO[c.tipo] || c.tipo})</span></span>
          <button type="button" class="btn-secundario btn-remover-recurso" data-apagar-campo="${c.id}">Remover</button>
        </div>
      `).join('') : '<p class="vazio">Nenhum campo customizado ainda.</p>';

      el.querySelectorAll('[data-apagar-campo]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await apiFetch(`/crm/api/campos-customizados/${btn.dataset.apagarCampo}`, { method: 'DELETE' });
          await carregar();
          renderizarListaCampos();
        });
      });
    }

    function campoFormNovoCliente() {
      return `
        <label for="f-nome">Nome<span class="obrigatorio">*</span></label>
        <input id="f-nome" required>
        <div class="grid2">
          <div><label for="f-telefone">Telefone (WhatsApp)</label><input id="f-telefone" placeholder="(34) 99999-9999"></div>
          <div><label for="f-email">E-mail</label><input id="f-email" type="email"></div>
        </div>
        <div class="grid2">
          <div><label for="f-cidade">Cidade</label><input id="f-cidade"></div>
          <div><label for="f-uf">UF</label><input id="f-uf" maxlength="2" style="text-transform:uppercase"></div>
        </div>
        <label for="f-segmento">Segmento</label>
        <input id="f-segmento" placeholder="ex.: confeitaria, loja de joias, papelaria">
        <label for="f-origem">Origem</label>
        <input id="f-origem" placeholder="ex.: whatsapp, shopee, site, indicação">
        <div class="modal-erro" id="f-erro"></div>
      `;
    }

    document.getElementById('btn-novo-cliente').addEventListener('click', () => {
      const overlay = abrirModal('<h3>Novo cliente</h3>', `
        ${campoFormNovoCliente()}
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="btn-cancelar-cliente">Cancelar</button>
          <button type="button" id="btn-salvar-cliente">Salvar</button>
        </div>
      `);
      document.getElementById('btn-cancelar-cliente').addEventListener('click', fecharModal);
      document.getElementById('btn-salvar-cliente').addEventListener('click', async () => {
        const nome = document.getElementById('f-nome').value.trim();
        if (!nome) { document.getElementById('f-erro').textContent = 'Nome é obrigatório'; return; }
        const res = await apiFetch('/crm/api/clientes', {
          method: 'POST',
          body: JSON.stringify({
            nome,
            telefone: document.getElementById('f-telefone').value.trim() || null,
            email: document.getElementById('f-email').value.trim() || null,
            cidade: document.getElementById('f-cidade').value.trim() || null,
            uf: document.getElementById('f-uf').value.trim() || null,
            segmento: document.getElementById('f-segmento').value.trim() || null,
            origem: document.getElementById('f-origem').value.trim() || null,
          }),
        });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('f-erro').textContent = dados.error || 'Falha ao salvar';
          return;
        }
        fecharModal();
        carregar();
      });
    });

    const ROTULO_TIPO_EVENTO = {
      criacao: 'Criado',
      mudanca_etapa: 'Mudou de etapa',
      pagamento: 'Pagamento atualizado',
      importacao: 'Importado',
      formulario: 'Respondeu formulário',
      sorteio: 'Participou de sorteio',
      mensagem_enviada: 'Mensagem enviada',
    };

    async function abrirFicha(id) {
      const overlay = abrirModal('<h3>Carregando…</h3>', '', 'modal-card-larga');
      const res = await apiFetch(`/crm/api/clientes/${id}`);
      const c = await res.json();

      overlay.querySelector('h3').textContent = c.nome;
      overlay.querySelector('.modal-card').insertAdjacentHTML('beforeend', `
        <div class="modal-texto" style="margin-top:4px">
          ${escapeHtml(c.telefone || 'sem telefone')} ${c.email ? `· ${escapeHtml(c.email)}` : ''}
          ${c.cidade ? `· ${escapeHtml(c.cidade)}${c.uf ? '/' + escapeHtml(c.uf) : ''}` : ''}
          ${c.segmento ? `· ${escapeHtml(c.segmento)}` : ''}
        </div>

        <div class="ficha-metricas">
          <div class="ficha-metrica"><div class="lbl">Total gasto</div><div class="num">${formatarMoeda(c.metricas.total_gasto)}</div></div>
          <div class="ficha-metrica"><div class="lbl">Pedidos</div><div class="num">${c.metricas.quantidade_pedidos}</div></div>
          <div class="ficha-metrica"><div class="lbl">Ticket médio</div><div class="num">${formatarMoeda(c.metricas.ticket_medio)}</div></div>
          <div class="ficha-metrica"><div class="lbl">Dias sem comprar</div><div class="num">${c.metricas.dias_sem_comprar ?? '—'}</div></div>
        </div>

        <div class="ficha-secao">
          <h4>Tags</h4>
          <div class="ficha-tags">${(c.tags || []).map((t) => `<span class="badge destaque">${escapeHtml(t.nome)}<button type="button" class="remover-tag-chip" data-remover-tag="${t.id}" aria-label="Remover tag">×</button></span>`).join('') || '<span class="vazio" style="padding:0">Nenhuma ainda.</span>'}</div>
          <input type="text" id="ficha-nova-tag" placeholder="+ Nova tag (Enter)" style="margin-top:8px;max-width:220px">
        </div>

        ${c.campos_customizados && c.campos_customizados.length ? `
        <div class="ficha-secao">
          <h4>Campos customizados</h4>
          ${c.campos_customizados.map(campoValorInputHtml).join('')}
          <div class="modal-acoes">
            <button type="button" id="btn-salvar-campos">Salvar campos</button>
          </div>
        </div>` : ''}

        <div class="ficha-secao">
          <h4>Pedidos (${c.pedidos.length})</h4>
          ${c.pedidos.length ? c.pedidos.map((p) => `
            <div class="ficha-pedido-linha">
              <span>${escapeHtml(p.etapa_nome)} · ${formatarMoeda(p.valor_total)}</span>
              <span class="quando">${formatarData(p.criado_em)}</span>
            </div>
          `).join('') : '<p class="vazio">Nenhum pedido ainda.</p>'}
        </div>

        <div class="ficha-secao">
          <h4>Linha do tempo</h4>
          ${c.eventos.length ? c.eventos.map((e) => `
            <div class="ficha-evento-linha">
              <span>${ROTULO_TIPO_EVENTO[e.tipo] || e.tipo}</span>
              <span class="quando">${formatarDataHora(e.criado_em)}</span>
            </div>
          `).join('') : '<p class="vazio">Sem eventos.</p>'}
        </div>

        ${c.telefone ? `
        <div class="modal-acoes">
          <a class="btn" style="background:#25D366" href="${linkWhatsapp(c.telefone)}" target="_blank" rel="noopener">${icon('message-circle', 16)} Abrir WhatsApp</a>
        </div>` : ''}
      `);

      overlay.querySelectorAll('[data-remover-tag]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await apiFetch(`/crm/api/clientes/${id}/tags/${btn.dataset.removerTag}`, { method: 'DELETE' });
          carregar();
          abrirFicha(id);
        });
      });
      document.getElementById('ficha-nova-tag').addEventListener('keydown', async (e) => {
        if (e.key !== 'Enter') return;
        const nome = e.target.value.trim();
        if (!nome) return;
        e.target.disabled = true;
        const res = await apiFetch(`/crm/api/clientes/${id}/tags`, { method: 'POST', body: JSON.stringify({ nome }) });
        if (!res.ok) { e.target.disabled = false; return; }
        carregar();
        abrirFicha(id);
      });

      const btnSalvarCampos = document.getElementById('btn-salvar-campos');
      if (btnSalvarCampos) {
        btnSalvarCampos.addEventListener('click', async () => {
          const valores = [...overlay.querySelectorAll('[data-campo-id]')].map((el) => ({
            campo_id: el.dataset.campoId,
            valor: el.dataset.tipo === 'booleano' ? String(el.checked) : el.value,
          }));
          const res = await apiFetch(`/crm/api/clientes/${id}/campos`, { method: 'PUT', body: JSON.stringify({ valores }) });
          btnSalvarCampos.textContent = res.ok ? 'Salvo!' : 'Falha ao salvar';
          setTimeout(() => { btnSalvarCampos.textContent = 'Salvar campos'; }, 1500);
        });
      }
    }

    // Um <label>+input por campo customizado, tipo de input de acordo com
    // cc.tipo. `campo.valor` já vem preenchido pelo GET (LEFT JOIN com os
    // valores desse cliente específico).
    function campoValorInputHtml(campo) {
      const id = `cc-valor-${campo.id}`;
      const valor = campo.valor;
      if (campo.tipo === 'booleano') {
        return `<label for="${id}" style="display:flex;align-items:center;gap:8px;margin-top:14px">
          <input type="checkbox" id="${id}" data-campo-id="${campo.id}" data-tipo="booleano" style="width:auto" ${valor === 'true' ? 'checked' : ''}>
          ${escapeHtml(campo.label)}
        </label>`;
      }
      if (campo.tipo === 'selecao') {
        const opcoes = Array.isArray(campo.opcoes) ? campo.opcoes : [];
        return `<label for="${id}">${escapeHtml(campo.label)}</label>
          <select id="${id}" data-campo-id="${campo.id}" data-tipo="selecao">
            <option value="">—</option>
            ${opcoes.map((o) => `<option value="${escapeHtml(o)}" ${valor === o ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')}
          </select>`;
      }
      if (campo.tipo === 'data') {
        return `<label for="${id}">${escapeHtml(campo.label)}</label><input type="date" id="${id}" data-campo-id="${campo.id}" data-tipo="data" value="${valor || ''}">`;
      }
      if (campo.tipo === 'numero') {
        return `<label for="${id}">${escapeHtml(campo.label)}</label><input type="number" step="any" id="${id}" data-campo-id="${campo.id}" data-tipo="numero" value="${valor ?? ''}">`;
      }
      return `<label for="${id}">${escapeHtml(campo.label)}</label><input type="text" id="${id}" data-campo-id="${campo.id}" data-tipo="texto" value="${escapeHtml(valor || '')}">`;
    }

    carregar();
  </script>
</body>
</html>
