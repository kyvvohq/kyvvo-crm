    <div class="painel-main">
      <header class="ds-pagina-cab">
        <div class="ds-pagina-cab-texto">
          <h1 class="ds-pagina-cab-titulo">Leads</h1>
        </div>
        <div class="ds-pagina-cab-acoes">
          <button type="button" class="ds-btn ds-btn-primario" id="btn-novo-lead"><span data-icon="plus" data-size="16"></span>Novo lead</button>
        </div>
      </header>

      <div class="ds-tabela" role="table" aria-label="Leads"
           style="--ds-colunas: minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) 160px 110px 48px">
        <div class="ds-filtros">
          <div class="ds-pesquisa">
            <svg class="ds-pesquisa-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="ds-pesquisa-input" type="search" id="f-cliente" placeholder="Buscar cliente ou empresa…" aria-label="Buscar">
          </div>
          <div class="ds-select"><select id="f-etapa" aria-label="Etapa"><option value="">Qualquer etapa</option></select>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
        </div>
        <div class="ds-tabela-cabecalho" role="row">
          <span role="columnheader">Cliente</span><span role="columnheader">Empresa</span><span role="columnheader">Produto de interesse</span>
          <span role="columnheader">Etapa</span><span role="columnheader">Origem</span><span role="columnheader"></span>
        </div>
        <div id="linhas-leads"></div>
      </div>
    </div>
  </div>

  <footer data-ds-rodape data-ds-produto="CRM"></footer>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    let leadsAtuais = [];
    let etapasLeads = [];
    let buscaLeads = '';

    const ROTULO_PRODUTO = { studio: 'Studio', crm: 'CRM', people: 'People', platform: 'Platform', nao_sabe: 'Não sabe' };

    async function carregar() {
      const params = new URLSearchParams();
      if (document.getElementById('f-etapa').value) params.set('etapa_id', document.getElementById('f-etapa').value);

      const [resLeads, resEtapas] = await Promise.all([
        apiFetch(`/crm/api/leads?${params}`),
        apiFetch('/crm/api/leads-etapas'),
      ]);
      leadsAtuais = await resLeads.json();
      etapasLeads = await resEtapas.json();

      document.getElementById('f-etapa').innerHTML = '<option value="">Qualquer etapa</option>'
        + etapasLeads.map((e) => `<option value="${e.id}" ${e.id === document.getElementById('f-etapa').value ? 'selected' : ''}>${escapeHtml(e.nome)}</option>`).join('');

      renderizar();
    }

    document.getElementById('f-etapa').addEventListener('change', carregar);

    let debounceBusca;
    document.getElementById('f-cliente').addEventListener('input', (e) => {
      clearTimeout(debounceBusca);
      debounceBusca = setTimeout(() => { buscaLeads = e.target.value.trim().toLowerCase(); renderizar(); }, 300);
    });

    function opcoesEtapaHtml(etapaAtualId) {
      return etapasLeads.map((e) => `<option value="${e.id}" ${e.id === etapaAtualId ? 'selected' : ''}>${escapeHtml(e.nome)}</option>`).join('');
    }

    function renderizar() {
      const filtrados = buscaLeads
        ? leadsAtuais.filter((l) => (l.cliente_nome || '').toLowerCase().includes(buscaLeads) || (l.empresa || '').toLowerCase().includes(buscaLeads))
        : leadsAtuais;

      const container = document.getElementById('linhas-leads');
      container.innerHTML = filtrados.length ? filtrados.map((l) => `
        <div class="ds-tabela-linha" role="row" data-id="${l.id}">
          <span role="cell" data-rotulo="Cliente"><span class="ds-tabela-primario">${escapeHtml(l.cliente_nome)}</span><br><span style="color:var(--muted);font-size:12.5px">${escapeHtml(l.cliente_telefone || '')}</span></span>
          <span role="cell" data-rotulo="Empresa">${escapeHtml(l.empresa || '—')}</span>
          <span role="cell" data-rotulo="Produto">${l.produto_interesse ? escapeHtml(ROTULO_PRODUTO[l.produto_interesse] || l.produto_interesse) : '—'}</span>
          <span role="cell" data-rotulo="Etapa">
            <div class="ds-select ds-select-sm"><select data-acao="mover-etapa" data-id="${l.id}">${opcoesEtapaHtml(l.etapa_id)}</select>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
          </span>
          <span role="cell" data-rotulo="Origem">${escapeHtml(l.origem)}</span>
          <span role="cell">
            <button type="button" class="ds-btn ds-btn-secundario ds-btn-sm" data-acao="detalhe" data-id="${l.id}">Detalhe</button>
          </span>
        </div>
      `).join('') : `<div class="ds-vazio"><p class="ds-vazio-titulo">Nenhum lead ainda</p></div>`;

      container.querySelectorAll('[data-acao="mover-etapa"]').forEach((select) => {
        select.addEventListener('change', async () => {
          await apiFetch(`/crm/api/leads/${select.dataset.id}/etapa`, { method: 'PATCH', body: JSON.stringify({ etapa_id: select.value }) });
          carregar();
        });
      });
      container.querySelectorAll('[data-acao="detalhe"]').forEach((btn) => {
        btn.addEventListener('click', () => abrirDetalheLead(btn.dataset.id));
      });
    }

    function abrirDetalheLead(id) {
      const lead = leadsAtuais.find((l) => l.id === id);
      if (!lead) return;
      abrirModal('<h3>Detalhe do lead</h3>', `
        <div class="ds-form">
          <div class="ds-form-grade">
            <div class="ds-campo"><label class="ds-rotulo" for="ld-empresa">Empresa</label><input class="ds-input" id="ld-empresa" value="${escapeHtml(lead.empresa || '')}"></div>
            <div class="ds-campo"><label class="ds-rotulo" for="ld-segmento">Segmento</label><input class="ds-input" id="ld-segmento" value="${escapeHtml(lead.segmento || '')}"></div>
            <div class="ds-campo"><label class="ds-rotulo" for="ld-plano">Plano de interesse</label><input class="ds-input" id="ld-plano" value="${escapeHtml(lead.plano_interesse || '')}"></div>
            <div class="ds-campo"><label class="ds-rotulo" for="ld-valor">Valor estimado</label><input class="ds-input" id="ld-valor" inputmode="decimal" value="${lead.valor_estimado != null ? Number(lead.valor_estimado).toLocaleString('pt-BR', { minimumFractionDigits: 2 }) : ''}"></div>
            <div class="ds-campo ds-campo-largo"><label class="ds-rotulo" for="ld-obs">Observações</label><textarea class="ds-textarea" id="ld-obs">${escapeHtml(lead.observacoes || '')}</textarea></div>
          </div>
          <div class="modal-erro" id="ld-erro"></div>
          <div class="ds-form-acoes">
            <button type="button" class="ds-btn ds-btn-secundario" id="ld-cancelar">Fechar</button>
            <button type="button" class="ds-btn ds-btn-primario" id="ld-salvar">Salvar</button>
          </div>
        </div>
      `);
      const campoValor = document.getElementById('ld-valor');
      aplicarMascaraMoeda(campoValor);
      document.getElementById('ld-cancelar').addEventListener('click', fecharModal);
      document.getElementById('ld-salvar').addEventListener('click', async () => {
        const res = await apiFetch(`/crm/api/leads/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({
            empresa: document.getElementById('ld-empresa').value.trim() || null,
            segmento: document.getElementById('ld-segmento').value.trim() || null,
            plano_interesse: document.getElementById('ld-plano').value.trim() || null,
            valor_estimado: valorMoedaParaNumero(campoValor) || null,
            observacoes: document.getElementById('ld-obs').value.trim() || null,
          }),
        });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('ld-erro').textContent = dados.error || 'Falha ao salvar';
          return;
        }
        fecharModal();
        carregar();
      });
    }

    document.getElementById('btn-novo-lead').addEventListener('click', () => {
      abrirModal('<h3>Novo lead</h3>', `
        <div class="ds-form">
          <div class="ds-form-grade">
            <div class="ds-campo"><label class="ds-rotulo" for="nl-telefone">Telefone<span class="obrigatorio">*</span></label><input class="ds-input" id="nl-telefone" placeholder="(34) 99999-9999" required></div>
            <div class="ds-campo"><label class="ds-rotulo" for="nl-nome">Nome (se cliente novo)</label><input class="ds-input" id="nl-nome"></div>
            <div class="ds-campo"><label class="ds-rotulo" for="nl-empresa">Empresa</label><input class="ds-input" id="nl-empresa"></div>
            <div class="ds-campo">
              <label class="ds-rotulo" for="nl-produto">Produto de interesse</label>
              <div class="ds-select"><select id="nl-produto"><option value="">—</option><option value="studio">Studio</option><option value="crm">CRM</option><option value="people">People</option><option value="platform">Platform</option></select>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
            </div>
          </div>
          <div class="modal-erro" id="nl-erro"></div>
          <div class="ds-form-acoes">
            <button type="button" class="ds-btn ds-btn-secundario" id="nl-cancelar">Cancelar</button>
            <button type="button" class="ds-btn ds-btn-primario" id="nl-salvar">Criar lead</button>
          </div>
        </div>
      `);
      document.getElementById('nl-cancelar').addEventListener('click', fecharModal);
      document.getElementById('nl-salvar').addEventListener('click', async () => {
        const telefone = document.getElementById('nl-telefone').value.trim();
        if (!telefone) { document.getElementById('nl-erro').textContent = 'Telefone é obrigatório'; return; }
        const res = await apiFetch('/crm/api/leads', {
          method: 'POST',
          body: JSON.stringify({
            telefone,
            nome_cliente: document.getElementById('nl-nome').value.trim() || null,
            empresa: document.getElementById('nl-empresa').value.trim() || null,
            produto_interesse: document.getElementById('nl-produto').value || null,
          }),
        });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('nl-erro').textContent = dados.error || 'Falha ao criar lead';
          return;
        }
        fecharModal();
        carregar();
      });
    });

    carregar();
  </script>
</body>
