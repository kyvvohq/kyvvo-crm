<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo CRM — Cadastro</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('crm_tema')==='dark'?'dark':'light');})();</script>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/crm/shell.css">
<style>
  .lista-opcoes-item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--border); }
  .lista-opcoes-item:first-child { border-top:none; }
  .lista-opcoes-item.inativa .valor { color:var(--muted); text-decoration:line-through; }
  .lista-opcoes-item .acoes-linha { display:flex; gap:6px; flex-shrink:0; }
  .lista-opcoes-item .acoes-linha button { height:28px; padding:0 10px; font-size:12px; }
  .form-nova-opcao { display:flex; gap:8px; margin-top:12px; }
  .opcao-sistema-selo { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); flex-shrink:0; }
</style>
</head>
<body>
  <header class="topo-app">
    <a class="topo-logo" href="/crm/painel.html" aria-label="Ir para o início">
      <img class="topo-logo-img js-logo-kyvvo" src="/ds/logo.svg" alt="Kyvvo">
      <span class="topo-produto-tag">CRM</span>
    </a>
    <div class="topo-perfil" id="topo-perfil">
      <button class="topo-perfil-gatilho" id="topo-perfil-gatilho" type="button" aria-haspopup="true" aria-expanded="false">
        <div class="avatar js-avatar-usuario"></div>
        <span class="nome js-nome-usuario"></span>
        <span data-icon="chevron-down" data-size="14"></span>
      </button>
      <div class="menu-perfil" id="menu-perfil" hidden>
        <div class="menu-perfil-usuario">
          <div class="avatar js-avatar-usuario"></div>
          <div class="textos">
            <div class="nome js-nome-usuario"></div>
            <div class="email js-email-usuario"></div>
          </div>
        </div>
        <div class="menu-perfil-divisor"></div>
        <div class="menu-perfil-item menu-perfil-tema">
          <span data-icon="sun-moon" data-size="16"></span><span class="rotulo">Tema</span>
          <button class="toggle-tema" type="button" role="switch" aria-checked="false" aria-label="Alternar tema claro/escuro"><span class="bolinha"></span></button>
        </div>
        <div class="menu-perfil-divisor"></div>
        <button class="menu-perfil-item perigo btn-sair" type="button">
          <span data-icon="log-out" data-size="16"></span><span class="rotulo">Sair da conta</span>
        </button>
      </div>
    </div>
  </header>
  <div class="app-shell">
    <nav class="ds-menu" data-ds-menu id="painel-sidebar">
      <div class="ds-menu-topo">
        <button type="button" class="ds-menu-toggle" id="btn-toggle-sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
      <ul class="ds-menu-lista">
        <li><a class="ds-menu-link" href="/crm/painel.html"><span class="ds-menu-icone" data-icon="layout-dashboard"></span><span class="ds-menu-rotulo">Painel Hoje</span></a></li>
        <li><a class="ds-menu-link" href="/crm/quadro.html"><span class="ds-menu-icone" data-icon="kanban"></span><span class="ds-menu-rotulo">Quadro</span></a></li>
        <li><a class="ds-menu-link" href="/crm/clientes.html"><span class="ds-menu-icone" data-icon="users"></span><span class="ds-menu-rotulo">Clientes</span></a></li>
        <li><a class="ds-menu-link" href="/crm/pedidos.html"><span class="ds-menu-icone" data-icon="list"></span><span class="ds-menu-rotulo">Pedidos</span></a></li>
        <li><a class="ds-menu-link" href="/crm/segmentos.html"><span class="ds-menu-icone" data-icon="funnel"></span><span class="ds-menu-rotulo">Campanhas</span></a></li>
        <li class="ds-menu-grupo">
          <button type="button" class="ds-menu-link ds-menu-grupo-botao" aria-expanded="false">
            <span class="ds-menu-icone" data-icon="settings"></span>
            <span class="ds-menu-rotulo">Configurações</span>
            <span class="ds-menu-seta" data-icon="chevron-down" data-size="14"></span>
          </button>
          <ul class="ds-menu-sub">
            <li><a class="ds-menu-sublink" href="/crm/opcoes-cadastro.html">Cadastro</a></li>
            <li><a class="ds-menu-sublink" href="/crm/automacoes.html">Automações</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <div class="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos">
          <div class="linha-titulo"><h1>Cadastro</h1></div>
        </div>
      </div>

      <div class="ds-abas" data-ds-abas>
        <div class="ds-abas-lista">
          <button type="button" class="ds-aba" id="aba-cadastro-segmentos" aria-controls="painel-cadastro-segmentos" aria-selected="true">Segmentos</button>
          <button type="button" class="ds-aba" id="aba-cadastro-origens" aria-controls="painel-cadastro-origens" aria-selected="false">Origens</button>
        </div>

        <div class="ds-abas-painel card" id="painel-cadastro-segmentos" aria-labelledby="aba-cadastro-segmentos">
          <p class="vazio" style="padding:0 0 8px">Opções que aparecem no campo "Segmento" da ficha do cliente.</p>
          <div id="lista-segmentos"><div class="vazio">Carregando…</div></div>
          <form class="form-nova-opcao" id="form-novo-segmento">
            <input type="text" id="novo-segmento" placeholder="ex.: Confeitaria" style="flex:1">
            <button type="submit">Adicionar</button>
          </form>
        </div>

        <div class="ds-abas-painel card" id="painel-cadastro-origens" aria-labelledby="aba-cadastro-origens" hidden>
          <p class="vazio" style="padding:0 0 8px">Opções que aparecem no campo "Origem" da ficha do cliente.</p>
          <div id="lista-origens"><div class="vazio">Carregando…</div></div>
          <form class="form-nova-opcao" id="form-nova-origem">
            <input type="text" id="nova-origem" placeholder="ex.: Indicação" style="flex:1">
            <button type="submit">Adicionar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer data-ds-rodape></footer>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    async function carregarTipo(tipo, elId) {
      const el = document.getElementById(elId);
      const res = await apiFetch(`/crm/api/opcoes-cadastro?tipo=${tipo}`);
      const opcoes = await res.json();
      el.innerHTML = opcoes.length ? opcoes.map((o) => `
        <div class="lista-opcoes-item${o.ativo ? '' : ' inativa'}">
          <span class="valor">${escapeHtml(o.valor)}</span>
          ${o.sistema ? `
            <span class="opcao-sistema-selo" title="Usada pelo bot — não pode ser alterada">
              ${icon('lock', 14)} Usada pelo bot
            </span>
          ` : `
            <div class="acoes-linha">
              <button type="button" class="btn-secundario" data-alternar="${o.id}" data-ativo="${!o.ativo}">${o.ativo ? 'Desativar' : 'Ativar'}</button>
              <button type="button" class="btn-secundario" data-remover="${o.id}">Remover</button>
            </div>
          `}
        </div>
      `).join('') : '<p class="vazio">Nenhuma opção ainda.</p>';

      el.querySelectorAll('[data-alternar]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await apiFetch(`/crm/api/opcoes-cadastro/${btn.dataset.alternar}`, { method: 'PATCH', body: JSON.stringify({ ativo: btn.dataset.ativo === 'true' }) });
          carregarTipo(tipo, elId);
        });
      });
      el.querySelectorAll('[data-remover]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await apiFetch(`/crm/api/opcoes-cadastro/${btn.dataset.remover}`, { method: 'DELETE' });
          carregarTipo(tipo, elId);
        });
      });
    }

    document.getElementById('form-novo-segmento').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('novo-segmento');
      const valor = input.value.trim();
      if (!valor) return;
      await apiFetch('/crm/api/opcoes-cadastro', { method: 'POST', body: JSON.stringify({ tipo: 'segmento', valor }) });
      input.value = '';
      carregarTipo('segmento', 'lista-segmentos');
    });
    document.getElementById('form-nova-origem').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('nova-origem');
      const valor = input.value.trim();
      if (!valor) return;
      await apiFetch('/crm/api/opcoes-cadastro', { method: 'POST', body: JSON.stringify({ tipo: 'origem', valor }) });
      input.value = '';
      carregarTipo('origem', 'lista-origens');
    });

    carregarTipo('segmento', 'lista-segmentos');
    carregarTipo('origem', 'lista-origens');
  </script>
</body>
</html>
