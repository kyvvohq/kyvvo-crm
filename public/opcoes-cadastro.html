              <span role="columnheader" style="display:flex;align-items:center;gap:4px;cursor:help" title="Vincula uma série de NF-e a esta origem — a importação de XML usa isso pra classificar o pedido sozinha (ex.: série 0003 = Shopee).">Série<span data-icon="circle-alert" data-size="13"></span></span>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    // CRUD padrão (tabela + kebab Editar/Desativar/Excluir, botão "+ Novo" no
    // topo da aba, modal de confirmação ao excluir) — os 3 tipos (segmento/
    // origem/tipo_entrega) têm o mesmo shape e as mesmas regras, então uma
    // função só, parametrizada por tipo/elId, atende as 3 abas (antes eram
    // 3 cópias quase idênticas, uma por tipo).
    const TIPOS_CADASTRO = {
      segmento: { elId: 'lista-segmentos' },
      origem: { elId: 'lista-origens' },
      tipo_entrega: { elId: 'lista-tipo-entrega' },
    };

    async function carregarTipo(tipo) {
      const { elId } = TIPOS_CADASTRO[tipo];
      const container = document.getElementById(elId);
      const res = await apiFetch(`/crm/api/opcoes-cadastro?tipo=${tipo}`);
      const opcoes = await res.json();
      TIPOS_CADASTRO[tipo].opcoes = opcoes;

      container.innerHTML = opcoes.length ? opcoes.map((o) => `
        <div class="ds-tabela-linha" role="row" data-id="${o.id}">
          <span role="cell" data-rotulo="Nome"><span class="ds-tabela-primario">${escapeHtml(o.valor)}</span></span>
          ${tipo === 'origem' ? `<span role="cell" data-rotulo="Série">${o.serie ? escapeHtml(o.serie) : '<span style="color:var(--muted)">—</span>'}</span>` : ''}
          <span role="cell" data-rotulo="Status">
            ${o.sistema
              ? `<span class="opcao-sistema-selo" title="Usada pelo bot — não pode ser alterada">${icon('lock', 14)} Usada pelo bot</span>`
              : (o.ativo ? '<span class="ds-badge ds-badge-sucesso ds-badge-sm">Ativo</span>' : '<span class="ds-badge ds-badge-sm">Desativado</span>')}
          </span>
          <span role="cell">
            ${o.sistema ? '' : `
              <div class="ds-acoes" data-id="${o.id}">
                <button type="button" class="ds-acoes-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Ações de ${escapeHtml(o.valor)}">⋯</button>
                <div class="ds-acoes-menu" role="menu" hidden>
                  <button type="button" class="ds-acoes-item" role="menuitem" data-acao="editar">Editar</button>
                  <button type="button" class="ds-acoes-item" role="menuitem" data-acao="alternar">${o.ativo ? 'Desativar' : 'Ativar'}</button>
                  <button type="button" class="ds-acoes-item ds-acoes-item-perigo" role="menuitem" data-acao="excluir">Excluir</button>
                </div>
              </div>
            `}
          </span>
        </div>
      `).join('') : '<div class="ds-vazio"><p class="ds-vazio-titulo">Nenhuma opção cadastrada ainda</p></div>';
    }

    // Um listener delegado por tabela (não por linha, não recriado a cada
    // carregarTipo) — mesmo padrão de clientes.html/estoque.html/pedidos.html.
    Object.keys(TIPOS_CADASTRO).forEach((tipo) => {
      document.getElementById(TIPOS_CADASTRO[tipo].elId).addEventListener('ds-acoes-escolher', async (e) => {
        const id = e.target.closest('[data-id]').dataset.id;
        const opcao = TIPOS_CADASTRO[tipo].opcoes.find((o) => o.id === id);
        if (e.detail.acao === 'editar') {
          abrirModalOpcao(tipo, opcao);
        } else if (e.detail.acao === 'alternar') {
          await apiFetch(`/crm/api/opcoes-cadastro/${id}`, { method: 'PATCH', body: JSON.stringify({ ativo: !opcao.ativo }) });
          carregarTipo(tipo);
        } else if (e.detail.acao === 'excluir') {
          confirmarAcao(
            'Excluir opção?',
            `Deseja excluir "${escapeHtml(opcao.valor)}"? Essa ação não pode ser desfeita.`,
            async () => {
              await apiFetch(`/crm/api/opcoes-cadastro/${id}`, { method: 'DELETE' });
              carregarTipo(tipo);
            },
            { textoConfirmar: 'Confirmar', textoCancelar: 'Cancelar' }
          );
        }
      });
    });

    // Mesmo modal pra criar (opcao undefined) e editar (opcao preenchida) —
    // só muda o verbo (POST/PATCH) e o texto do título/botão.
    function abrirModalOpcao(tipo, opcao) {
      const editando = !!opcao;
      const label = document.querySelector(`[data-novo-opcao="${tipo}"]`).dataset.labelOpcao;
      abrirModal(`<h3>${editando ? 'Editar' : 'Novo'} ${label.toLowerCase()}</h3>`, `
        <div class="ds-form">
          <div class="ds-campo"><label class="ds-rotulo" for="opcao-valor">Nome</label><input class="ds-input" id="opcao-valor" value="${editando ? escapeHtml(opcao.valor) : ''}" autofocus></div>
          ${tipo === 'origem' ? `
          <div class="ds-campo">
            <label class="ds-rotulo" for="opcao-serie">Série da NF-e <span class="ds-rotulo-opcional">(opcional)</span></label>
            <input class="ds-input" id="opcao-serie" value="${editando && opcao.serie ? escapeHtml(opcao.serie) : ''}" placeholder="ex.: 0003">
          </div>` : ''}
          <div class="modal-erro" id="opcao-erro"></div>
          <div class="ds-form-acoes">
            <button type="button" class="ds-btn ds-btn-secundario" id="opcao-cancelar">Cancelar</button>
            <button type="button" class="ds-btn ds-btn-primario" id="opcao-salvar">Salvar</button>
          </div>
        </div>
      `);
      document.getElementById('opcao-cancelar').addEventListener('click', fecharModal);
      const salvar = async () => {
        const valor = document.getElementById('opcao-valor').value.trim();
        if (!valor) { document.getElementById('opcao-erro').textContent = 'Nome é obrigatório'; return; }
        const campoSerie = document.getElementById('opcao-serie');
        const corpo = { valor };
        if (campoSerie) corpo.serie = campoSerie.value.trim() || null;
        const res = editando
          ? await apiFetch(`/crm/api/opcoes-cadastro/${opcao.id}`, { method: 'PATCH', body: JSON.stringify(corpo) })
          : await apiFetch('/crm/api/opcoes-cadastro', { method: 'POST', body: JSON.stringify({ tipo, ...corpo }) });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('opcao-erro').textContent = dados.error || 'Erro ao salvar';
          return;
        }
        fecharModal();
        carregarTipo(tipo);
      };
      document.getElementById('opcao-salvar').addEventListener('click', salvar);
      document.getElementById('opcao-valor').addEventListener('keydown', (e) => { if (e.key === 'Enter') salvar(); });
    }

    document.querySelectorAll('[data-novo-opcao]').forEach((btn) => {
      btn.addEventListener('click', () => abrirModalOpcao(btn.dataset.novoOpcao));
    });

    Object.keys(TIPOS_CADASTRO).forEach(carregarTipo);
  </script>
