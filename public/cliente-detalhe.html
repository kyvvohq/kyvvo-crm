<meta charset="utf-8">

<style>
  .bloco-cliente { margin-bottom:20px; }
  .ficha-metricas { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media(max-width:560px) { .ficha-metricas { grid-template-columns:1fr 1fr; } }
  .ficha-metrica { background:var(--surface-muted); border-radius:var(--radius-md); padding:12px 14px; }
  .ficha-metrica .lbl { font-size:11px; color:var(--muted); }
  .ficha-metrica .num { font-size:18px; font-weight:700; color:var(--text); font-family:var(--font-display); }
  .ficha-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .cabecalho-cliente { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .cabecalho-cliente .acoes { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .badge-bloqueado { background:color-mix(in srgb, var(--danger) 20%, transparent); color:var(--danger); }
  .tabela-pedidos td, .tabela-pedidos th { white-space:nowrap; }
  .tabela-pedidos td:nth-child(2) { white-space:normal; }
  .paginacao-pedidos { display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-top:10px; font-size:13px; color:var(--muted-strong); }
  .paginacao-pedidos button { height:30px; padding:0 12px; font-size:12px; }
  .linha-tempo-item { display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--border); font-size:13px; }
  .linha-tempo-item:first-child { border-top:none; }
</style>
</head>
<body>
  <header class="ds-topbar">
    <a class="ds-topbar-marca" href="/crm/painel.html" aria-label="Ir para o início">
      <span class="ds-topbar-produto"><span class="ds-topbar-produto-acento">CR</span>M</span>
      <span class="ds-topbar-kyvvo">kyvvo</span>
    </a>
    <div class="ds-topbar-acoes">
    <div class="ds-notificacoes" id="notificacoes-sino">
      <button class="ds-notificacoes-btn" id="notificacoes-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Notificações">
        <span data-icon="bell" data-size="20"></span>
        <span class="ds-notificacoes-contagem" id="notificacoes-contagem" hidden></span>
      </button>
      <div class="ds-notificacoes-painel" role="menu" hidden>
        <div class="ds-notificacoes-lista" id="notificacoes-lista"></div>
      </div>
    </div>
    <div class="topo-perfil" id="topo-perfil">
      <button class="topo-perfil-gatilho ds-topbar-perfil" id="topo-perfil-gatilho" type="button" aria-haspopup="true" aria-expanded="false">
        <div class="ds-topbar-avatar js-avatar-usuario"></div>
        <span class="ds-topbar-nome js-nome-usuario"></span>
        <span data-icon="chevron-down" data-size="14"></span>
      </button>
      <div class="menu-perfil" id="menu-perfil" hidden>
        <div class="menu-perfil-usuario">
          <div class="avatar js-avatar-usuario"></div>
          <div class="textos">
            <div class="nome js-nome-usuario"></div>
            <div class="email js-email-usuario"></div>
          </div>
        </div>
        <div class="menu-perfil-divisor"></div>
        <div class="menu-perfil-item menu-perfil-tema">
          <span data-icon="sun-moon" data-size="16"></span><span class="rotulo">Tema</span>
          <button class="toggle-tema" type="button" role="switch" aria-checked="false" aria-label="Alternar tema claro/escuro"><span class="bolinha"></span></button>
        </div>
        <div id="menu-perfil-outros-produtos"></div>
        <div class="menu-perfil-divisor"></div>
        <button class="menu-perfil-item perigo btn-sair" type="button">
          <span data-icon="log-out" data-size="16"></span><span class="rotulo">Sair da conta</span>
        </button>
      </div>
    </div>
    </div>
  </header>
  <div class="app-shell">
    <nav class="ds-menu" data-ds-menu id="painel-sidebar">
      <button type="button" class="ds-menu-toggle" id="btn-toggle-sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <ul class="ds-menu-lista">
        <li><a class="ds-menu-link" href="/crm/painel.html"><span class="ds-menu-icone" data-icon="layout-dashboard"></span><span class="ds-menu-rotulo">Painel</span></a></li>
        <li><a class="ds-menu-link" href="/crm/quadro.html"><span class="ds-menu-icone" data-icon="kanban"></span><span class="ds-menu-rotulo">Quadro</span></a></li>
        <li><a class="ds-menu-link" href="/crm/clientes.html"><span class="ds-menu-icone" data-icon="users"></span><span class="ds-menu-rotulo">Clientes</span></a></li>
        <li><a class="ds-menu-link" href="/crm/pedidos.html"><span class="ds-menu-icone" data-icon="list"></span><span class="ds-menu-rotulo">Pedidos</span></a></li>
        <li><a class="ds-menu-link" href="/crm/estoque.html"><span class="ds-menu-icone" data-icon="package"></span><span class="ds-menu-rotulo">Estoque</span></a></li>
        <li><a class="ds-menu-link" href="/crm/relatorios.html"><span class="ds-menu-icone" data-icon="chart-column"></span><span class="ds-menu-rotulo">Relatórios</span></a></li>
        <li><a class="ds-menu-link" href="/crm/campanhas.html"><span class="ds-menu-icone" data-icon="funnel"></span><span class="ds-menu-rotulo">Campanhas</span></a></li>
        <li class="ds-menu-grupo">
          <button type="button" class="ds-menu-link ds-menu-grupo-botao" aria-expanded="false">
            <span class="ds-menu-icone" data-icon="settings"></span>
            <span class="ds-menu-rotulo">Configurações</span>

    <div class="painel-main" id="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos">
          <div class="linha-titulo"><a href="/crm/clientes.html" style="color:var(--muted);font-size:13px;text-decoration:none">← Clientes</a></div>
        </div>
      </div>
      <div id="conteudo-cliente"><div class="vazio">Carregando…</div></div>
    </div>
  </div>

  <footer data-ds-rodape data-ds-produto="CRM"></footer>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    const clienteId = new URLSearchParams(window.location.search).get('id');
    let cliente = null;
    let segmentosOpcoes = [];
    let origensOpcoes = [];
    let paginaPedidos = 0;
    let eventosVisiveis = 2;
    const PEDIDOS_POR_PAGINA = 5;

    const ROTULO_TIPO_EVENTO = {
      criacao: 'Criado',
      mudanca_etapa: 'Mudou de etapa',
      pagamento: 'Pagamento atualizado',
      importacao: 'Importado',
      formulario: 'Respondeu formulário',
      sorteio: 'Participou de sorteio',
      mensagem_enviada: 'Mensagem enviada',
      mesclagem: 'Mesclado com outro cadastro',
    };

    async function carregar() {
      if (!clienteId) {
        document.getElementById('conteudo-cliente').innerHTML = '<div class="vazio">Cliente não informado.</div>';
        return;
      }
      const [resCliente, resSegmentos, resOrigens] = await Promise.all([
        apiFetch(`/crm/api/clientes/${clienteId}`),
        apiFetch('/crm/api/opcoes-cadastro?tipo=segmento'),
        apiFetch('/crm/api/opcoes-cadastro?tipo=origem'),
      ]);
      if (!resCliente.ok) {
        document.getElementById('conteudo-cliente').innerHTML = '<div class="vazio">Cliente não encontrado.</div>';
        return;
      }
      cliente = await resCliente.json();
      segmentosOpcoes = (await resSegmentos.json()).filter((o) => o.ativo);
      origensOpcoes = (await resOrigens.json()).filter((o) => o.ativo);
      paginaPedidos = 0;
      eventosVisiveis = 2;
      renderizar();
    }

    // <select> sempre inclui o valor atual do cliente, mesmo que tenha sido
    // desativado/removido do cadastro depois — nunca troca o dado dele à
    // força só por renderizar a tela.
    function opcoesComboHtml(opcoes, valorAtual) {
      const valores = new Set(opcoes.map((o) => o.valor));
      const extra = valorAtual && !valores.has(valorAtual) ? `<option value="${escapeHtml(valorAtual)}" selected>${escapeHtml(valorAtual)}</option>` : '';
      return `<option value="">—</option>${extra}${opcoes.map((o) => `<option value="${escapeHtml(o.valor)}" ${o.valor === valorAtual ? 'selected' : ''}>${escapeHtml(o.valor)}</option>`).join('')}`;
    }

    function renderizar() {
      const c = cliente;
      document.getElementById('conteudo-cliente').innerHTML = `
        <div class="cabecalho-cliente bloco-cliente">
          <div>
            <h1 style="margin:0 0 4px">${escapeHtml(c.nome)} ${c.bloqueado ? '<span class="badge badge-bloqueado">Bloqueado</span>' : ''}</h1>
          </div>
          <div class="acoes">
            ${c.telefone ? `<a class="ds-btn ds-btn-primario" style="background:#25D366" href="${linkWhatsapp(c.telefone)}" target="_blank" rel="noopener">${icon('message-circle', 16)} Atendimento</a>` : ''}
            <a class="ds-btn ds-btn-secundario" href="/crm/pedidos.html?cliente_id=${c.id}">Ver pedidos</a>
            <button type="button" class="ds-btn ds-btn-secundario" id="btn-bloquear">${c.bloqueado ? 'Desbloquear' : 'Bloquear'}</button>
          </div>
        </div>

        <div class="card bloco-cliente">
          <h3 style="margin:0 0 14px">Dados de cadastro</h3>
          <div class="ds-form">
            <div class="ds-form-grade">
              <div class="ds-campo ds-campo-largo"><label class="ds-rotulo" for="ed-nome">Nome</label><input class="ds-input" id="ed-nome" value="${escapeHtml(c.nome)}"></div>
              <div class="ds-campo"><label class="ds-rotulo" for="ed-telefone">Telefone</label><input class="ds-input" id="ed-telefone" data-ds-mascara="telefone" value="${escapeHtml(whatsappParaExibicao(c.telefone))}"></div>
              <div class="ds-campo"><label class="ds-rotulo" for="ed-email">E-mail</label><input class="ds-input" id="ed-email" type="email" value="${escapeHtml(c.email || '')}"></div>
              <div class="ds-campo"><label class="ds-rotulo" for="ed-documento">CPF ou CNPJ</label><input class="ds-input" id="ed-documento" data-ds-mascara="${(c.cpf || c.cnpj || '').replace(/\W/g, '').length > 11 ? 'cnpj' : 'cpf'}" value="${escapeHtml(c.cpf || c.cnpj || '')}"></div>
              <div class="ds-campo"><label class="ds-rotulo" for="ed-nascimento">Data de nascimento</label><input class="ds-input" id="ed-nascimento" type="date" value="${c.data_nascimento ? String(c.data_nascimento).slice(0, 10) : ''}"></div>
              <div class="ds-campo ds-campo-largo"><label class="ds-rotulo" for="ed-endereco">Endereço completo</label><input class="ds-input" id="ed-endereco" placeholder="Rua, número, complemento, bairro, cidade - UF, CEP" value="${escapeHtml(c.endereco_completo || '')}"></div>
              <div class="ds-campo"><label class="ds-rotulo" for="ed-cidade">Cidade</label><input class="ds-input" id="ed-cidade" value="${escapeHtml(c.cidade || '')}"></div>
              <div class="ds-campo"><label class="ds-rotulo" for="ed-uf">UF</label><input class="ds-input" id="ed-uf" maxlength="2" style="text-transform:uppercase" value="${escapeHtml(c.uf || '')}"></div>
              <div class="ds-campo">
                <label class="ds-rotulo" for="ed-segmento">Segmento</label>
                <div class="ds-select"><select id="ed-segmento">${opcoesComboHtml(segmentosOpcoes, c.segmento)}</select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
              </div>
              <div class="ds-campo">
                <label class="ds-rotulo" for="ed-origem">Origem</label>
                <div class="ds-select"><select id="ed-origem">${opcoesComboHtml(origensOpcoes, c.origem)}</select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
              </div>
            </div>

            <div class="ficha-secao">
              <h4>Tags</h4>
              <div class="ficha-tags">${(c.tags || []).map((t) => `<span class="badge destaque">${escapeHtml(t.nome)}<button type="button" class="remover-tag-chip" data-remover-tag="${t.id}" aria-label="Remover tag">×</button></span>`).join('') || '<span class="vazio" style="padding:0">Nenhuma ainda.</span>'}</div>
              <input class="ds-input" type="text" id="ficha-nova-tag" placeholder="+ Nova tag (Enter)" style="margin-top:8px;max-width:220px">
            </div>

            <div class="ds-campo">
              <label class="ds-rotulo" for="ed-observacoes">Observações</label>
              <textarea class="ds-textarea" id="ed-observacoes">${escapeHtml(c.observacoes || '')}</textarea>
            </div>

            <div class="modal-erro" id="ed-erro"></div>
            <div class="ds-form-acoes">
              <button type="button" class="ds-btn ds-btn-primario" id="btn-salvar-cliente" style="display:none">Salvar alterações</button>
            </div>
          </div>
        </div>

        <div class="card bloco-cliente">
          <h3 style="margin:0 0 14px">Resumo</h3>
          <div class="ficha-metricas">
            <div class="ficha-metrica"><div class="lbl">Total gasto</div><div class="num">${formatarMoeda(c.metricas.total_gasto)}</div></div>
            <div class="ficha-metrica"><div class="lbl">Pedidos</div><div class="num">${c.metricas.quantidade_pedidos}</div></div>
            <div class="ficha-metrica"><div class="lbl">Ticket médio</div><div class="num">${formatarMoeda(c.metricas.ticket_medio)}</div></div>
            <div class="ficha-metrica"><div class="lbl">Dias sem comprar</div><div class="num">${c.metricas.dias_sem_comprar ?? '—'}</div></div>
          </div>
        </div>

        <div class="card bloco-cliente">
          <h3 style="margin:0 0 14px">Histórico de pedidos</h3>
          <div id="tabela-pedidos-wrap"></div>
        </div>

        <div class="card">
          <h3 style="margin:0 0 4px">Linha do tempo</h3>
          <div id="linha-do-tempo-wrap"></div>
        </div>
      `;

      renderizarPedidos();
      renderizarLinhaDoTempo();
      ligarEventosFormulario();
    }

    function renderizarPedidos() {
      const c = cliente;
      const wrap = document.getElementById('tabela-pedidos-wrap');
      if (!c.pedidos.length) { wrap.innerHTML = '<p class="vazio">Nenhum pedido ainda.</p>'; return; }

      const totalPaginas = Math.ceil(c.pedidos.length / PEDIDOS_POR_PAGINA);
      const inicio = paginaPedidos * PEDIDOS_POR_PAGINA;
      const pagina = c.pedidos.slice(inicio, inicio + PEDIDOS_POR_PAGINA);

      wrap.innerHTML = `
        <table class="tabela-pedidos">
          <thead><tr><th>Nº</th><th>Produtos</th><th>Quantidade</th><th>Valor</th><th>Data do pedido</th><th>Data de entrega</th></tr></thead>
          <tbody>
            ${pagina.map((p) => {
              const itens = p.itens || [];
              const produtos = itens.map((i) => escapeHtml(i.descricao || 'Item')).join(', ') || '—';
              const quantidade = itens.reduce((soma, i) => soma + Number(i.quantidade || 0), 0);
              return `
                <tr>
                  <td>${p.numero}</td>
                  <td>${produtos}</td>
                  <td>${quantidade || '—'}</td>
                  <td>${formatarMoeda(p.valor_total)}</td>
                  <td>${formatarData(p.criado_em)}</td>
                  <td>${p.data_entrega ? formatarData(p.data_entrega) : '—'}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
        ${totalPaginas > 1 ? `
          <div class="paginacao-pedidos">
            <button type="button" class="ds-btn ds-btn-secundario" id="btn-pedidos-anterior" ${paginaPedidos === 0 ? 'disabled' : ''}>Anterior</button>
            <span>Página ${paginaPedidos + 1} de ${totalPaginas}</span>
            <button type="button" class="ds-btn ds-btn-secundario" id="btn-pedidos-proximo" ${paginaPedidos >= totalPaginas - 1 ? 'disabled' : ''}>Próxima</button>
          </div>
        ` : ''}
      `;

      const btnAnterior = document.getElementById('btn-pedidos-anterior');
      const btnProximo = document.getElementById('btn-pedidos-proximo');
      if (btnAnterior) btnAnterior.addEventListener('click', () => { paginaPedidos--; renderizarPedidos(); });
      if (btnProximo) btnProximo.addEventListener('click', () => { paginaPedidos++; renderizarPedidos(); });
    }

    function renderizarLinhaDoTempo() {
      const c = cliente;
      const wrap = document.getElementById('linha-do-tempo-wrap');
      if (!c.eventos.length) { wrap.innerHTML = '<p class="vazio">Sem eventos.</p>'; return; }

      const visiveis = c.eventos.slice(0, eventosVisiveis);
      wrap.innerHTML = `
        ${visiveis.map((e) => `
          <div class="linha-tempo-item">
            <span>${ROTULO_TIPO_EVENTO[e.tipo] || e.tipo}</span>
            <span style="color:var(--muted);font-size:11.5px">${formatarDataHora(e.criado_em)}</span>
          </div>
        `).join('')}
        ${eventosVisiveis < c.eventos.length ? `<button type="button" class="ds-btn ds-btn-secundario" id="btn-mais-eventos" style="margin-top:10px">Mostrar mais</button>` : ''}
      `;
      const btnMais = document.getElementById('btn-mais-eventos');
      if (btnMais) btnMais.addEventListener('click', () => { eventosVisiveis += 2; renderizarLinhaDoTempo(); });
    }

    function ligarEventosFormulario() {
      const c = cliente;

      document.getElementById('btn-bloquear').addEventListener('click', async () => {
        const res = await apiFetch(`/crm/api/clientes/${c.id}`, { method: 'PATCH', body: JSON.stringify({ bloqueado: !c.bloqueado }) });
        if (res.ok) await carregar();
      });

      // Botão "Salvar alterações" só aparece depois de uma mudança de
      // verdade num campo — pedido do Bruno, 2026-09-25.
      const btnSalvar = document.getElementById('btn-salvar-cliente');
      const camposEditaveis = ['ed-nome', 'ed-telefone', 'ed-email', 'ed-documento', 'ed-nascimento', 'ed-endereco', 'ed-cidade', 'ed-uf', 'ed-segmento', 'ed-origem', 'ed-observacoes'];
      camposEditaveis.forEach((id) => {
        document.getElementById(id).addEventListener('input', () => { btnSalvar.style.display = ''; });
        document.getElementById(id).addEventListener('change', () => { btnSalvar.style.display = ''; });
      });

      // CPF (11 díg.) e CNPJ (14, hoje alfanumérico pela Receita) têm
      // máscaras diferentes no DS — não existe um tipo combinado, então
      // troca o tipo da máscara sozinho conforme o tamanho do que foi
      // digitado. Listener direto no elemento (fase de captura/target) roda
      // antes do listener do DS em `document` (fase de bubble) — o DS lê o
      // atributo já atualizado na mesma tecla, sem atraso de 1 caractere.
      // Limpa `data-ds-preparado` pra inputmode/placeholder também
      // atualizarem pro novo tipo.
      const campoDocumento = document.getElementById('ed-documento');
      campoDocumento.addEventListener('input', () => {
        const digitos = campoDocumento.value.replace(/\W/g, '');
        const tipoCerto = digitos.length > 11 ? 'cnpj' : 'cpf';
        if (campoDocumento.getAttribute('data-ds-mascara') !== tipoCerto) {
          campoDocumento.setAttribute('data-ds-mascara', tipoCerto);
          campoDocumento.removeAttribute('data-ds-preparado');
        }
      });

      btnSalvar.addEventListener('click', async () => {
        const nome = document.getElementById('ed-nome').value.trim();
        if (!nome) { document.getElementById('ed-erro').textContent = 'Nome é obrigatório'; return; }
        const tipoDocumento = campoDocumento.getAttribute('data-ds-mascara');
        const documento = KyvvoDS.mascara.limpar(tipoDocumento, campoDocumento.value);
        const ehCnpj = tipoDocumento === 'cnpj';
        const res = await apiFetch(`/crm/api/clientes/${c.id}`, {
          method: 'PATCH',
          body: JSON.stringify({
            nome,
            telefone: document.getElementById('ed-telefone').value.trim() || null,
            email: document.getElementById('ed-email').value.trim() || null,
            cpf: documento && !ehCnpj ? documento : null,
            cnpj: documento && ehCnpj ? documento : null,
            data_nascimento: document.getElementById('ed-nascimento').value || null,
            cidade: document.getElementById('ed-cidade').value.trim() || null,
            uf: document.getElementById('ed-uf').value.trim() || null,
            endereco_completo: document.getElementById('ed-endereco').value.trim() || null,
            segmento: document.getElementById('ed-segmento').value || null,
            origem: document.getElementById('ed-origem').value || null,
            observacoes: document.getElementById('ed-observacoes').value.trim() || null,
          }),
        });
        if (!res.ok) { document.getElementById('ed-erro').textContent = 'Falha ao salvar'; return; }
        document.getElementById('ed-erro').textContent = '';
        await carregar();
      });

      document.querySelectorAll('[data-remover-tag]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await apiFetch(`/crm/api/clientes/${c.id}/tags/${btn.dataset.removerTag}`, { method: 'DELETE' });
          carregar();
        });
      });
      document.getElementById('ficha-nova-tag').addEventListener('keydown', async (e) => {
        if (e.key !== 'Enter') return;
        const nome = e.target.value.trim();
        if (!nome) return;
        e.target.disabled = true;
        const res = await apiFetch(`/crm/api/clientes/${c.id}/tags`, { method: 'POST', body: JSON.stringify({ nome }) });
        if (!res.ok) { e.target.disabled = false; return; }
        carregar();
      });
    }

    carregar();
  </script>
</body>
</html>
