<style>
  .painel-main { overflow-x:hidden; }
  .quadro-scroll { overflow-x:auto; padding-bottom:12px; }
  /* align-items:stretch (não "start") — pedido do Bruno: quando o título de
     uma etapa quebra linha (fica mais alto), as outras colunas da MESMA
     linha (cabeçalho ou célula) precisam acompanhar a altura, não ficar
     "flutuando" mais baixas que a vizinha mais alta. É o comportamento
     padrão de CSS Grid quando não se sobrescreve align-items — só precisou
     tirar o "start" que já estava aqui. */
  .quadro-grid { display:grid; grid-auto-rows:min-content; gap:10px; align-items:stretch; }

  .raia-label { position:sticky; left:0; background:var(--bg); padding:10px 8px; font-weight:700; font-size:13px;
    display:flex; align-items:center; justify-content:space-between; gap:6px; z-index:3; color:var(--text); }
  .raia-label .btn-remover-recurso { opacity:0; }
  .raia-label:hover .btn-remover-recurso { opacity:1; }

  /* Recolher a coluna de recursos — ícone igual ao de recolher o menu
     lateral (mesmo chevron único que gira 180° via CSS, em vez de trocar de
     ícone — pedido do Bruno, 2026-10-03) + botão "+ Recurso" agora juntos no
     cabeçalho da própria coluna de recursos (1ª célula da grade, antes um
     <div></div> vazio) — antes "+ Recurso" ficava dentro do cabeçalho de "A
     fazer", a coluna vizinha. "Avatar" com iniciais no lugar do nome
     completo em cada raia (ver iniciaisRecurso() e --largura-raia, setada em
     renderizar()). */
  .cabecalho-recursos { position:sticky; left:0; z-index:4; display:flex; align-items:center; gap:4px; height:100%; min-height:38px; }
  .btn-recolher-recursos { flex-shrink:0; width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    background:var(--card); border:1px solid var(--border); border-radius:50%; color:var(--muted-strong); padding:0; }
  .btn-recolher-recursos:hover { background:var(--surface-hover); color:var(--text); }
  .btn-recolher-recursos svg { transition:transform .18s ease; }
  .quadro-grid.recursos-recolhido .btn-recolher-recursos svg { transform:rotate(180deg); }
  .quadro-grid.recursos-recolhido .cabecalho-recursos { justify-content:center; }
  .quadro-grid.recursos-recolhido .raia-label { justify-content:center; padding:10px 4px; }
  .raia-avatar { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px;
    border-radius:50%; background:var(--accent-tint); color:var(--accent-strong); font-size:12px; font-weight:700; flex-shrink:0; }

  .coluna-header { position:relative; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 12px;
    display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; min-width:220px; color:var(--text); cursor:grab; }
  .coluna-header.arrastando-coluna { opacity:.4; }
  .coluna-header.recebendo-coluna { border-color:var(--accent); }
  /* Primeira coluna ("A fazer") fixa à esquerda — pedido do Bruno: nunca sai
     do lugar no drag-and-drop de colunas, todo pedido novo entra nela (ver
     migration 013_etapas_fixa.sql). left = --largura-raia (setada em
     renderizar(), 170px expandida / 56px recolhida) = largura de
     .raia-label, as duas ficam "coladas" formando a área congelada da
     rolagem horizontal. */
  .coluna-header.coluna-fixa,
  .celula.coluna-fixa { position:sticky; left:var(--largura-raia, 170px); z-index:2; }
  .coluna-header.coluna-fixa { cursor:default; }
  /* Raio de automação (⚡) — antes ficava dentro do cabeçalho, junto do
     título; agora fica na borda entre uma coluna e a próxima (pedido do
     Bruno: "entre os títulos de cada coluna"), roxo pra se destacar dos
     outros ícones de ação do cabeçalho. */
  /* Escopado com .coluna-header pra vencer .coluna-header button (que tem a
     mesma especificidade em classes + 1 elemento a mais — sem isso a cor
     roxa e o tamanho circular eram sobrescritos pelo estilo genérico dos
     outros botões do cabeçalho). */
  .coluna-header .btn-automacao-etapa { position:absolute; right:-14px; top:50%; transform:translateY(-50%); z-index:5;
    width:26px; height:26px; display:flex; align-items:center; justify-content:center; padding:0;
    background:var(--card); border:1px solid var(--border-strong); border-radius:50%; color:#7c3aed; font-size:14px; }
  .coluna-header .btn-automacao-etapa:hover { background:var(--surface-muted); color:#7c3aed; }
  .coluna-header.tipo-ganha .nome-etapa { color:var(--success); }
  .coluna-header.tipo-perdida .nome-etapa { color:var(--danger); }
  .coluna-header .nome-etapa { flex:1; cursor:text; }
  .coluna-header .contagem-coluna { font-size:11px; font-weight:600; color:var(--muted); background:var(--surface-muted);
    border-radius:var(--radius-full); padding:2px 8px; }
  .coluna-header input.editar-nome { width:100%; background:transparent; border:1px solid var(--accent); border-radius:6px;
    padding:2px 6px; font-size:13px; color:var(--text); }
  .coluna-header button { background:transparent; color:var(--muted); width:auto; height:auto; margin:0; padding:2px 6px;
    font-size:12px; border-radius:6px; }
  .coluna-header button:hover { background:var(--surface-muted); color:var(--danger); }
  .coluna-header .btn-pronto { display:flex; }
  .coluna-header .btn-pronto:hover { color:var(--accent); }
  .coluna-header .btn-pronto.ativo { color:var(--accent-strong); }

  /* "+ Recurso" — fica no cabeçalho da coluna de recursos, junto do botão de
     recolher (pedido do Bruno, 2026-10-03: antes ficava dentro do cabeçalho
     da coluna fixa "A fazer", a coluna vizinha). Cor de destaque própria —
     sem isso herdaria o estilo genérico dos botões de ação de coluna. Some o
     rótulo (só ícone) com a coluna de recursos recolhida, mesmo princípio do
     "avatar" de iniciais nas raias. */
  .btn-novo-recurso-coluna { display:flex; align-items:center; gap:4px; height:28px; padding:0 8px; border-radius:var(--radius-md);
    background:var(--card); border:1px solid var(--border); color:var(--accent-strong); font-weight:600; font-size:12px; }
  .btn-novo-recurso-coluna:hover { background:var(--accent-tint); color:var(--accent-strong); }
  /* Recolhido (56px de largura) não cabe os 2 botões lado a lado — some o
     "+ Recurso" e deixa só o chevron de expandir, mesma lógica de esconder
     ação secundária já usada no botão de apagar recurso (opacity:0 acima). */
  .quadro-grid.recursos-recolhido .btn-novo-recurso-coluna { display:none; }

  .coluna-add { display:flex; align-items:center; justify-content:center; min-width:60px; }
  .coluna-add button { width:36px; height:36px; border-radius:50%; font-size:18px; line-height:1; padding:0;
    background:var(--surface-muted); color:var(--text); }
  .coluna-add button:hover { background:var(--accent-tint); color:var(--accent-strong); }

  .celula { background:var(--bg); border:1px dashed var(--border-strong); border-radius:var(--radius-md); padding:8px;
    min-width:220px; min-height:60px; display:flex; flex-direction:column; gap:6px; }
  .celula.arrastando-sobre { border-color:var(--accent); background:var(--accent-tint); }
  .celula-vazia { color:var(--muted); font-size:11px; padding:10px 4px; text-align:center; }
  /* "+N pedidos"/"Mostrar menos" — cada célula (raia × etapa) só renderiza
     os 10 primeiros cartões por padrão (pedido do Bruno, 2026-10-04); o
     contador no topo da coluna continua somando todo mundo, truncado ou
     não. */
  .btn-expandir-celula { width:100%; height:30px; background:transparent; border:1px dashed var(--border-strong);
    color:var(--muted-strong); font-size:11.5px; font-weight:600; border-radius:var(--radius-md); }
  .btn-expandir-celula:hover { background:var(--surface-muted); color:var(--text); }

  .cartao-pedido { position:relative; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 32px 10px 12px; cursor:grab; font-size:12.5px; }
  .cartao-pedido:active { cursor:grabbing; }
  .cartao-pedido .nome { font-weight:700; color:var(--text); }
  .cartao-pedido .linha { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .cartao-pedido .valor { font-weight:600; color:var(--text-secondary); }
  .cartao-pedido .dias-parado { color:var(--danger); font-weight:600; }
  .badge-prioridade-altissima { background:color-mix(in srgb, var(--danger) 25%, transparent); color:var(--danger); }

  /* Menu ⋯ do cartão — mesmo padrão de pedidos.html/opcoes-cadastro.html,
     ainda não migrou pra shell.css compartilhado. Posicionado no canto do
     card (position:relative acima) em vez de ao lado do texto, já que o
     card ficou só com o nome depois de tirar os "subtítulos" (prioridade/
     pagamento/origem/dias) pra reduzir a quantidade de informação na cara
     do quadro — tudo isso continua acessível no menu/modal de detalhe. */
  .cartao-pedido .menu-acoes-wrap { position:absolute; top:4px; right:4px; }
  .cartao-pedido .btn-acoes { width:24px; height:24px; background:transparent; color:var(--muted); padding:0; border-radius:6px; }
  .cartao-pedido .btn-acoes:hover { background:var(--surface-muted); color:var(--text); }
  .menu-acoes { position:absolute; right:0; top:28px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md);
    box-shadow:var(--shadow-md); min-width:180px; z-index:20; padding:6px; }
  .menu-acoes button { display:block; width:100%; text-align:left; background:transparent; color:var(--text); padding:8px 10px; border-radius:6px; font-size:13px; height:auto; }
  .menu-acoes button:hover { background:var(--surface-muted); }
  .menu-acoes button.perigo { color:var(--danger); }
  .linha-cliente-vincular { padding:8px 6px; border-top:1px solid var(--border); cursor:pointer; border-radius:6px; }
  .linha-cliente-vincular:first-child { border-top:none; }
  .linha-cliente-vincular:hover { background:var(--surface-muted); }
  .linha-cliente-vincular .telefone { font-size:12px; color:var(--muted); }

  /* Raia especial "Prioridade Altíssima" — só aparece quando existe pelo
     menos 1 pedido nessa prioridade (ver raias() no script). */
  .raia-label.raia-altissima { background:color-mix(in srgb, var(--danger) 40%, var(--bg)); color:var(--text); border-radius:var(--radius-md); }
  .celula.celula-altissima { background:color-mix(in srgb, var(--danger) 40%, var(--bg)); border-style:solid; border-color:var(--danger); }

  .editar-nome { width:100%; background:transparent; border:1px solid var(--accent); border-radius:6px; padding:2px 6px;
    font-size:13px; color:var(--text); }
  .linha-recurso { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--border); font-size:13.5px; }
  .linha-recurso:first-child { border-top:none; }
  .linha-recurso .nome-recurso { cursor:text; flex:1; }
  .linha-recurso .btn-remover-recurso { height:28px; padding:0 10px; font-size:12px; }
</style>

  <script>
    let etapas = [];
    let recursos = [];
    let pedidos = [];
    let produtos = [];
    const TIPO_ARRASTO_COLUNA = 'application/x-etapa-id';

    // Recolher a coluna de recursos (raias) — botão manual no canto superior
    // esquerdo do quadro, estado lembrado entre sessões (mesmo padrão de
    // crm_sidebar_oculta em shell.js). Recolhida, a coluna mostra só um
    // "avatar" com as iniciais do recurso em vez do nome completo — útil pra
    // telas menores ou com muitos recursos cadastrados.
    let recursosRecolhido = localStorage.getItem('crm_quadro_recursos_recolhido') === '1';
    const LARGURA_RAIA_EXPANDIDA = 170;
    const LARGURA_RAIA_RECOLHIDA = 56;

    // Mostra só os 10 primeiros pedidos de cada célula (raia × etapa) — uma
    // coluna/recurso com dezenas de pedidos travava a rolagem — com um
    // botão "+N pedidos" pra expandir aquela célula específica. O contador
    // no topo da coluna (contagem-coluna) NUNCA usa esse recorte — sempre
    // conta todo mundo da etapa, truncado ou não (pedido do Bruno,
    // 2026-10-04). Estado só em memória (reseta ao recarregar a página).
    const LIMITE_CARTOES_CELULA = 10;
    let celulasExpandidas = new Set();

    function iniciaisRecurso(nome) {
      const partes = (nome || '').trim().split(/\s+/).filter(Boolean);
      if (!partes.length) return '?';
      return (partes[0][0] + (partes.length > 1 ? partes[partes.length - 1][0] : '')).toUpperCase();
    }

    async function carregar() {
      const [resEtapas, resRecursos, resPedidos, resProdutos] = await Promise.all([
        apiFetch('/crm/api/etapas'),
        apiFetch('/crm/api/recursos'),
        apiFetch('/crm/api/pedidos?ocultar_antigos_ultima_coluna=1'),
        apiFetch('/crm/api/produtos'),
      ]);
      etapas = await resEtapas.json();
      recursos = await resRecursos.json();
      pedidos = await resPedidos.json();
      produtos = await resProdutos.json();
      renderizar();
    }

    // Raia especial "Prioridade Altíssima" (pedido do Bruno, 2026-09-25):
    // um pedido com prioridade altíssima sai da raia de recurso normal e
    // fica só aqui — nunca aparece duplicado nas duas. A raia some por
    // completo quando não há nenhum pedido nessa prioridade.
    const RAIA_ALTISSIMA = '__altissima__';

    function raias() {
      // Raia fixa "Sem recurso" (recurso_id null) sempre primeiro — pedido
      // nunca fica "perdido" visualmente só por não ter recurso atribuído.
      const normais = [{ id: null, nome: 'Sem recurso', fixa: true }, ...recursos];
      const temAltissima = pedidos.some((p) => p.prioridade === 'altissima');
      return temAltissima ? [{ id: RAIA_ALTISSIMA, nome: 'Prioridade Altíssima', altissima: true }, ...normais] : normais;
    }

    function pedidosDe(raiaId, etapaId) {
      if (raiaId === RAIA_ALTISSIMA) return pedidos.filter((p) => p.prioridade === 'altissima' && p.etapa_id === etapaId);
      return pedidos.filter((p) => (p.recurso_id || null) === raiaId && p.etapa_id === etapaId && p.prioridade !== 'altissima');
    }

    const BADGE_PAGAMENTO = { pendente: 'perigo', parcial: 'aviso', pago: 'sucesso' };
    const ROTULO_PRIORIDADE = { altissima: 'Altíssima', alta: 'Alta', media: 'Média', baixa: 'Baixa' };

    function cartaoHtml(p) {
      const numQtd = Number(p.quantidade_itens);
      const qtd = numQtd > 1 ? `${Number.isInteger(numQtd) ? numQtd : numQtd.toLocaleString('pt-BR')}× ` : '';
      // Card reduzido ao essencial (nome) — prioridade/pagamento/origem/dias
      // parado saíram daqui (pedido do Bruno, 2026-10-02) e ficam só no menu
      // ⋯/modal de detalhe. Quem precisa saber de pedido parado já é avisado
      // pela notificação "Pedidos parados" (Configurações > Notificações).
      return `
        <div class="cartao-pedido" draggable="true" data-pedido="${p.id}">
          <div class="nome">${qtd}${escapeHtml(p.cliente_nome)}</div>
          <div class="menu-acoes-wrap">
            <button type="button" class="btn-acoes" data-abrir-menu-pedido="${p.id}" aria-haspopup="true" aria-expanded="false" title="Ações">⋯</button>
            <div class="menu-acoes" data-menu-pedido="${p.id}" hidden>
              <button type="button" data-vincular-cliente="${p.id}">Vincular a um cliente</button>
              <button type="button" data-editar-pedido-quadro="${p.id}">Editar</button>
              <button type="button" data-confirmar-pagamento-quadro="${p.id}">Confirmar pagamento</button>
              <button type="button" data-confirmar-frete-quadro="${p.id}">Confirmar frete</button>
              <button type="button" class="perigo" data-remover-pedido-quadro="${p.id}">Remover</button>
            </div>
          </div>
        </div>
      `;
    }

    function cartoesCelulaHtml(cartoes, raiaId, etapaId) {
      if (!cartoes.length) return '<div class="celula-vazia">—</div>';
      const chave = `${raiaId || ''}|${etapaId}`;
      const expandida = celulasExpandidas.has(chave);
      const visiveis = expandida ? cartoes : cartoes.slice(0, LIMITE_CARTOES_CELULA);
      const escondidos = cartoes.length - visiveis.length;
      let html = visiveis.map(cartaoHtml).join('');
      if (escondidos > 0) {
        html += `<button type="button" class="btn-expandir-celula" data-expandir-celula="${chave}">+${escondidos} pedido${escondidos === 1 ? '' : 's'}</button>`;
      } else if (expandida && cartoes.length > LIMITE_CARTOES_CELULA) {
        html += `<button type="button" class="btn-expandir-celula" data-expandir-celula="${chave}">Mostrar menos</button>`;
      }
      return html;
    }

    function renderizar() {
      const linhas = raias();
      const grid = document.getElementById('quadro-grid');
      const larguraRaia = recursosRecolhido ? LARGURA_RAIA_RECOLHIDA : LARGURA_RAIA_EXPANDIDA;
      grid.style.gridTemplateColumns = `${larguraRaia}px repeat(${etapas.length}, minmax(230px, 1fr)) 190px`;
      grid.style.setProperty('--largura-raia', `${larguraRaia}px`);
      grid.classList.toggle('recursos-recolhido', recursosRecolhido);

      let html = `
        <div class="cabecalho-recursos">
          <button type="button" id="btn-recolher-recursos" class="btn-recolher-recursos"
            title="${recursosRecolhido ? 'Expandir coluna de recursos' : 'Recolher coluna de recursos'}"
            aria-label="${recursosRecolhido ? 'Expandir' : 'Recolher'} coluna de recursos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button type="button" id="btn-novo-recurso" class="btn-novo-recurso-coluna" title="Novo recurso">${icon('plus', 14)}<span class="rotulo-recurso">Recurso</span></button>
        </div>
      `;
      etapas.forEach((et) => {
        html += `
          <div class="coluna-header tipo-${et.tipo}${et.fixa ? ' coluna-fixa' : ''}" draggable="${et.fixa ? 'false' : 'true'}" data-etapa-header="${et.id}" data-fixa="${!!et.fixa}">
            <span class="nome-etapa" data-editar-etapa="${et.id}">${escapeHtml(et.nome)}</span>
            <span class="contagem-coluna">${pedidos.filter((p) => p.etapa_id === et.id).length}</span>
            <button type="button" class="btn-pronto${et.eh_pronto ? ' ativo' : ''}" data-marcar-pronto="${et.id}" data-valor-pronto="${!et.eh_pronto}" title="${et.eh_pronto ? 'Esta é a etapa de pronto pra envio/retirada (clique pra desmarcar)' : 'Marcar como etapa de pronto pra envio/retirada'}">${icon('package-check', 14)}</button>
            ${et.fixa ? '' : `<button type="button" data-apagar-etapa="${et.id}" data-nome-etapa="${escapeHtml(et.nome)}" title="Apagar etapa">✕</button>`}
            <button type="button" class="btn-automacao-etapa" data-criar-automacao-etapa="${et.id}" title="Criar automação de WhatsApp pra quando um pedido entrar nessa etapa">${icon('zap', 14)}</button>
          </div>
        `;
      });
      html += `<div class="coluna-add"><button type="button" id="btn-nova-etapa" aria-label="Nova etapa" title="Nova etapa">+</button></div>`;

      linhas.forEach((raia) => {
        // "Sem recurso"/"Prioridade Altíssima" são raias virtuais, sem CRUD —
        // só recurso de verdade (nem fixa nem altissima) ganha edição/remoção
        // inline, mesmo padrão de clique-pra-editar do título de etapa.
        const conteudoRaia = recursosRecolhido
          ? `<span class="raia-avatar" title="${escapeHtml(raia.nome)}">${iniciaisRecurso(raia.nome)}</span>`
          : raia.fixa || raia.altissima
            ? escapeHtml(raia.nome)
            : `<span class="nome-recurso" data-editar-recurso="${raia.id}">${escapeHtml(raia.nome)}</span>
               <button type="button" class="btn-remover-recurso" data-apagar-recurso="${raia.id}" data-nome-recurso="${escapeHtml(raia.nome)}" title="Apagar recurso">✕</button>`;
        html += `<div class="raia-label${raia.altissima ? ' raia-altissima' : ''}">${conteudoRaia}</div>`;
        etapas.forEach((et) => {
          const cartoes = pedidosDe(raia.id, et.id);
          html += `
            <div class="celula${raia.altissima ? ' celula-altissima' : ''}${et.fixa ? ' coluna-fixa' : ''}" data-raia="${raia.id || ''}" data-etapa="${et.id}" data-tipo-etapa="${et.tipo}">
              ${cartoesCelulaHtml(cartoes, raia.id, et.id)}
            </div>
          `;
        });
        html += '<div></div>';
      });

      grid.innerHTML = html;
      ligarEventosGrid();
    }

    function fecharMenusPedidoAbertos() {
      document.querySelectorAll('.cartao-pedido .menu-acoes').forEach((m) => { m.hidden = true; });
    }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.cartao-pedido .menu-acoes-wrap')) fecharMenusPedidoAbertos();
    });

    function ligarEventosGrid() {
      document.querySelectorAll('[data-expandir-celula]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const chave = btn.dataset.expandirCelula;
          if (celulasExpandidas.has(chave)) celulasExpandidas.delete(chave); else celulasExpandidas.add(chave);
          renderizar();
        });
      });
      document.querySelectorAll('.cartao-pedido').forEach((cartao) => {
        cartao.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', cartao.dataset.pedido);
        });
        cartao.addEventListener('click', (e) => {
          if (e.target.closest('.menu-acoes-wrap')) return;
          abrirDetalhe(cartao.dataset.pedido);
        });
      });

      document.querySelectorAll('[data-abrir-menu-pedido]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const menu = document.querySelector(`[data-menu-pedido="${btn.dataset.abrirMenuPedido}"]`);
          const jaAberto = !menu.hidden;
          fecharMenusPedidoAbertos();
          menu.hidden = jaAberto;
        });
      });
      document.querySelectorAll('[data-editar-pedido-quadro]').forEach((btn) => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); fecharMenusPedidoAbertos(); abrirDetalhe(btn.dataset.editarPedidoQuadro); });
      });
      document.querySelectorAll('[data-vincular-cliente]').forEach((btn) => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); fecharMenusPedidoAbertos(); abrirModalVincularCliente(btn.dataset.vincularCliente); });
      });
      document.querySelectorAll('[data-confirmar-pagamento-quadro]').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          fecharMenusPedidoAbertos();
          await apiFetch(`/crm/api/pedidos/${btn.dataset.confirmarPagamentoQuadro}/pagamento`, {
            method: 'PATCH',
            body: JSON.stringify({ status_pagamento: 'pago' }),
          });
          carregar();
        });
      });
      document.querySelectorAll('[data-confirmar-frete-quadro]').forEach((btn) => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); fecharMenusPedidoAbertos(); abrirModalConfirmarFrete(btn.dataset.confirmarFreteQuadro); });
      });
      document.querySelectorAll('[data-remover-pedido-quadro]').forEach((btn) => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); fecharMenusPedidoAbertos(); confirmarRemoverPedido(btn.dataset.removerPedidoQuadro); });
      });

      document.querySelectorAll('.celula').forEach((celula) => {
        celula.addEventListener('dragover', (e) => {
          if (!e.dataTransfer.types.includes('text/plain')) return;
          e.preventDefault();
          celula.classList.add('arrastando-sobre');
        });
        celula.addEventListener('dragleave', () => celula.classList.remove('arrastando-sobre'));
        celula.addEventListener('drop', async (e) => {
          if (!e.dataTransfer.types.includes('text/plain')) return;
          e.preventDefault();
          celula.classList.remove('arrastando-sobre');
          const pedidoId = e.dataTransfer.getData('text/plain');
          await moverPedido(pedidoId, celula.dataset.etapa, celula.dataset.raia || null, celula.dataset.tipoEtapa);
        });
      });

      document.querySelectorAll('[data-etapa-header]').forEach((header) => {
        header.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData(TIPO_ARRASTO_COLUNA, header.dataset.etapaHeader);
          header.classList.add('arrastando-coluna');
        });
        header.addEventListener('dragend', () => header.classList.remove('arrastando-coluna'));
        header.addEventListener('dragover', (e) => {
          if (!e.dataTransfer.types.includes(TIPO_ARRASTO_COLUNA)) return;
          if (header.dataset.fixa === 'true') return; // "A fazer" nunca recebe: sempre a 1ª coluna
          e.preventDefault();
          header.classList.add('recebendo-coluna');
        });
        header.addEventListener('dragleave', () => header.classList.remove('recebendo-coluna'));
        header.addEventListener('drop', async (e) => {
          if (!e.dataTransfer.types.includes(TIPO_ARRASTO_COLUNA)) return;
          if (header.dataset.fixa === 'true') return;
          e.preventDefault();
          header.classList.remove('recebendo-coluna');
          const idArrastado = e.dataTransfer.getData(TIPO_ARRASTO_COLUNA);
          const idAlvo = header.dataset.etapaHeader;
          if (!idArrastado || idArrastado === idAlvo) return;
          const ids = etapas.map((et) => et.id);
          const doIndice = ids.indexOf(idArrastado);
          const paraIndice = ids.indexOf(idAlvo);
          if (doIndice === -1 || paraIndice === -1) return;
          ids.splice(doIndice, 1);
          ids.splice(paraIndice, 0, idArrastado);
          await apiFetch('/crm/api/etapas/reordenar', { method: 'PATCH', body: JSON.stringify({ ids }) });
          carregar();
        });
      });

      document.querySelectorAll('[data-editar-etapa]').forEach((span) => {
        span.addEventListener('click', (e) => {
          e.stopPropagation();
          const atual = span.textContent;
          const input = document.createElement('input');
          input.className = 'editar-nome';
          input.value = atual;
          span.replaceWith(input);
          input.focus();
          input.select();
          const salvar = async () => {
            const novo = input.value.trim();
            if (novo && novo !== atual) {
              await apiFetch(`/crm/api/etapas/${span.dataset.editarEtapa}`, { method: 'PATCH', body: JSON.stringify({ nome: novo }) });
              await carregar();
            } else {
              input.replaceWith(span);
            }
          };
          input.addEventListener('blur', salvar);
          input.addEventListener('keydown', (e2) => { if (e2.key === 'Enter') input.blur(); });
        });
      });

      const btnNovoRecurso = document.getElementById('btn-novo-recurso');
      if (btnNovoRecurso) btnNovoRecurso.addEventListener('click', abrirModalNovoRecurso);

      document.getElementById('btn-recolher-recursos').addEventListener('click', () => {
        recursosRecolhido = !recursosRecolhido;
        localStorage.setItem('crm_quadro_recursos_recolhido', recursosRecolhido ? '1' : '0');
        renderizar();
      });

      document.querySelectorAll('[data-apagar-etapa]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          confirmarApagarEtapa(btn.dataset.apagarEtapa, btn.dataset.nomeEtapa);
        });
      });

      // Renomear/apagar recurso direto no rótulo da raia — mesmo padrão de
      // clique-pra-editar do título de etapa acima.
      document.querySelectorAll('[data-editar-recurso]').forEach((span) => {
        span.addEventListener('click', (e) => {
          e.stopPropagation();
          const atual = span.textContent;
          const input = document.createElement('input');
          input.className = 'editar-nome';
          input.value = atual;
          span.replaceWith(input);
          input.focus();
          input.select();
          const salvar = async () => {
            const novo = input.value.trim();
            if (novo && novo !== atual) {
              await apiFetch(`/crm/api/recursos/${span.dataset.editarRecurso}`, { method: 'PATCH', body: JSON.stringify({ nome: novo }) });
              await carregar();
            } else {
              input.replaceWith(span);
            }
          };
          input.addEventListener('blur', salvar);
          input.addEventListener('keydown', (e2) => { if (e2.key === 'Enter') input.blur(); });
        });
      });

      document.querySelectorAll('[data-apagar-recurso]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          confirmarApagarRecurso(btn.dataset.apagarRecurso, btn.dataset.nomeRecurso);
        });
      });

      document.querySelectorAll('[data-marcar-pronto]').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          await apiFetch(`/crm/api/etapas/${btn.dataset.marcarPronto}`, {
            method: 'PATCH',
            body: JSON.stringify({ eh_pronto: btn.dataset.valorPronto === 'true' }),
          });
          carregar();
        });
      });

      document.querySelectorAll('[data-criar-automacao-etapa]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          window.location.href = `/crm/automacoes.html?gatilho=mudanca_etapa&etapa_id=${btn.dataset.criarAutomacaoEtapa}`;
        });
      });

      // "+ Nova etapa" cria direto com um nome padrão (pedido do Bruno: sem
      // formulário/prompt no meio do caminho) — o título já é editável com um
      // clique (data-editar-etapa, mesmo listener acima), então o usuário só
      // renomeia depois de ver a coluna criada.
      const btnNova = document.getElementById('btn-nova-etapa');
      if (btnNova) {
        btnNova.addEventListener('click', async () => {
          btnNova.disabled = true;
          await apiFetch('/crm/api/etapas', { method: 'POST', body: JSON.stringify({ nome: 'NOVA ETAPA' }) });
          await carregar();
        });
      }
    }

    function confirmarApagarEtapa(id, nome) {
      const overlay = abrirModal('<h3>Apagar etapa?</h3>', `
        <p class="modal-texto">Essa ação não pode ser desfeita. Se ainda houver pedidos em "${escapeHtml(nome)}", mova-os antes de apagar.</p>
        <div class="modal-erro" id="apagar-etapa-erro"></div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="cancelar-apagar-etapa">Cancelar</button>
          <button type="button" class="btn-perigo" id="confirmar-apagar-etapa">Apagar etapa</button>
        </div>
      `);
      document.getElementById('cancelar-apagar-etapa').addEventListener('click', fecharModal);
      document.getElementById('confirmar-apagar-etapa').addEventListener('click', async () => {
        const res = await apiFetch(`/crm/api/etapas/${id}`, { method: 'DELETE' });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));

    // pedirMotivoPerda virou compartilhada em shell.js (2026-10-03 — junto
    // com pedirMotivoCancelamento, também usada pelo kebab do Painel Hoje).

    async function moverPedido(pedidoId, etapaId, raiaId, tipoEtapa) {
      const pedido = pedidos.find((p) => p.id === pedidoId);
      if (!pedido) return;
      const etapaMudou = pedido.etapa_id !== etapaId;
      // Raia "Prioridade Altíssima" é virtual (não é um recurso de verdade)
      // — soltar o card ali seta a prioridade em vez do recurso; soltar de
      // volta numa raia normal limpa a prioridade e atribui o recurso.
      const indoParaAltissima = raiaId === RAIA_ALTISSIMA;
      const recursoAlvo = indoParaAltissima ? pedido.recurso_id || null : raiaId || null;
      const recursoMudou = !indoParaAltissima && (pedido.recurso_id || null) !== recursoAlvo;
      const prioridadeMudou = indoParaAltissima !== (pedido.prioridade === 'altissima');
      if (!etapaMudou && !recursoMudou && !prioridadeMudou) return;

      if (etapaMudou) {
        let motivoPerda;
        if (tipoEtapa === 'perdida') {
          motivoPerda = await pedirMotivoPerda();
          if (!motivoPerda) return;
        }
        const res = await apiFetch(`/crm/api/pedidos/${pedidoId}/etapa`, {
          method: 'PATCH',
          body: JSON.stringify({ etapa_id: etapaId, motivo_perda: motivoPerda }),
        });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          avisar('Erro', dados.error || 'Falha ao mover pedido de etapa');
          return;
        }
      }
      if (recursoMudou) {
        const res = await apiFetch(`/crm/api/pedidos/${pedidoId}/recurso`, {
          method: 'PATCH',
          body: JSON.stringify({ recurso_id: recursoAlvo }),
        });
        if (!res.ok) { avisar('Erro', 'Falha ao atribuir recurso'); return; }
      }
      if (prioridadeMudou) {
        const res = await apiFetch(`/crm/api/pedidos/${pedidoId}/prioridade`, {
          method: 'PATCH',
          body: JSON.stringify({ prioridade: indoParaAltissima ? 'altissima' : null }),
        });
        if (!res.ok) { avisar('Erro', 'Falha ao atualizar prioridade'); return; }
      }
      await carregar();
    }

    // --- Novo recurso (raia do quadro — ex.: impressora) ----------------------
    // Criação de pedido saiu do Quadro (US do Bruno) — continua em Pedidos.
    // A gestão de recursos (antes só num modal em Pedidos) migrou pra cá:
    // criar aqui, renomear/apagar direto no rótulo da raia (ver
    // ligarEventosRaias). O botão em si vive dentro do cabeçalho da coluna
    // fixa "A fazer" (pedido do Bruno: "ao lado da etapa A fazer") — refeito
    // a cada renderizar(), por isso o listener é ligado de novo em
    // ligarEventosGrid() (função abaixo), não uma vez só no load.
    function abrirModalNovoRecurso() {
      const overlay = abrirModal('<h3>Novo recurso</h3>', `
        <p class="modal-texto">São as raias do Quadro — ex.: cada impressora 3D, forno, posto de trabalho.</p>
        <label for="r-nome">Nome</label>
        <input id="r-nome" placeholder="ex.: Impressora 2" autofocus>
        <div class="modal-erro" id="r-erro"></div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="btn-cancelar-recurso">Cancelar</button>
          <button type="button" id="btn-salvar-recurso">Criar</button>
        </div>
      `);
      document.getElementById('btn-cancelar-recurso').addEventListener('click', fecharModal);
      const salvar = async () => {
        const nome = document.getElementById('r-nome').value.trim();
        if (!nome) { document.getElementById('r-erro').textContent = 'Nome é obrigatório'; return; }
        await apiFetch('/crm/api/recursos', { method: 'POST', body: JSON.stringify({ nome }) });
        fecharModal();
        carregar();
      };
      document.getElementById('btn-salvar-recurso').addEventListener('click', salvar);
      document.getElementById('r-nome').addEventListener('keydown', (e) => { if (e.key === 'Enter') salvar(); });
    }

    function confirmarApagarRecurso(id, nome) {
      const overlay = abrirModal('<h3>Apagar recurso?</h3>', `
        <p class="modal-texto">Pedidos em "${escapeHtml(nome)}" voltam pra raia "Sem recurso" — nenhum é apagado.</p>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="cancelar-apagar-recurso">Cancelar</button>
          <button type="button" class="btn-perigo" id="confirmar-apagar-recurso">Apagar recurso</button>
        </div>
      `);
      document.getElementById('cancelar-apagar-recurso').addEventListener('click', fecharModal);
      document.getElementById('confirmar-apagar-recurso').addEventListener('click', async () => {
        await apiFetch(`/crm/api/recursos/${id}`, { method: 'DELETE' });
        fecharModal();
        carregar();
      });
    }

    // --- Detalhe do pedido -----------------------------------------------------
    // US20: aviso de cartão de recompra — só pra canal próprio. Marketplace
    // (Shopee/TikTok Shop/Mercado Livre) proíbe material de outro
    // produto/serviço ou link externo dentro do pacote (seção 9 do doc);
    // regras do TikTok Shop ainda não confirmadas (DECISOES-PENDENTES #6),
    // tratado com a mesma cautela da Shopee por ora.
    const ORIGENS_MARKETPLACE = ['shopee', 'tiktok', 'mercado livre', 'mercadolivre', ' ml'];
    function ehOrigemPropria(origem) {
      const o = ` ${(origem || '').toLowerCase()}`;
      return !ORIGENS_MARKETPLACE.some((m) => o.includes(m));
    }

    function abrirDetalhe(pedidoId) {
      const p = pedidos.find((x) => x.id === pedidoId);
      if (!p) return;
      const opcoesRecurso = recursos.map((r) => `<option value="${r.id}" ${r.id === p.recurso_id ? 'selected' : ''}>${escapeHtml(r.nome)}</option>`).join('');
      const overlay = abrirModal(`<h3>${escapeHtml(p.cliente_nome)}</h3>`, `
        <p class="modal-texto">${escapeHtml(p.origem)}${p.tipo_entrega ? ' · ' + escapeHtml(p.tipo_entrega) : ''}${Number(p.quantidade_itens) > 0 ? ` · ${Number(p.quantidade_itens)} item(ns)` : ''}</p>

        ${ehOrigemPropria(p.origem) ? `
        <div class="banner-assinatura" style="margin-top:12px">
          <span>📦 Pedido de canal próprio — não esqueça o cartão de recompra no kit.</span>
        </div>` : ''}

        <div class="grid2">
          <div><label for="d-cliente-nome">Nome do cliente</label><input id="d-cliente-nome" value="${escapeHtml(p.cliente_nome || '')}"></div>
          <div><label for="d-cliente-telefone">Telefone</label><input id="d-cliente-telefone" value="${escapeHtml(p.cliente_telefone || '')}"></div>
        </div>

        <div class="grid2">
          <div><label for="d-etapa">Etapa</label>
            <select id="d-etapa">
              ${etapas.map((et) => `<option value="${et.id}" ${et.id === p.etapa_id ? 'selected' : ''}>${escapeHtml(et.nome)}</option>`).join('')}
            </select>
          </div>
          <div><label for="d-recurso">Recurso</label>
            <select id="d-recurso"><option value="">Sem recurso</option>${opcoesRecurso}</select>
          </div>
        </div>

        <div class="grid2">
          <div><label for="d-prioridade">Prioridade</label>
            <select id="d-prioridade">
              <option value="">Nenhuma</option>
              <option value="altissima" ${p.prioridade === 'altissima' ? 'selected' : ''}>Altíssima</option>
              <option value="alta" ${p.prioridade === 'alta' ? 'selected' : ''}>Alta</option>
              <option value="media" ${p.prioridade === 'media' ? 'selected' : ''}>Média</option>
              <option value="baixa" ${p.prioridade === 'baixa' ? 'selected' : ''}>Baixa</option>
            </select>
          </div>
        </div>

        <div class="grid2">
          <div><label for="d-status">Pagamento</label>
            <select id="d-status">
              <option value="pendente" ${p.status_pagamento === 'pendente' ? 'selected' : ''}>Pendente</option>
              <option value="parcial" ${p.status_pagamento === 'parcial' ? 'selected' : ''}>Parcial</option>
              <option value="pago" ${p.status_pagamento === 'pago' ? 'selected' : ''}>Pago</option>
            </select>
          </div>
          <div><label for="d-recebido">Valor recebido</label><input id="d-recebido" inputmode="decimal"></div>
        </div>
        <p class="modal-texto">Valor total: ${formatarMoeda(p.valor_total)}</p>

        <div class="modal-erro" id="d-erro"></div>
        <div class="modal-acoes">
          ${p.cliente_telefone ? `<a class="btn btn-secundario" style="color:#25D366" href="${linkWhatsapp(p.cliente_telefone)}" target="_blank" rel="noopener">${icon('message-circle', 16)} WhatsApp</a>` : ''}
          <button type="button" id="btn-salvar-detalhe">Salvar</button>
        </div>
      `);

      const campoRecebido = document.getElementById('d-recebido');
      campoRecebido.value = Number(p.valor_recebido || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      aplicarMascaraMoeda(campoRecebido);

      document.getElementById('btn-salvar-detalhe').addEventListener('click', async () => {
        const novoNome = document.getElementById('d-cliente-nome').value.trim();
        const novoTelefone = document.getElementById('d-cliente-telefone').value.trim();
        const novaEtapaId = document.getElementById('d-etapa').value;
        const novoRecursoId = document.getElementById('d-recurso').value || null;
        const novaPrioridade = document.getElementById('d-prioridade').value || null;
        const novoStatus = document.getElementById('d-status').value;
        const novoRecebido = valorMoedaParaNumero(campoRecebido);

        // Edita o CLIENTE vinculado, não o pedido — nome/telefone não são
        // campos de crm_pedidos. Só manda o PATCH se algo mudou de verdade.
        if (novoNome !== (p.cliente_nome || '') || novoTelefone !== (p.cliente_telefone || '')) {
          const resCliente = await apiFetch(`/crm/api/clientes/${p.cliente_id}`, {
            method: 'PATCH',
            body: JSON.stringify({ nome: novoNome, telefone: novoTelefone }),
          });
          if (!resCliente.ok) { document.getElementById('d-erro').textContent = 'Falha ao salvar nome/telefone do cliente'; return; }
        }

        if (novaEtapaId !== p.etapa_id) {
          const etapaAlvo = etapas.find((et) => et.id === novaEtapaId);
          let motivoPerda;
          if (etapaAlvo.tipo === 'perdida') {
            // Abre por cima do modal de detalhe (abrirModal fecha o atual antes
            // de abrir o novo) — os valores do formulário já foram lidos acima,
            // então perder o modal de detalhe aqui não perde dado nenhum.
            motivoPerda = await pedirMotivoPerda();
            if (!motivoPerda) return;
          }
          const resEtapa = await apiFetch(`/crm/api/pedidos/${p.id}/etapa`, {
            method: 'PATCH',
            body: JSON.stringify({ etapa_id: novaEtapaId, motivo_perda: motivoPerda }),
          });
          if (!resEtapa.ok) {
            const dados = await resEtapa.json().catch(() => ({}));
            document.getElementById('d-erro').textContent = dados.error || 'Falha ao mover etapa';
            return;
          }
        }

        if (novoRecursoId !== (p.recurso_id || null)) {
          const resRecurso = await apiFetch(`/crm/api/pedidos/${p.id}/recurso`, {
            method: 'PATCH',
            body: JSON.stringify({ recurso_id: novoRecursoId }),
          });
          if (!resRecurso.ok) { document.getElementById('d-erro').textContent = 'Falha ao atribuir recurso'; return; }
        }

        if (novaPrioridade !== (p.prioridade || null)) {
          const resPrioridade = await apiFetch(`/crm/api/pedidos/${p.id}/prioridade`, {
            method: 'PATCH',
            body: JSON.stringify({ prioridade: novaPrioridade }),
          });
          if (!resPrioridade.ok) { document.getElementById('d-erro').textContent = 'Falha ao atualizar prioridade'; return; }
        }

        const resPagamento = await apiFetch(`/crm/api/pedidos/${p.id}/pagamento`, {
          method: 'PATCH',
          body: JSON.stringify({ status_pagamento: novoStatus, valor_recebido: novoRecebido }),
        });
        if (!resPagamento.ok) { document.getElementById('d-erro').textContent = 'Falha ao salvar pagamento'; return; }

        fecharModal();
        carregar();
      });
    }

    // "Vincular a um cliente" — busca entre clientes JÁ cadastrados (reaproveita
    // GET /crm/api/clientes?busca=, mesmo endpoint da tela de Clientes) e troca
    // o cliente_id do pedido. Não cria cliente novo — é pra corrigir um
    // vínculo errado/automático (bot, importação), não cadastrar do zero.
    function abrirModalVincularCliente(pedidoId) {
      abrirModal('<h3>Vincular a um cliente</h3>', `
        <label for="busca-cliente-vincular">Buscar cliente</label>
        <input type="text" id="busca-cliente-vincular" placeholder="Nome, telefone ou CPF...">
        <div id="lista-clientes-vincular" style="margin-top:8px; max-height:280px; overflow-y:auto"></div>
        <div class="modal-erro" id="vincular-erro"></div>
      `, 'modal-card-larga');

      const campo = document.getElementById('busca-cliente-vincular');
      const lista = document.getElementById('lista-clientes-vincular');
      let temporizador = null;

      async function buscar() {
        const busca = campo.value.trim();
        if (!busca) { lista.innerHTML = '<p class="vazio">Digite pra buscar.</p>'; return; }
        const res = await apiFetch(`/crm/api/clientes?busca=${encodeURIComponent(busca)}`);
        const clientes = await res.json();
        lista.innerHTML = clientes.length
          ? clientes.map((c) => `
              <div class="linha-cliente-vincular" data-cliente-id="${c.id}">
                <div>${escapeHtml(c.nome)}</div>
                <div class="telefone">${escapeHtml(c.telefone || 'sem telefone')}</div>
              </div>
            `).join('')
          : '<p class="vazio">Nenhum cliente encontrado.</p>';
        lista.querySelectorAll('[data-cliente-id]').forEach((linha) => {
          linha.addEventListener('click', async () => {
            const res2 = await apiFetch(`/crm/api/pedidos/${pedidoId}/cliente`, {
              method: 'PATCH',
              body: JSON.stringify({ cliente_id: linha.dataset.clienteId }),
            });
            if (!res2.ok) { document.getElementById('vincular-erro').textContent = 'Falha ao vincular cliente'; return; }
            fecharModal();
            carregar();
          });
        });
      }
      campo.addEventListener('input', () => { clearTimeout(temporizador); temporizador = setTimeout(buscar, 300); });
      campo.focus();
    }

    // "Confirmar frete" — valor separado do total do pedido, de propósito
    // (pedido do Bruno): entrega por Uber/similar tem custo variável, só
    // sabido perto da entrega e às vezes pago direto ao entregador, não
    // junto com o pagamento do produto. frete_pago é um controle à parte de
    // status_pagamento (migration 023).
    function abrirModalConfirmarFrete(pedidoId) {
      const p = pedidos.find((x) => x.id === pedidoId);
      if (!p) return;
      abrirModal('<h3>Confirmar frete</h3>', `
        <p class="modal-texto">${p.frete_pago ? 'Frete já confirmado como pago. Pode ajustar o valor se mudou.' : 'Informe o valor do frete pra marcar como pago.'}</p>
        <label for="frete-valor-confirmar">Valor do frete</label>
        <input id="frete-valor-confirmar" inputmode="decimal" placeholder="0,00">
        <div class="modal-erro" id="frete-confirmar-erro"></div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="frete-confirmar-cancelar">Cancelar</button>
          <button type="button" id="frete-confirmar-salvar">Confirmar</button>
        </div>
      `);
      const campo = document.getElementById('frete-valor-confirmar');
      campo.value = p.frete ? Number(p.frete).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
      aplicarMascaraMoeda(campo);
      document.getElementById('frete-confirmar-cancelar').addEventListener('click', fecharModal);
      document.getElementById('frete-confirmar-salvar').addEventListener('click', async () => {
        const valor = valorMoedaParaNumero(campo);
        const res = await apiFetch(`/crm/api/pedidos/${pedidoId}/entrega`, {
          method: 'PATCH',
          body: JSON.stringify({ frete: valor, frete_pago: true }),
        });
        if (!res.ok) { document.getElementById('frete-confirmar-erro').textContent = 'Falha ao confirmar frete'; return; }
        fecharModal();
        carregar();
      });
    }

    // "Remover" — mesmo endpoint/semântica do kebab da tela de Pedidos
    // (POST .../cancelar): move pra etapa tipo "perdida", nunca apaga de
    // verdade (histórico/eventos continuam intactos).
    function confirmarRemoverPedido(pedidoId) {
      abrirModal('<h3>Remover pedido?</h3>', `
        <p class="modal-texto">Essa ação não pode ser desfeita. O pedido vai pra etapa de "perdido".</p>
        <label for="remover-motivo">Motivo</label>
        <textarea id="remover-motivo" placeholder="ex.: cliente desistiu, não respondeu, preço..."></textarea>
        <div class="modal-erro" id="remover-erro"></div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="remover-voltar">Voltar</button>
          <button type="button" class="btn-perigo" id="remover-confirmar">Remover pedido</button>
        </div>
      `);
      document.getElementById('remover-voltar').addEventListener('click', fecharModal);
      document.getElementById('remover-confirmar').addEventListener('click', async () => {
        const motivo = document.getElementById('remover-motivo').value.trim();
        if (!motivo) { document.getElementById('remover-erro').textContent = 'Motivo é obrigatório'; return; }
        const res = await apiFetch(`/crm/api/pedidos/${pedidoId}/cancelar`, { method: 'POST', body: JSON.stringify({ motivo }) });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('remover-erro').textContent = dados.error || 'Falha ao remover pedido';
          return;
        }
        fecharModal();
        carregar();
      });
    }

    carregar();
  </script>
</body>
</html>
