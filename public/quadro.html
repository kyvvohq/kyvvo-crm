<style>
  .painel-main { overflow-x:hidden; }
  .quadro-scroll { overflow-x:auto; padding-bottom:12px; }
  .quadro-grid { display:grid; grid-auto-rows:min-content; gap:10px; align-items:start; }

  .raia-label { position:sticky; left:0; background:var(--bg); padding:10px 8px; font-weight:700; font-size:13px;
    display:flex; align-items:center; justify-content:space-between; gap:6px; z-index:3; color:var(--text); }
  .raia-label .btn-remover-recurso { opacity:0; }
  .raia-label:hover .btn-remover-recurso { opacity:1; }

  .coluna-header { position:relative; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 12px;
    display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; min-width:220px; color:var(--text); cursor:grab; }
  .coluna-header.arrastando-coluna { opacity:.4; }
  .coluna-header.recebendo-coluna { border-color:var(--accent); }
  /* Primeira coluna ("A fazer") fixa à esquerda — pedido do Bruno: nunca sai
     do lugar no drag-and-drop de colunas, todo pedido novo entra nela (ver
     migration 013_etapas_fixa.sql). left:170px = largura de .raia-label,
     as duas ficam "coladas" formando a área congelada da rolagem horizontal. */
  .coluna-header.coluna-fixa,
  .celula.coluna-fixa { position:sticky; left:170px; z-index:2; }
  .coluna-header.coluna-fixa { cursor:default; }
  /* Raio de automação (⚡) — antes ficava dentro do cabeçalho, junto do
     título; agora fica na borda entre uma coluna e a próxima (pedido do
     Bruno: "entre os títulos de cada coluna"), roxo pra se destacar dos
     outros ícones de ação do cabeçalho. */
  /* Escopado com .coluna-header pra vencer .coluna-header button (que tem a
     mesma especificidade em classes + 1 elemento a mais — sem isso a cor
     roxa e o tamanho circular eram sobrescritos pelo estilo genérico dos
     outros botões do cabeçalho). */
  .coluna-header .btn-automacao-etapa { position:absolute; right:-14px; top:50%; transform:translateY(-50%); z-index:5;
    width:26px; height:26px; display:flex; align-items:center; justify-content:center; padding:0;
    background:var(--card); border:1px solid var(--border-strong); border-radius:50%; color:#7c3aed; font-size:14px; }
  .coluna-header .btn-automacao-etapa:hover { background:var(--surface-muted); color:#7c3aed; }
  .coluna-header.tipo-ganha .nome-etapa { color:var(--success); }
  .coluna-header.tipo-perdida .nome-etapa { color:var(--danger); }
  .coluna-header .nome-etapa { flex:1; cursor:text; }
  .coluna-header .contagem-coluna { font-size:11px; font-weight:600; color:var(--muted); background:var(--surface-muted);
    border-radius:var(--radius-full); padding:2px 8px; }
  .coluna-header input.editar-nome { width:100%; background:transparent; border:1px solid var(--accent); border-radius:6px;
    padding:2px 6px; font-size:13px; color:var(--text); }
  .coluna-header button { background:transparent; color:var(--muted); width:auto; height:auto; margin:0; padding:2px 6px;
    font-size:12px; border-radius:6px; }
  .coluna-header button:hover { background:var(--surface-muted); color:var(--danger); }
  .coluna-header .btn-pronto { display:flex; }
  .coluna-header .btn-pronto:hover { color:var(--accent); }
  .coluna-header .btn-pronto.ativo { color:var(--accent-strong); }

  .coluna-add { display:flex; align-items:center; min-width:180px; }
  .coluna-add input { font-size:13px; height:38px; padding:0 10px; }

  .celula { background:var(--bg); border:1px dashed var(--border-strong); border-radius:var(--radius-md); padding:8px;
    min-width:220px; min-height:60px; display:flex; flex-direction:column; gap:6px; }
  .celula.arrastando-sobre { border-color:var(--accent); background:var(--accent-tint); }
  .celula-vazia { color:var(--muted); font-size:11px; padding:10px 4px; text-align:center; }

  .cartao-pedido { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 12px; cursor:grab; font-size:12.5px; }
  .cartao-pedido:active { cursor:grabbing; }
  .cartao-pedido .nome { font-weight:700; color:var(--text); margin-bottom:2px; }
  .cartao-pedido .linha { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .cartao-pedido .valor { font-weight:600; color:var(--text-secondary); }
  .cartao-pedido .dias-parado { color:var(--danger); font-weight:600; }
  .badge-prioridade-altissima { background:color-mix(in srgb, var(--danger) 25%, transparent); color:var(--danger); }

  /* Raia especial "Prioridade Altíssima" — só aparece quando existe pelo
     menos 1 pedido nessa prioridade (ver raias() no script). */
  .raia-label.raia-altissima { background:color-mix(in srgb, var(--danger) 40%, var(--bg)); color:var(--text); border-radius:var(--radius-md); }
  .celula.celula-altissima { background:color-mix(in srgb, var(--danger) 40%, var(--bg)); border-style:solid; border-color:var(--danger); }

  .editar-nome { width:100%; background:transparent; border:1px solid var(--accent); border-radius:6px; padding:2px 6px;
    font-size:13px; color:var(--text); }
  .linha-recurso { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--border); font-size:13.5px; }
  .linha-recurso:first-child { border-top:none; }
  .linha-recurso .nome-recurso { cursor:text; flex:1; }
  .linha-recurso .btn-remover-recurso { height:28px; padding:0 10px; font-size:12px; }
</style>
</head>

  <script>
    let etapas = [];
    let recursos = [];
    let pedidos = [];
    let produtos = [];
    const TIPO_ARRASTO_COLUNA = 'application/x-etapa-id';

    async function carregar() {
      const [resEtapas, resRecursos, resPedidos, resProdutos] = await Promise.all([
        apiFetch('/crm/api/etapas'),
        apiFetch('/crm/api/recursos'),
        apiFetch('/crm/api/pedidos'),
        apiFetch('/crm/api/produtos'),
      ]);
      etapas = await resEtapas.json();
      recursos = await resRecursos.json();
      pedidos = await resPedidos.json();
      produtos = await resProdutos.json();
      renderizar();
    }

    // Raia especial "Prioridade Altíssima" (pedido do Bruno, 2026-09-25):
    // um pedido com prioridade altíssima sai da raia de recurso normal e
    // fica só aqui — nunca aparece duplicado nas duas. A raia some por
    // completo quando não há nenhum pedido nessa prioridade.
    const RAIA_ALTISSIMA = '__altissima__';

    function raias() {
      // Raia fixa "Sem recurso" (recurso_id null) sempre primeiro — pedido
      // nunca fica "perdido" visualmente só por não ter recurso atribuído.
      const normais = [{ id: null, nome: 'Sem recurso', fixa: true }, ...recursos];
      const temAltissima = pedidos.some((p) => p.prioridade === 'altissima');
      return temAltissima ? [{ id: RAIA_ALTISSIMA, nome: 'Prioridade Altíssima', altissima: true }, ...normais] : normais;
    }

    function pedidosDe(raiaId, etapaId) {
      if (raiaId === RAIA_ALTISSIMA) return pedidos.filter((p) => p.prioridade === 'altissima' && p.etapa_id === etapaId);
      return pedidos.filter((p) => (p.recurso_id || null) === raiaId && p.etapa_id === etapaId && p.prioridade !== 'altissima');
    }

    const BADGE_PAGAMENTO = { pendente: 'perigo', parcial: 'aviso', pago: 'sucesso' };
    const ROTULO_PRIORIDADE = { altissima: 'Altíssima', alta: 'Alta', media: 'Média', baixa: 'Baixa' };

    function cartaoHtml(p) {
      // Usa o prazo real configurado na etapa (US19) — não um limiar fixo.
      // Etapa sem prazo configurado nunca alerta.
      const etapaDoCartao = etapas.find((et) => et.id === p.etapa_id);
      const prazo = etapaDoCartao ? etapaDoCartao.prazo_alerta_dias : null;
      const alerta = prazo != null && p.dias_na_etapa >= prazo;
      const numQtd = Number(p.quantidade_itens);
      const qtd = numQtd > 1 ? `${Number.isInteger(numQtd) ? numQtd : numQtd.toLocaleString('pt-BR')}× ` : '';
      return `
        <div class="cartao-pedido" draggable="true" data-pedido="${p.id}">
          <div class="nome">${qtd}${escapeHtml(p.cliente_nome)}</div>
          ${p.prioridade ? `<div class="linha"><span class="badge${p.prioridade === 'altissima' ? ' badge-prioridade-altissima' : ''}">${ROTULO_PRIORIDADE[p.prioridade]}</span></div>` : ''}
          <div class="linha">
            <span class="badge ${BADGE_PAGAMENTO[p.status_pagamento]}">${p.status_pagamento}</span>
            <span class="valor">${formatarMoeda(p.valor_total)}</span>
          </div>
          <div class="linha">
            <span style="color:var(--muted)">${escapeHtml(p.origem)}</span>
            <span class="${alerta ? 'dias-parado' : ''}" style="font-size:11px">${p.dias_na_etapa}d</span>
          </div>
        </div>
      `;
    }

    function renderizar() {
      const linhas = raias();
      const grid = document.getElementById('quadro-grid');
      grid.style.gridTemplateColumns = `170px repeat(${etapas.length}, minmax(230px, 1fr)) 190px`;

      let html = '<div></div>';
      etapas.forEach((et) => {
        html += `
          <div class="coluna-header tipo-${et.tipo}${et.fixa ? ' coluna-fixa' : ''}" draggable="${et.fixa ? 'false' : 'true'}" data-etapa-header="${et.id}" data-fixa="${!!et.fixa}">
            <span class="nome-etapa" data-editar-etapa="${et.id}">${escapeHtml(et.nome)}</span>
            <span class="contagem-coluna">${pedidos.filter((p) => p.etapa_id === et.id).length}</span>
            <button type="button" class="btn-pronto${et.eh_pronto ? ' ativo' : ''}" data-marcar-pronto="${et.id}" data-valor-pronto="${!et.eh_pronto}" title="${et.eh_pronto ? 'Esta é a etapa de pronto pra envio/retirada (clique pra desmarcar)' : 'Marcar como etapa de pronto pra envio/retirada'}">${icon('package-check', 14)}</button>
            <button type="button" data-apagar-etapa="${et.id}" data-nome-etapa="${escapeHtml(et.nome)}" title="Apagar etapa">✕</button>
            <button type="button" class="btn-automacao-etapa" data-criar-automacao-etapa="${et.id}" title="Criar automação de WhatsApp pra quando um pedido entrar nessa etapa">${icon('zap', 14)}</button>
          </div>
        `;
      });
      html += `<div class="coluna-add"><input type="text" id="input-nova-etapa" placeholder="+ Nova etapa (Enter)"></div>`;

      linhas.forEach((raia) => {
        // "Sem recurso"/"Prioridade Altíssima" são raias virtuais, sem CRUD —
        // só recurso de verdade (nem fixa nem altissima) ganha edição/remoção
        // inline, mesmo padrão de clique-pra-editar do título de etapa.
        const conteudoRaia = raia.fixa || raia.altissima
          ? escapeHtml(raia.nome)
          : `<span class="nome-recurso" data-editar-recurso="${raia.id}">${escapeHtml(raia.nome)}</span>
             <button type="button" class="btn-remover-recurso" data-apagar-recurso="${raia.id}" data-nome-recurso="${escapeHtml(raia.nome)}" title="Apagar recurso">✕</button>`;
        html += `<div class="raia-label${raia.altissima ? ' raia-altissima' : ''}">${conteudoRaia}</div>`;
        etapas.forEach((et) => {
          const cartoes = pedidosDe(raia.id, et.id);
          html += `
            <div class="celula${raia.altissima ? ' celula-altissima' : ''}${et.fixa ? ' coluna-fixa' : ''}" data-raia="${raia.id || ''}" data-etapa="${et.id}" data-tipo-etapa="${et.tipo}">
              ${cartoes.map(cartaoHtml).join('') || '<div class="celula-vazia">—</div>'}
            </div>
          `;
        });
        html += '<div></div>';
      });

      grid.innerHTML = html;
      ligarEventosGrid();
    }

    function ligarEventosGrid() {
      document.querySelectorAll('.cartao-pedido').forEach((cartao) => {
        cartao.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', cartao.dataset.pedido);
        });
        cartao.addEventListener('click', () => abrirDetalhe(cartao.dataset.pedido));
      });

      document.querySelectorAll('.celula').forEach((celula) => {
        celula.addEventListener('dragover', (e) => {
          if (!e.dataTransfer.types.includes('text/plain')) return;
          e.preventDefault();
          celula.classList.add('arrastando-sobre');
        });
        celula.addEventListener('dragleave', () => celula.classList.remove('arrastando-sobre'));
        celula.addEventListener('drop', async (e) => {
          if (!e.dataTransfer.types.includes('text/plain')) return;
          e.preventDefault();
          celula.classList.remove('arrastando-sobre');
          const pedidoId = e.dataTransfer.getData('text/plain');
          await moverPedido(pedidoId, celula.dataset.etapa, celula.dataset.raia || null, celula.dataset.tipoEtapa);
        });
      });

      document.querySelectorAll('[data-etapa-header]').forEach((header) => {
        header.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData(TIPO_ARRASTO_COLUNA, header.dataset.etapaHeader);
          header.classList.add('arrastando-coluna');
        });
        header.addEventListener('dragend', () => header.classList.remove('arrastando-coluna'));
        header.addEventListener('dragover', (e) => {
          if (!e.dataTransfer.types.includes(TIPO_ARRASTO_COLUNA)) return;
          if (header.dataset.fixa === 'true') return; // "A fazer" nunca recebe: sempre a 1ª coluna
          e.preventDefault();
          header.classList.add('recebendo-coluna');
        });
        header.addEventListener('dragleave', () => header.classList.remove('recebendo-coluna'));
        header.addEventListener('drop', async (e) => {
          if (!e.dataTransfer.types.includes(TIPO_ARRASTO_COLUNA)) return;
          if (header.dataset.fixa === 'true') return;
          e.preventDefault();
          header.classList.remove('recebendo-coluna');
          const idArrastado = e.dataTransfer.getData(TIPO_ARRASTO_COLUNA);
          const idAlvo = header.dataset.etapaHeader;
          if (!idArrastado || idArrastado === idAlvo) return;
          const ids = etapas.map((et) => et.id);
          const doIndice = ids.indexOf(idArrastado);
          const paraIndice = ids.indexOf(idAlvo);
          if (doIndice === -1 || paraIndice === -1) return;
          ids.splice(doIndice, 1);
          ids.splice(paraIndice, 0, idArrastado);
          await apiFetch('/crm/api/etapas/reordenar', { method: 'PATCH', body: JSON.stringify({ ids }) });
          carregar();
        });
      });

      document.querySelectorAll('[data-editar-etapa]').forEach((span) => {
        span.addEventListener('click', (e) => {
          e.stopPropagation();
          const atual = span.textContent;
          const input = document.createElement('input');
          input.className = 'editar-nome';
          input.value = atual;
          span.replaceWith(input);
          input.focus();
          input.select();
          const salvar = async () => {
            const novo = input.value.trim();
            if (novo && novo !== atual) {
              await apiFetch(`/crm/api/etapas/${span.dataset.editarEtapa}`, { method: 'PATCH', body: JSON.stringify({ nome: novo }) });
              await carregar();
            } else {
              input.replaceWith(span);
            }
          };
          input.addEventListener('blur', salvar);
          input.addEventListener('keydown', (e2) => { if (e2.key === 'Enter') input.blur(); });
        });
      });

      document.querySelectorAll('[data-apagar-etapa]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          confirmarApagarEtapa(btn.dataset.apagarEtapa, btn.dataset.nomeEtapa);
        });
      });

      // Renomear/apagar recurso direto no rótulo da raia — mesmo padrão de
      // clique-pra-editar do título de etapa acima.
      document.querySelectorAll('[data-editar-recurso]').forEach((span) => {
        span.addEventListener('click', (e) => {
          e.stopPropagation();
          const atual = span.textContent;
          const input = document.createElement('input');
          input.className = 'editar-nome';
          input.value = atual;
          span.replaceWith(input);
          input.focus();
          input.select();
          const salvar = async () => {
            const novo = input.value.trim();
            if (novo && novo !== atual) {
              await apiFetch(`/crm/api/recursos/${span.dataset.editarRecurso}`, { method: 'PATCH', body: JSON.stringify({ nome: novo }) });
              await carregar();
            } else {
              input.replaceWith(span);
            }
          };
          input.addEventListener('blur', salvar);
          input.addEventListener('keydown', (e2) => { if (e2.key === 'Enter') input.blur(); });
        });
      });

      document.querySelectorAll('[data-apagar-recurso]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          confirmarApagarRecurso(btn.dataset.apagarRecurso, btn.dataset.nomeRecurso);
        });
      });

      document.querySelectorAll('[data-marcar-pronto]').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          await apiFetch(`/crm/api/etapas/${btn.dataset.marcarPronto}`, {
            method: 'PATCH',
            body: JSON.stringify({ eh_pronto: btn.dataset.valorPronto === 'true' }),
          });
          carregar();
        });
      });

      document.querySelectorAll('[data-criar-automacao-etapa]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          window.location.href = `/crm/automacoes.html?gatilho=mudanca_etapa&etapa_id=${btn.dataset.criarAutomacaoEtapa}`;
        });
      });

      const inputNova = document.getElementById('input-nova-etapa');
      if (inputNova) {
        inputNova.addEventListener('keydown', async (e) => {
          if (e.key !== 'Enter') return;
          const nome = inputNova.value.trim();
          if (!nome) return;
          inputNova.disabled = true;
          await apiFetch('/crm/api/etapas', { method: 'POST', body: JSON.stringify({ nome }) });
          await carregar();
        });
      }
    }

    function confirmarApagarEtapa(id, nome) {
      const overlay = abrirModal('<h3>Apagar etapa?</h3>', `
        <p class="modal-texto">Essa ação não pode ser desfeita. Se ainda houver pedidos em "${escapeHtml(nome)}", mova-os antes de apagar.</p>
        <div class="modal-erro" id="apagar-etapa-erro"></div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="cancelar-apagar-etapa">Cancelar</button>
          <button type="button" class="btn-perigo" id="confirmar-apagar-etapa">Apagar etapa</button>
        </div>
      `);
      document.getElementById('cancelar-apagar-etapa').addEventListener('click', fecharModal);
      document.getElementById('confirmar-apagar-etapa').addEventListener('click', async () => {
        const res = await apiFetch(`/crm/api/etapas/${id}`, { method: 'DELETE' });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('apagar-etapa-erro').textContent = dados.error || 'Falha ao apagar etapa';
          return;
        }
        fecharModal();
        carregar();
      });
    }

    // Modal próprio no lugar do prompt() nativo (US27) — window.prompt trava
    // automação de browser e destoa do resto da UI, que já usa abrirModal em
    // todo canto. Resolve com o texto digitado, ou null se cancelado/fechado.
    function pedirMotivoPerda() {
      return new Promise((resolve) => {
        const overlay = abrirModal('<h3>Motivo da perda</h3>', `
          <label for="motivo-perda-texto">Por que este pedido foi perdido?</label>
          <textarea id="motivo-perda-texto" placeholder="ex.: cliente desistiu, não respondeu, preço..."></textarea>
          <div class="modal-erro" id="motivo-perda-erro"></div>
          <div class="modal-acoes">
            <button type="button" class="btn-secundario" id="motivo-perda-cancelar">Cancelar</button>
            <button type="button" class="btn-perigo" id="motivo-perda-confirmar">Marcar como perdido</button>
          </div>
        `);
        let resolvido = false;
        const finalizar = (valor) => {
          if (resolvido) return;
          resolvido = true;
          resolve(valor);
        };
        document.getElementById('motivo-perda-cancelar').addEventListener('click', () => { finalizar(null); fecharModal(); });
        document.getElementById('motivo-perda-confirmar').addEventListener('click', () => {
          const texto = document.getElementById('motivo-perda-texto').value.trim();
          if (!texto) { document.getElementById('motivo-perda-erro').textContent = 'Motivo é obrigatório'; return; }
          finalizar(texto);
          fecharModal();
        });
        // Fechar pelo X, clique fora ou Esc conta como cancelar.
        overlay.querySelector('#modal-close').addEventListener('click', () => finalizar(null));
        overlay.addEventListener('click', (e) => { if (e.target === overlay) finalizar(null); });
        document.addEventListener('keydown', function escHandler(e) {
          if (e.key !== 'Escape') return;
          finalizar(null);
          document.removeEventListener('keydown', escHandler);
        });
      });
    }

    async function moverPedido(pedidoId, etapaId, raiaId, tipoEtapa) {
      const pedido = pedidos.find((p) => p.id === pedidoId);
      if (!pedido) return;
      const etapaMudou = pedido.etapa_id !== etapaId;
      // Raia "Prioridade Altíssima" é virtual (não é um recurso de verdade)
      // — soltar o card ali seta a prioridade em vez do recurso; soltar de
      // volta numa raia normal limpa a prioridade e atribui o recurso.
      const indoParaAltissima = raiaId === RAIA_ALTISSIMA;
      const recursoAlvo = indoParaAltissima ? pedido.recurso_id || null : raiaId || null;
      const recursoMudou = !indoParaAltissima && (pedido.recurso_id || null) !== recursoAlvo;
      const prioridadeMudou = indoParaAltissima !== (pedido.prioridade === 'altissima');
      if (!etapaMudou && !recursoMudou && !prioridadeMudou) return;

      if (etapaMudou) {
        let motivoPerda;
        if (tipoEtapa === 'perdida') {
          motivoPerda = await pedirMotivoPerda();
          if (!motivoPerda) return;
        }
        const res = await apiFetch(`/crm/api/pedidos/${pedidoId}/etapa`, {
          method: 'PATCH',
          body: JSON.stringify({ etapa_id: etapaId, motivo_perda: motivoPerda }),
        });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          avisar('Erro', dados.error || 'Falha ao mover pedido de etapa');
          return;
        }
      }
      if (recursoMudou) {
        const res = await apiFetch(`/crm/api/pedidos/${pedidoId}/recurso`, {
          method: 'PATCH',
          body: JSON.stringify({ recurso_id: recursoAlvo }),
        });
        if (!res.ok) { avisar('Erro', 'Falha ao atribuir recurso'); return; }
      }
      if (prioridadeMudou) {
        const res = await apiFetch(`/crm/api/pedidos/${pedidoId}/prioridade`, {
          method: 'PATCH',
          body: JSON.stringify({ prioridade: indoParaAltissima ? 'altissima' : null }),
        });
        if (!res.ok) { avisar('Erro', 'Falha ao atualizar prioridade'); return; }
      }
      await carregar();
    }

    // --- Novo recurso (raia do quadro — ex.: impressora) ----------------------
    // Criação de pedido saiu do Quadro (US do Bruno) — continua em Pedidos.
    // A gestão de recursos (antes só num modal em Pedidos) migrou pra cá:
    // criar aqui, renomear/apagar direto no rótulo da raia (ver
    // ligarEventosRaias).
    document.getElementById('btn-novo-recurso').addEventListener('click', () => {
      const overlay = abrirModal('<h3>Novo recurso</h3>', `
        <p class="modal-texto">São as raias do Quadro — ex.: cada impressora 3D, forno, posto de trabalho.</p>
        <label for="r-nome">Nome</label>
        <input id="r-nome" placeholder="ex.: Impressora 2" autofocus>
        <div class="modal-erro" id="r-erro"></div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="btn-cancelar-recurso">Cancelar</button>
          <button type="button" id="btn-salvar-recurso">Criar</button>
        </div>
      `);
      document.getElementById('btn-cancelar-recurso').addEventListener('click', fecharModal);
      const salvar = async () => {
        const nome = document.getElementById('r-nome').value.trim();
        if (!nome) { document.getElementById('r-erro').textContent = 'Nome é obrigatório'; return; }
        await apiFetch('/crm/api/recursos', { method: 'POST', body: JSON.stringify({ nome }) });
        fecharModal();
        carregar();
      };
      document.getElementById('btn-salvar-recurso').addEventListener('click', salvar);
      document.getElementById('r-nome').addEventListener('keydown', (e) => { if (e.key === 'Enter') salvar(); });
    });

    function confirmarApagarRecurso(id, nome) {
      const overlay = abrirModal('<h3>Apagar recurso?</h3>', `
        <p class="modal-texto">Pedidos em "${escapeHtml(nome)}" voltam pra raia "Sem recurso" — nenhum é apagado.</p>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="cancelar-apagar-recurso">Cancelar</button>
          <button type="button" class="btn-perigo" id="confirmar-apagar-recurso">Apagar recurso</button>
        </div>
      `);
      document.getElementById('cancelar-apagar-recurso').addEventListener('click', fecharModal);
      document.getElementById('confirmar-apagar-recurso').addEventListener('click', async () => {
        await apiFetch(`/crm/api/recursos/${id}`, { method: 'DELETE' });
        fecharModal();
        carregar();
      });
    }

    // --- Detalhe do pedido -----------------------------------------------------
    // US20: aviso de cartão de recompra — só pra canal próprio. Marketplace
    // (Shopee/TikTok Shop/Mercado Livre) proíbe material de outro
    // produto/serviço ou link externo dentro do pacote (seção 9 do doc);
    // regras do TikTok Shop ainda não confirmadas (DECISOES-PENDENTES #6),
    // tratado com a mesma cautela da Shopee por ora.
    const ORIGENS_MARKETPLACE = ['shopee', 'tiktok', 'mercado livre', 'mercadolivre', ' ml'];
    function ehOrigemPropria(origem) {
      const o = ` ${(origem || '').toLowerCase()}`;
      return !ORIGENS_MARKETPLACE.some((m) => o.includes(m));
    }

    function abrirDetalhe(pedidoId) {
      const p = pedidos.find((x) => x.id === pedidoId);
      if (!p) return;
      const opcoesRecurso = recursos.map((r) => `<option value="${r.id}" ${r.id === p.recurso_id ? 'selected' : ''}>${escapeHtml(r.nome)}</option>`).join('');
      const overlay = abrirModal(`<h3>${escapeHtml(p.cliente_nome)}</h3>`, `
        <p class="modal-texto">${escapeHtml(p.cliente_telefone || 'sem telefone')} · ${escapeHtml(p.origem)}${p.tipo_entrega ? ' · ' + escapeHtml(p.tipo_entrega) : ''}${Number(p.quantidade_itens) > 0 ? ` · ${Number(p.quantidade_itens)} item(ns)` : ''}</p>

        ${ehOrigemPropria(p.origem) ? `
        <div class="banner-assinatura" style="margin-top:12px">
          <span>📦 Pedido de canal próprio — não esqueça o cartão de recompra no kit.</span>
        </div>` : ''}

        <div class="grid2">
          <div><label for="d-etapa">Etapa</label>
            <select id="d-etapa">
              ${etapas.map((et) => `<option value="${et.id}" ${et.id === p.etapa_id ? 'selected' : ''}>${escapeHtml(et.nome)}</option>`).join('')}
            </select>
          </div>
          <div><label for="d-recurso">Recurso</label>
            <select id="d-recurso"><option value="">Sem recurso</option>${opcoesRecurso}</select>
          </div>
        </div>

        <div class="grid2">
          <div><label for="d-prioridade">Prioridade</label>
            <select id="d-prioridade">
              <option value="">Nenhuma</option>
              <option value="altissima" ${p.prioridade === 'altissima' ? 'selected' : ''}>Altíssima</option>
              <option value="alta" ${p.prioridade === 'alta' ? 'selected' : ''}>Alta</option>
              <option value="media" ${p.prioridade === 'media' ? 'selected' : ''}>Média</option>
              <option value="baixa" ${p.prioridade === 'baixa' ? 'selected' : ''}>Baixa</option>
            </select>
          </div>
        </div>

        <div class="grid2">
          <div><label for="d-status">Pagamento</label>
            <select id="d-status">
              <option value="pendente" ${p.status_pagamento === 'pendente' ? 'selected' : ''}>Pendente</option>
              <option value="parcial" ${p.status_pagamento === 'parcial' ? 'selected' : ''}>Parcial</option>
              <option value="pago" ${p.status_pagamento === 'pago' ? 'selected' : ''}>Pago</option>
            </select>
          </div>
          <div><label for="d-recebido">Valor recebido</label><input id="d-recebido" inputmode="decimal"></div>
        </div>
        <p class="modal-texto">Valor total: ${formatarMoeda(p.valor_total)}</p>

        <div class="modal-erro" id="d-erro"></div>
        <div class="modal-acoes">
          ${p.cliente_telefone ? `<a class="btn btn-secundario" style="color:#25D366" href="${linkWhatsapp(p.cliente_telefone)}" target="_blank" rel="noopener">${icon('message-circle', 16)} WhatsApp</a>` : ''}
          <button type="button" id="btn-salvar-detalhe">Salvar</button>
        </div>
      `);

      const campoRecebido = document.getElementById('d-recebido');
      campoRecebido.value = Number(p.valor_recebido || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      aplicarMascaraMoeda(campoRecebido);

      document.getElementById('btn-salvar-detalhe').addEventListener('click', async () => {
        const novaEtapaId = document.getElementById('d-etapa').value;
        const novoRecursoId = document.getElementById('d-recurso').value || null;
        const novaPrioridade = document.getElementById('d-prioridade').value || null;
        const novoStatus = document.getElementById('d-status').value;
        const novoRecebido = valorMoedaParaNumero(campoRecebido);

        if (novaEtapaId !== p.etapa_id) {
          const etapaAlvo = etapas.find((et) => et.id === novaEtapaId);
          let motivoPerda;
          if (etapaAlvo.tipo === 'perdida') {
            // Abre por cima do modal de detalhe (abrirModal fecha o atual antes
            // de abrir o novo) — os valores do formulário já foram lidos acima,
            // então perder o modal de detalhe aqui não perde dado nenhum.
            motivoPerda = await pedirMotivoPerda();
            if (!motivoPerda) return;
          }
          const resEtapa = await apiFetch(`/crm/api/pedidos/${p.id}/etapa`, {
            method: 'PATCH',
            body: JSON.stringify({ etapa_id: novaEtapaId, motivo_perda: motivoPerda }),
          });
          if (!resEtapa.ok) {
            const dados = await resEtapa.json().catch(() => ({}));
            document.getElementById('d-erro').textContent = dados.error || 'Falha ao mover etapa';
            return;
          }
        }

        if (novoRecursoId !== (p.recurso_id || null)) {
          const resRecurso = await apiFetch(`/crm/api/pedidos/${p.id}/recurso`, {
            method: 'PATCH',
            body: JSON.stringify({ recurso_id: novoRecursoId }),
          });
          if (!resRecurso.ok) { document.getElementById('d-erro').textContent = 'Falha ao atribuir recurso'; return; }
        }

        if (novaPrioridade !== (p.prioridade || null)) {
          const resPrioridade = await apiFetch(`/crm/api/pedidos/${p.id}/prioridade`, {
            method: 'PATCH',
            body: JSON.stringify({ prioridade: novaPrioridade }),
          });
          if (!resPrioridade.ok) { document.getElementById('d-erro').textContent = 'Falha ao atualizar prioridade'; return; }
        }

        const resPagamento = await apiFetch(`/crm/api/pedidos/${p.id}/pagamento`, {
          method: 'PATCH',
          body: JSON.stringify({ status_pagamento: novoStatus, valor_recebido: novoRecebido }),
        });
        if (!resPagamento.ok) { document.getElementById('d-erro').textContent = 'Falha ao salvar pagamento'; return; }

        fecharModal();
        carregar();
      });
    }

    carregar();
  </script>
</body>
</html>
