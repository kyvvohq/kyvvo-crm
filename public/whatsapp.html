     mais recente embaixo), aberto a partir da linha da tabela em vez de um
     painel sempre visível (ver abrirModalConversa()). */
  .chat-conversa { display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow-y:auto; padding:4px 2px; }
  .bolha { max-width:70%; padding:8px 12px; border-radius:12px; font-size:13.5px; white-space:pre-wrap; }
  .bolha-recebida { align-self:flex-start; background:var(--surface-muted); color:var(--text); border-bottom-left-radius:2px; }
  .bolha-enviada { align-self:flex-end; background:var(--accent-tint); color:var(--accent-strong); border-bottom-right-radius:2px; }
  .bolha-hora { font-size:10px; color:var(--muted); margin-top:3px; }
  .linha-conversa { cursor:pointer; }
</style>

    <div class="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos">
          <div class="linha-titulo"><h1>WhatsApp</h1></div>
        </div>
      </div>

      <div class="ds-abas" data-ds-abas>
        <div class="ds-abas-lista">
          <button type="button" class="ds-aba" id="aba-whatsapp-conversas" aria-controls="painel-whatsapp-conversas" aria-selected="true">Conversas</button>
        </div>
        <div class="ds-abas-painel" id="painel-whatsapp-conversas" aria-labelledby="aba-whatsapp-conversas">
          <div class="tabela-wrapper">
            <table class="tabela-tenants">
              <thead><tr><th>Conversa</th><th>WhatsApp</th><th>Última mensagem</th><th>Quando</th></tr></thead>
              <tbody id="conversas-tbody"><tr><td colspan="4">Carregando…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

  <footer data-ds-rodape data-ds-produto="CRM"></footer>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    // Mesmo modelo do Studio (Configurações > WhatsApp): lista em tabela,
    // clique na linha abre o histórico completo num modal — em vez do
    // painel de 2 colunas (lista + thread sempre visível) de antes.
    let conversas = [];
    const telefoneAbrirDireto = new URLSearchParams(window.location.search).get('telefone');

    function formatarHoraConversa(iso) {
      const d = new Date(iso);
      const hoje = new Date();
      const mesmoData = d.toDateString() === hoje.toDateString();
      return mesmoData
        ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
        : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    }

    async function carregarConversas() {
      const res = await apiFetch('/crm/api/conversas');
      conversas = await res.json();
      renderizarTabela();
      if (telefoneAbrirDireto) abrirModalConversa(telefoneAbrirDireto);
    }

    function renderizarTabela() {
      const tbody = document.getElementById('conversas-tbody');
      tbody.innerHTML = conversas.length ? conversas.map((c) => `
        <tr class="linha-conversa" data-telefone="${c.telefone_e164}">
          <td>${escapeHtml(c.cliente_nome || '—')}</td>
          <td>${escapeHtml(c.telefone_e164)}</td>
          <td>${escapeHtml(c.ultima_mensagem || '—')}</td>
          <td>${formatarHoraConversa(c.ultima_em)}</td>
        </tr>
      `).join('') : '<tr><td colspan="4">Nenhuma conversa registrada ainda.</td></tr>';

      tbody.querySelectorAll('[data-telefone]').forEach((tr) => {
        tr.addEventListener('click', () => abrirModalConversa(tr.dataset.telefone));
      });
    }

    // Popup com o histórico completo (mesma ideia do Studio: bolhas de
    // cliente/enviada, mais recente embaixo, abre já rolado pro fim).
    async function abrirModalConversa(telefone) {
      const conversa = conversas.find((c) => c.telefone_e164 === telefone);
      abrirModal(
        `<h3>${escapeHtml((conversa && conversa.cliente_nome) || telefone)}</h3>
         <p class="modal-texto">${escapeHtml(telefone)}</p>`,
        '<div class="chat-conversa"><div class="vazio">Carregando…</div></div>'
      );
      const res = await apiFetch(`/crm/api/conversas/${encodeURIComponent(telefone)}/mensagens`);
      const mensagens = await res.json();
      const chat = document.querySelector('.chat-conversa');
      if (!chat) return; // modal fechado antes da resposta chegar
      chat.innerHTML = mensagens.length ? mensagens.map((m) => `
        <div class="bolha bolha-${m.direcao}">
          ${escapeHtml(m.conteudo)}
          <div class="bolha-hora">${new Date(m.criado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</div>
        </div>
      `).join('') : '<div class="vazio">Nenhuma mensagem registrada.</div>';
      chat.scrollTop = chat.scrollHeight;
    }

    carregarConversas();
  </script>
</body>
