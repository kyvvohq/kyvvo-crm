<style>
  .conversas-shell { display:grid; grid-template-columns:280px 1fr; gap:0; height:calc(100vh - 220px); min-height:420px; }
  .conversas-lista { border-right:1px solid var(--border); overflow-y:auto; }
  .conversas-lista-item { display:block; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--border);
    padding:12px 14px; cursor:pointer; height:auto; border-radius:0; color:var(--text); }
  .conversas-lista-item:hover { background:var(--surface-hover); }
  .conversas-lista-item.ativa { background:var(--accent-tint); }
  .conversas-lista-item .nome { font-weight:700; font-size:13.5px; margin-bottom:2px; }
  .conversas-lista-item .prevista { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conversas-lista-item .hora { font-size:11px; color:var(--muted); float:right; }
  .conversas-thread { display:flex; flex-direction:column; padding:16px; overflow-y:auto; gap:8px; }
  .bolha { max-width:70%; padding:8px 12px; border-radius:12px; font-size:13.5px; white-space:pre-wrap; }
  .bolha-recebida { align-self:flex-start; background:var(--surface-muted); color:var(--text); border-bottom-left-radius:2px; }
  .bolha-enviada { align-self:flex-end; background:var(--accent-tint); color:var(--accent-strong); border-bottom-right-radius:2px; }
  .bolha-hora { font-size:10px; color:var(--muted); margin-top:3px; }
</style>
</head>

  <script src="/crm/shell.js"></script>
  <script>
    let conversas = [];
    let telefoneAtivo = new URLSearchParams(window.location.search).get('telefone');

    function formatarHoraConversa(iso) {
      const d = new Date(iso);
      const hoje = new Date();
      const mesmoData = d.toDateString() === hoje.toDateString();
      return mesmoData
        ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
        : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    }

    async function carregarConversas() {
      const res = await apiFetch('/crm/api/conversas');
      conversas = await res.json();
      renderizarLista();
      if (telefoneAtivo) {
        abrirConversa(telefoneAtivo);
      } else if (conversas.length) {
        abrirConversa(conversas[0].telefone_e164);
      }
    }

    function renderizarLista() {
      const el = document.getElementById('conversas-lista');
      el.innerHTML = conversas.length ? conversas.map((c) => `
        <button type="button" class="conversas-lista-item${c.telefone_e164 === telefoneAtivo ? ' ativa' : ''}" data-telefone="${c.telefone_e164}">
          <span class="hora">${formatarHoraConversa(c.ultima_em)}</span>
          <div class="nome">${escapeHtml(c.cliente_nome || c.telefone_e164)}</div>
          <div class="prevista">${escapeHtml(c.ultima_mensagem)}</div>
        </button>
      `).join('') : '<div class="vazio" style="padding:16px">Nenhuma conversa ainda.</div>';

      el.querySelectorAll('[data-telefone]').forEach((btn) => {
        btn.addEventListener('click', () => abrirConversa(btn.dataset.telefone));
      });
    }

    async function abrirConversa(telefone) {
      telefoneAtivo = telefone;
      renderizarLista();
      const thread = document.getElementById('conversas-thread');
      thread.innerHTML = '<div class="vazio">Carregando…</div>';
      const res = await apiFetch(`/crm/api/conversas/${encodeURIComponent(telefone)}/mensagens`);
      const mensagens = await res.json();
      thread.innerHTML = mensagens.map((m) => `
        <div class="bolha bolha-${m.direcao}">
          ${escapeHtml(m.conteudo)}
          <div class="bolha-hora">${new Date(m.criado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</div>
        </div>
      `).join('');
      thread.scrollTop = thread.scrollHeight;
    }

    carregarConversas();
  </script>
