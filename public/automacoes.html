      <ul class="ds-menu-lista">

    <div class="painel-main">
      <div class="ds-pagina-cab">
        <div class="ds-pagina-cab-texto"><h1 class="ds-pagina-cab-titulo">Automações</h1></div>
        <div class="ds-pagina-cab-acoes">
          <button type="button" class="ds-btn ds-btn-primario" id="btn-nova-automacao"><span data-icon="plus" data-size="16"></span>Nova automação</button>
        </div>
      </div>

      <div class="ds-tabela" role="table" aria-label="Automações" style="--ds-colunas: minmax(0,1.3fr) minmax(0,1.7fr) minmax(0,1.2fr) 90px 48px">
        <div class="ds-tabela-cabecalho" role="row">
          <span role="columnheader">Nome</span>
          <span role="columnheader">Gatilho</span>
          <span role="columnheader">Modelo</span>
          <span role="columnheader">Ativa</span>
          <span role="columnheader"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Ações</span></span>
        </div>
        <div id="lista-automacoes"><div class="ds-vazio"><p class="ds-vazio-texto">Carregando…</p></div></div>
      </div>
    </div>
  </div>

  <footer data-ds-rodape data-ds-produto="CRM"></footer>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    let automacoes = [];
    let etapas = [];
    let templates = [];

    const ROTULO_GATILHO = {
      mudanca_etapa: 'Pedido muda de etapa',
      pedido_criado: 'Pedido criado',
      pedido_parado: 'Pedido parado numa etapa',
      aniversario_cliente: 'Aniversário do cliente',
    };
    const GATILHOS_COM_ETAPA = ['mudanca_etapa', 'pedido_parado'];
    const GATILHOS_VALIDOS_UI = ['mudanca_etapa', 'pedido_criado', 'pedido_parado', 'aniversario_cliente'];

    async function carregar() {
      const [resAutomacoes, resEtapas] = await Promise.all([
        apiFetch('/crm/api/automacoes'),
        apiFetch('/crm/api/etapas'),
      ]);
      automacoes = await resAutomacoes.json();
      etapas = await resEtapas.json();
      renderizar();
    }

    function renderizar() {
      const el = document.getElementById('lista-automacoes');
      if (!automacoes.length) {
        el.innerHTML = '<div class="ds-vazio"><p class="ds-vazio-titulo">Nenhuma automação configurada ainda</p><p class="ds-vazio-texto">Crie a primeira para avisar seus clientes automaticamente pelo WhatsApp.</p></div>';
        return;
      }
      el.innerHTML = automacoes.map((a) => `
        <div class="ds-tabela-linha" role="row" data-id="${a.id}">
          <span role="cell"><span class="ds-tabela-primario">${escapeHtml(a.nome)}</span></span>
          <span role="cell" class="ds-tabela-mudo" data-rotulo="Gatilho">${escapeHtml(ROTULO_GATILHO[a.gatilho] || a.gatilho)}${a.etapa_nome ? ` — etapa "${escapeHtml(a.etapa_nome)}"` : ''}</span>
          <span role="cell" data-rotulo="Modelo">${a.whatsapp_template
            ? `<span class="ds-tabela-primario">${escapeHtml(a.whatsapp_template)}</span>`
            : '<span class="ds-badge ds-badge-aviso ds-badge-sm" title="Escolha um modelo aprovado pra esta automação disparar">Sem modelo</span>'}</span>
          <span role="cell">
            <label class="ds-switch"><input type="checkbox" role="switch" data-alternar-automacao="${a.id}" aria-label="${a.ativo ? 'Pausar' : 'Ativar'} ${escapeHtml(a.nome)}" ${a.ativo ? 'checked' : ''}><span class="ds-switch-trilho"></span></label>
          </span>
          <span role="cell" class="ds-tabela-acoes">
            <div class="ds-acoes" data-id="${a.id}">
              <button type="button" class="ds-acoes-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Ações de ${escapeHtml(a.nome)}">⋯</button>
              <div class="ds-acoes-menu" role="menu" hidden>
                <button type="button" class="ds-acoes-item" role="menuitem" data-acao="remover">Remover</button>
              </div>
            </div>
          </span>
        </div>
      `).join('');
    }

    const listaAutomacoes = document.getElementById('lista-automacoes');
    listaAutomacoes.addEventListener('change', async (e) => {
      const input = e.target.closest('[data-alternar-automacao]');
      if (!input) return;
      await apiFetch(`/crm/api/automacoes/${input.dataset.alternarAutomacao}`, {
        method: 'PATCH',
        body: JSON.stringify({ ativo: input.checked }),
      });
      carregar();
    });
    listaAutomacoes.addEventListener('ds-acoes-escolher', (e) => {
      if (e.detail.acao === 'remover') confirmarRemover(e.target.closest('[data-id]').dataset.id);
    });

    function confirmarRemover(id) {
      const automacao = automacoes.find((a) => a.id === id);
      abrirModal('<h3>Remover automação?</h3>', `
        <p class="modal-texto">"${escapeHtml(automacao ? automacao.nome : '')}" para de disparar imediatamente. Essa ação não pode ser desfeita.</p>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="remover-automacao-voltar">Voltar</button>
          <button type="button" class="btn-perigo" id="remover-automacao-confirmar">Remover</button>
        </div>
      `);
      document.getElementById('remover-automacao-voltar').addEventListener('click', fecharModal);
      document.getElementById('remover-automacao-confirmar').addEventListener('click', async () => {
        await apiFetch(`/crm/api/automacoes/${id}`, { method: 'DELETE' });
        fecharModal();
        carregar();
      });
    }

    async function carregarTemplates() {
      if (templates.length) return templates;
      const res = await apiFetch('/crm/api/automacoes/templates-whatsapp');
      templates = await res.json();
      return templates;
    }

    // `gatilhoInicial`/`etapaIdInicial` vêm do ⚡ por etapa no Quadro
    // (?gatilho=mudanca_etapa&etapa_id=...) — préseleciona o gatilho e a
    // etapa em vez de abrir o formulário em branco.
    async function abrirModalNovaAutomacao({ gatilhoInicial, etapaIdInicial } = {}) {
      await carregarTemplates();
      const opcoesEtapa = etapas.map((e) => `<option value="${e.id}" ${e.id === etapaIdInicial ? 'selected' : ''}>${escapeHtml(e.nome)}</option>`).join('');
      const opcoesTemplate = ['<option value="">Nenhum ainda</option>', ...templates.map((t) => `<option value="${escapeHtml(t.nome)}">${escapeHtml(t.nome)} (${t.status})</option>`)].join('');
      const gatilhoInicialValido = GATILHOS_VALIDOS_UI.includes(gatilhoInicial) ? gatilhoInicial : 'mudanca_etapa';
      abrirModal('<h3>Nova automação</h3>', `
        <div class="ds-form">
          <div class="ds-campo"><label class="ds-rotulo" for="au-nome">Nome</label><input class="ds-input" id="au-nome" placeholder="ex.: Aviso de pedido pronto"></div>
          <div class="ds-campo">
            <label class="ds-rotulo" for="au-gatilho">Gatilho</label>
            <div class="ds-select"><select id="au-gatilho">
              <option value="mudanca_etapa" ${gatilhoInicialValido === 'mudanca_etapa' ? 'selected' : ''}>Pedido muda de etapa</option>
              <option value="pedido_criado" ${gatilhoInicialValido === 'pedido_criado' ? 'selected' : ''}>Pedido criado</option>
              <option value="pedido_parado" ${gatilhoInicialValido === 'pedido_parado' ? 'selected' : ''}>Pedido parado numa etapa</option>
              <option value="aniversario_cliente" ${gatilhoInicialValido === 'aniversario_cliente' ? 'selected' : ''}>Aniversário do cliente</option>
            </select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
          </div>
          <div class="ds-campo" id="au-etapa-wrap">
            <label class="ds-rotulo" for="au-etapa">Etapa</label>
            <div class="ds-select"><select id="au-etapa">${opcoesEtapa}</select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
            <p class="modal-texto" style="margin-top:6px;font-size:12.5px" id="au-etapa-ajuda"></p>
          </div>
          <div class="ds-campo">
            <label class="ds-rotulo" for="au-template">Template aprovado no WhatsApp</label>
            <div class="ds-select"><select id="au-template">${opcoesTemplate}</select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
            ${!templates.length ? '<p class="modal-texto" style="font-size:12.5px">Nenhum template encontrado — confira se o número de WhatsApp já está vinculado (Configurações no admin) e se há templates aprovados na Meta.</p>' : ''}
          </div>
          <div class="modal-erro" id="au-erro"></div>
          <div class="ds-form-acoes">
            <button type="button" class="ds-btn ds-btn-secundario" id="au-cancelar">Cancelar</button>
            <button type="button" class="ds-btn ds-btn-primario" id="au-salvar">Salvar</button>
          </div>
        </div>
      `, 'modal-card-larga');

      function sincronizarVisibilidadeEtapa() {
        const gatilho = document.getElementById('au-gatilho').value;
        const precisaEtapa = GATILHOS_COM_ETAPA.includes(gatilho);
        // `.ds-campo` tem `display:flex` próprio — `hidden` sozinho perde
        // esse empate de especificidade (mesmo problema já documentado em
        // notificacoes.html com `.ds-abas-painel`/`.notificacoes-destino`),
        // por isso troca o `display` direto em vez de usar o atributo.
        document.getElementById('au-etapa-wrap').style.display = precisaEtapa ? '' : 'none';
        document.getElementById('au-etapa-ajuda').textContent = gatilho === 'pedido_parado'
          ? 'Usa o "prazo de alerta" já configurado nessa etapa (mesmo do card de orçamentos parados no Painel Hoje).'
          : '';
      }
      sincronizarVisibilidadeEtapa();
      document.getElementById('au-gatilho').addEventListener('change', sincronizarVisibilidadeEtapa);

      document.getElementById('au-cancelar').addEventListener('click', fecharModal);
      document.getElementById('au-salvar').addEventListener('click', async () => {
        const nome = document.getElementById('au-nome').value.trim();
        const gatilho = document.getElementById('au-gatilho').value;
        const precisaEtapa = GATILHOS_COM_ETAPA.includes(gatilho);
        if (!nome) { document.getElementById('au-erro').textContent = 'Nome é obrigatório'; return; }
        if (precisaEtapa && !document.getElementById('au-etapa').value) { document.getElementById('au-erro').textContent = 'Escolha a etapa'; return; }

        const res = await apiFetch('/crm/api/automacoes', {
          method: 'POST',
          body: JSON.stringify({
            nome, gatilho,
            etapa_id: precisaEtapa ? document.getElementById('au-etapa').value : null,
            whatsapp_template: document.getElementById('au-template').value || null,
          }),
        });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('au-erro').textContent = dados.error || 'Falha ao salvar';
          return;
        }
        fecharModal();
        carregar();
      });
    }

    document.getElementById('btn-nova-automacao').addEventListener('click', () => abrirModalNovaAutomacao());

    carregar().then(() => {
      // ⚡ por etapa no Quadro chega aqui como ?gatilho=mudanca_etapa&etapa_id=...
      const params = new URLSearchParams(window.location.search);
      const etapaIdInicial = params.get('etapa_id');
      const gatilhoInicial = params.get('gatilho');
      if (etapaIdInicial || gatilhoInicial) abrirModalNovaAutomacao({ gatilhoInicial, etapaIdInicial });
    });
  </script>
</body>
