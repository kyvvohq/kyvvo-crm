  .lista-automacoes-item .acoes-linha button { height:30px; padding:0 12px; font-size:12px; }
  .lista-automacoes-item .detalhe { margin-top:4px; font-size:13px; color:var(--muted-strong); }
</style>

<body>

    <a class="topo-logo" href="/crm/painel.html" aria-label="Ir para o início">

    <div class="ds-notificacoes" id="notificacoes-sino">

        <div class="ds-notificacoes-lista" id="notificacoes-lista"></div>
      </div>
    </div>
    <div class="topo-perfil" id="topo-perfil">
      <button class="topo-perfil-gatilho" id="topo-perfil-gatilho" type="button" aria-haspopup="true" aria-expanded="false">
        <div class="avatar js-avatar-usuario"></div>
        <span class="nome js-nome-usuario"></span>
        <span data-icon="chevron-down" data-size="14"></span>
      </button>
      <div class="menu-perfil" id="menu-perfil" hidden>
        <div class="menu-perfil-usuario">
          <div class="avatar js-avatar-usuario"></div>
          <div class="textos">
            <div class="nome js-nome-usuario"></div>
            <div class="email js-email-usuario"></div>
          </div>
        </div>
        <div class="menu-perfil-divisor"></div>
        <div class="menu-perfil-item menu-perfil-tema">
          <span data-icon="sun-moon" data-size="16"></span><span class="rotulo">Tema</span>
          <button class="toggle-tema" type="button" role="switch" aria-checked="false" aria-label="Alternar tema claro/escuro"><span class="bolinha"></span></button>
        </div>
        <div class="menu-perfil-divisor"></div>
        <button class="menu-perfil-item perigo btn-sair" type="button">
          <span data-icon="log-out" data-size="16"></span><span class="rotulo">Sair da conta</span>
        </button>
      </div>
    </div>
    </div>
  </header>
  <div class="app-shell">
    <nav class="ds-menu" data-ds-menu id="painel-sidebar">
      <button type="button" class="ds-menu-toggle" id="btn-toggle-sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <ul class="ds-menu-lista">
        <li><a class="ds-menu-link" href="/crm/painel.html"><span class="ds-menu-icone" data-icon="layout-dashboard"></span><span class="ds-menu-rotulo">Painel Hoje</span></a></li>
        <li><a class="ds-menu-link" href="/crm/quadro.html"><span class="ds-menu-icone" data-icon="kanban"></span><span class="ds-menu-rotulo">Quadro</span></a></li>
        <li><a class="ds-menu-link" href="/crm/clientes.html"><span class="ds-menu-icone" data-icon="users"></span><span class="ds-menu-rotulo">Clientes</span></a></li>
        <li><a class="ds-menu-link" href="/crm/pedidos.html"><span class="ds-menu-icone" data-icon="list"></span><span class="ds-menu-rotulo">Pedidos</span></a></li>
        <li><a class="ds-menu-link" href="/crm/estoque.html"><span class="ds-menu-icone" data-icon="package"></span><span class="ds-menu-rotulo">Estoque</span></a></li>
        <li><a class="ds-menu-link" href="/crm/segmentos.html"><span class="ds-menu-icone" data-icon="funnel"></span><span class="ds-menu-rotulo">Campanhas</span></a></li>
        <li class="ds-menu-grupo">
          <button type="button" class="ds-menu-link ds-menu-grupo-botao" aria-expanded="false">
            <span class="ds-menu-icone" data-icon="settings"></span>
            <span class="ds-menu-rotulo">Configurações</span>
            <span class="ds-menu-seta" data-icon="chevron-down" data-size="14"></span>
          </button>
          <ul class="ds-menu-sub">
            <li><a class="ds-menu-sublink" href="/crm/opcoes-cadastro.html">Cadastro</a></li>
            <li><a class="ds-menu-sublink" href="/crm/whatsapp.html">WhatsApp</a></li>
            <li><a class="ds-menu-sublink" href="/crm/automacoes.html">Automações</a></li>
            <li><a class="ds-menu-sublink" href="/crm/notificacoes.html">Notificações</a></li>

          </ul>

    <div class="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos">
          <div class="linha-titulo"><h1>Automações</h1></div>
        </div>
        <div class="acoes">
          <button type="button" id="btn-nova-automacao"><span data-icon="plus" data-size="16"></span>Nova automação</button>
        </div>
      </div>

      <div class="card" style="padding:0">
        <div id="lista-automacoes"><div class="vazio">Carregando…</div></div>
      </div>
    </div>
  </div>

  <footer data-ds-rodape data-ds-produto="CRM"></footer>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    let automacoes = [];
    let etapas = [];
    let templates = [];

    const ROTULO_GATILHO = {
      mudanca_etapa: 'Pedido muda de etapa',
      pedido_criado: 'Pedido criado',
      pedido_parado: 'Pedido parado numa etapa',
      aniversario_cliente: 'Aniversário do cliente',
    };
    const GATILHOS_COM_ETAPA = ['mudanca_etapa', 'pedido_parado'];
    const GATILHOS_VALIDOS_UI = ['mudanca_etapa', 'pedido_criado', 'pedido_parado', 'aniversario_cliente'];

    async function carregar() {
      const [resAutomacoes, resEtapas] = await Promise.all([
        apiFetch('/crm/api/automacoes'),
        apiFetch('/crm/api/etapas'),
      ]);
      automacoes = await resAutomacoes.json();
      etapas = await resEtapas.json();
      renderizar();
    }

    function renderizar() {
      const el = document.getElementById('lista-automacoes');
      if (!automacoes.length) {
        el.innerHTML = '<div class="vazio">Nenhuma automação configurada ainda.</div>';
        return;
      }
      el.innerHTML = automacoes.map((a) => `
        <div class="lista-automacoes-item">
          <div class="topo">
            <span class="nome">${escapeHtml(a.nome)} <span class="badge ${a.ativo ? 'sucesso' : 'neutro'}">${a.ativo ? 'ativa' : 'pausada'}</span></span>
            <div class="acoes-linha">
              <button type="button" class="btn-secundario" data-alternar-automacao="${a.id}" data-ativo="${!a.ativo}">${a.ativo ? 'Pausar' : 'Ativar'}</button>
              <button type="button" class="btn-secundario" data-apagar-automacao="${a.id}">Remover</button>
            </div>
          </div>
          <div class="detalhe">${ROTULO_GATILHO[a.gatilho] || a.gatilho}${a.etapa_nome ? ` — etapa "${escapeHtml(a.etapa_nome)}"` : ''} · Template: ${a.whatsapp_template ? escapeHtml(a.whatsapp_template) : '<span class="vazio" style="padding:0;display:inline">nenhum escolhido</span>'}</div>
        </div>
      `).join('');

      el.querySelectorAll('[data-alternar-automacao]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await apiFetch(`/crm/api/automacoes/${btn.dataset.alternarAutomacao}`, {
            method: 'PATCH',
            body: JSON.stringify({ ativo: btn.dataset.ativo === 'true' }),
          });
          carregar();
        });
      });
      el.querySelectorAll('[data-apagar-automacao]').forEach((btn) => {
        btn.addEventListener('click', () => confirmarRemover(btn.dataset.apagarAutomacao));
      });
    }

    function confirmarRemover(id) {
      const automacao = automacoes.find((a) => a.id === id);
      abrirModal('<h3>Remover automação?</h3>', `
        <p class="modal-texto">"${escapeHtml(automacao ? automacao.nome : '')}" para de disparar imediatamente. Essa ação não pode ser desfeita.</p>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="remover-automacao-voltar">Voltar</button>
          <button type="button" class="btn-perigo" id="remover-automacao-confirmar">Remover</button>
        </div>
      `);
      document.getElementById('remover-automacao-voltar').addEventListener('click', fecharModal);
      document.getElementById('remover-automacao-confirmar').addEventListener('click', async () => {
        await apiFetch(`/crm/api/automacoes/${id}`, { method: 'DELETE' });
        fecharModal();
        carregar();
      });
    }

    async function carregarTemplates() {
      if (templates.length) return templates;
      const res = await apiFetch('/crm/api/automacoes/templates-whatsapp');
      templates = await res.json();
      return templates;
    }

    // `gatilhoInicial`/`etapaIdInicial` vêm do ⚡ por etapa no Quadro
    // (?gatilho=mudanca_etapa&etapa_id=...) — préseleciona o gatilho e a
    // etapa em vez de abrir o formulário em branco.
    async function abrirModalNovaAutomacao({ gatilhoInicial, etapaIdInicial } = {}) {
      await carregarTemplates();
      const opcoesEtapa = etapas.map((e) => `<option value="${e.id}" ${e.id === etapaIdInicial ? 'selected' : ''}>${escapeHtml(e.nome)}</option>`).join('');
      const opcoesTemplate = ['<option value="">Nenhum ainda</option>', ...templates.map((t) => `<option value="${escapeHtml(t.nome)}">${escapeHtml(t.nome)} (${t.status})</option>`)].join('');
      const gatilhoInicialValido = GATILHOS_VALIDOS_UI.includes(gatilhoInicial) ? gatilhoInicial : 'mudanca_etapa';
      abrirModal('<h3>Nova automação</h3>', `
        <label for="au-nome">Nome</label>
        <input id="au-nome" placeholder="ex.: Aviso de pedido pronto">
        <label for="au-gatilho">Gatilho</label>
        <select id="au-gatilho">
          <option value="mudanca_etapa" ${gatilhoInicialValido === 'mudanca_etapa' ? 'selected' : ''}>Pedido muda de etapa</option>
          <option value="pedido_criado" ${gatilhoInicialValido === 'pedido_criado' ? 'selected' : ''}>Pedido criado</option>
          <option value="pedido_parado" ${gatilhoInicialValido === 'pedido_parado' ? 'selected' : ''}>Pedido parado numa etapa</option>
          <option value="aniversario_cliente" ${gatilhoInicialValido === 'aniversario_cliente' ? 'selected' : ''}>Aniversário do cliente</option>
        </select>
        <div id="au-etapa-wrap">
          <label for="au-etapa">Etapa</label>
          <select id="au-etapa">${opcoesEtapa}</select>
          <p class="modal-texto" style="margin-top:6px;font-size:12.5px" id="au-etapa-ajuda"></p>
        </div>
        <label for="au-template">Template aprovado no WhatsApp</label>
        <select id="au-template">${opcoesTemplate}</select>
        ${!templates.length ? '<p class="modal-texto" style="font-size:12.5px">Nenhum template encontrado — confira se o número de WhatsApp já está vinculado (Configurações no admin) e se há templates aprovados na Meta.</p>' : ''}
        <div class="modal-erro" id="au-erro"></div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="au-cancelar">Cancelar</button>
          <button type="button" id="au-salvar">Salvar</button>
        </div>
      `, 'modal-card-larga');

      function sincronizarVisibilidadeEtapa() {
        const gatilho = document.getElementById('au-gatilho').value;
        const precisaEtapa = GATILHOS_COM_ETAPA.includes(gatilho);
        document.getElementById('au-etapa-wrap').hidden = !precisaEtapa;
        document.getElementById('au-etapa-ajuda').textContent = gatilho === 'pedido_parado'
          ? 'Usa o "prazo de alerta" já configurado nessa etapa (mesmo do card de orçamentos parados no Painel Hoje).'
          : '';
      }
      sincronizarVisibilidadeEtapa();
      document.getElementById('au-gatilho').addEventListener('change', sincronizarVisibilidadeEtapa);

      document.getElementById('au-cancelar').addEventListener('click', fecharModal);
      document.getElementById('au-salvar').addEventListener('click', async () => {
        const nome = document.getElementById('au-nome').value.trim();
        const gatilho = document.getElementById('au-gatilho').value;
        const precisaEtapa = GATILHOS_COM_ETAPA.includes(gatilho);
        if (!nome) { document.getElementById('au-erro').textContent = 'Nome é obrigatório'; return; }
        if (precisaEtapa && !document.getElementById('au-etapa').value) { document.getElementById('au-erro').textContent = 'Escolha a etapa'; return; }

        const res = await apiFetch('/crm/api/automacoes', {
          method: 'POST',
          body: JSON.stringify({
            nome, gatilho,
            etapa_id: precisaEtapa ? document.getElementById('au-etapa').value : null,
            whatsapp_template: document.getElementById('au-template').value || null,
          }),
        });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('au-erro').textContent = dados.error || 'Falha ao salvar';
          return;
        }
        fecharModal();
        carregar();
      });
    }

    document.getElementById('btn-nova-automacao').addEventListener('click', () => abrirModalNovaAutomacao());

    carregar().then(() => {
      // ⚡ por etapa no Quadro chega aqui como ?gatilho=mudanca_etapa&etapa_id=...
      const params = new URLSearchParams(window.location.search);
      const etapaIdInicial = params.get('etapa_id');
      const gatilhoInicial = params.get('gatilho');
      if (etapaIdInicial || gatilhoInicial) abrirModalNovaAutomacao({ gatilhoInicial, etapaIdInicial });
    });
  </script>
</body>
</html>
