  <script>
    // Mesma lista de lib/notificacoes.js (backend), só com o que o frontend
    // precisa pra desenhar a tela — chave+título pra cada toggle. Evita um
    // endpoint só pra listar os tipos existentes.
    const TIPOS_NOTIFICACAO = [
      { chave: 'pedidos_parados', titulo: 'Pedidos parados além do prazo da etapa' },
    ];

    let notificacoesAtivas = {};

    function configAtual(chave) {
      const cfg = notificacoesAtivas[chave];
      return cfg && typeof cfg === 'object' ? cfg : {};
    }

    async function carregar() {
      const res = await apiFetch('/crm/api/notificacoes/config');
      const dados = await res.json();
      notificacoesAtivas = dados.notificacoes_ativas || {};
      renderizar();
    }

    function renderizar() {
      const el = document.getElementById('lista-notificacoes');
      el.innerHTML = TIPOS_NOTIFICACAO.map((tipo) => {
        const cfg = configAtual(tipo.chave);
        const ativo = cfg.ativo !== false;
        return `
          <div class="notificacao-linha" data-chave="${tipo.chave}">
            <div class="campo-check">
              <input type="checkbox" id="chk-${tipo.chave}" class="notificacao-ativa" data-chave="${tipo.chave}" ${ativo ? 'checked' : ''}>
              <label for="chk-${tipo.chave}">${escapeHtml(tipo.titulo)}</label>
            </div>
          </div>
        `;
      }).join('');

      // Manda o objeto INTEIRO daquela chave já mesclado — o PATCH substitui
      // o objeto completo, não mescla parcial no backend.
      async function salvar(chave, patchParcial) {
        const cfgAtual = configAtual(chave);
        const novo = { ...notificacoesAtivas, [chave]: { ...cfgAtual, ...patchParcial } };
        const res = await apiFetch('/crm/api/notificacoes/config', { method: 'PATCH', body: JSON.stringify({ notificacoes_ativas: novo }) });
        if (!res.ok) return false;
        notificacoesAtivas = (await res.json()).notificacoes_ativas || novo;
        carregarNotificacoes();
        return true;
      }

      el.querySelectorAll('.notificacao-ativa').forEach((chk) => {
        chk.addEventListener('change', async () => {
          const ok = await salvar(chk.dataset.chave, { ativo: chk.checked });
          if (!ok) chk.checked = !chk.checked;
        });
      });
    }

    carregar();
  </script>
