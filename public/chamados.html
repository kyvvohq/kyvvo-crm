    <div class="painel-main">

      <div class="ds-tabela" role="table" aria-label="Chamados"
           style="--ds-colunas: minmax(0,1fr) minmax(0,1.4fr) 110px 100px 150px 110px">
        <div class="ds-filtros">
          <div class="ds-select"><select id="f-status" aria-label="Status">
            <option value="">Qualquer status</option>
            <option value="aberto">Aberto</option>
            <option value="em_andamento">Em andamento</option>
            <option value="aguardando_cliente">Aguardando cliente</option>
            <option value="resolvido">Resolvido</option>
            <option value="fechado">Fechado</option>
          </select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
          <div class="ds-select"><select id="f-urgencia" aria-label="Urgência">
            <option value="">Qualquer urgência</option>
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
            <option value="critica">Crítica</option>
          </select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
        </div>
        <div class="ds-tabela-cabecalho" role="row">
          <span role="columnheader">Cliente</span><span role="columnheader">Descrição</span><span role="columnheader">Categoria</span>
          <span role="columnheader">Urgência</span><span role="columnheader">Status</span><span role="columnheader"></span>
        </div>
        <div id="linhas-chamados"></div>
      </div>
    </div>

  <footer data-ds-rodape data-ds-produto="CRM"></footer>

  <script src="/ds/components.js"></script>
  <script src="/crm/shell.js"></script>
  <script>
    let chamadosAtuais = [];

    const ROTULO_CATEGORIA = { bug: 'Bug', duvida_tecnica: 'Dúvida técnica', reclamacao: 'Reclamação', outro: 'Outro' };
    const ROTULO_URGENCIA = { baixa: 'Baixa', media: 'Média', alta: 'Alta', critica: 'Crítica' };
    const BADGE_URGENCIA = { baixa: 'ds-badge-info', media: 'ds-badge-aviso', alta: 'ds-badge-aviso', critica: 'ds-badge-erro' };
    const ROTULO_STATUS = { aberto: 'Aberto', em_andamento: 'Em andamento', aguardando_cliente: 'Aguardando cliente', resolvido: 'Resolvido', fechado: 'Fechado' };

    async function carregar() {
      const params = new URLSearchParams();
      if (document.getElementById('f-status').value) params.set('status', document.getElementById('f-status').value);
      if (document.getElementById('f-urgencia').value) params.set('urgencia', document.getElementById('f-urgencia').value);
      const res = await apiFetch(`/crm/api/chamados?${params}`);
      chamadosAtuais = await res.json();
      renderizar();
    }

    ['f-status', 'f-urgencia'].forEach((id) => document.getElementById(id).addEventListener('change', carregar));

    function renderizar() {
      const container = document.getElementById('linhas-chamados');
      container.innerHTML = chamadosAtuais.length ? chamadosAtuais.map((ch) => `
        <div class="ds-tabela-linha ds-tabela-linha-clicavel" role="row" tabindex="0" data-id="${ch.id}">
          <span role="cell" data-rotulo="Cliente"><span class="ds-tabela-primario">${escapeHtml(ch.cliente_nome)}</span><br><span style="color:var(--muted);font-size:12.5px">${escapeHtml(ch.cliente_telefone || '')}</span></span>
          <span role="cell" data-rotulo="Descrição">${escapeHtml((ch.descricao || '').slice(0, 80))}${(ch.descricao || '').length > 80 ? '…' : ''}</span>
          <span role="cell" data-rotulo="Categoria">${escapeHtml(ROTULO_CATEGORIA[ch.categoria] || ch.categoria || '—')}</span>
          <span role="cell" data-rotulo="Urgência"><span class="ds-badge ${BADGE_URGENCIA[ch.urgencia]} ds-badge-sm">${ROTULO_URGENCIA[ch.urgencia]}</span></span>
          <span role="cell" data-rotulo="Status">
            <div class="ds-select ds-select-sm"><select data-acao="mudar-status" data-id="${ch.id}">
              ${Object.entries(ROTULO_STATUS).map(([v, r]) => `<option value="${v}" ${v === ch.status ? 'selected' : ''}>${r}</option>`).join('')}
            </select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
          </span>
          <span role="cell">
            <button type="button" class="ds-btn ds-btn-secundario ds-btn-sm" data-acao="detalhe" data-id="${ch.id}">Detalhe</button>
          </span>
        </div>
      `).join('') : `<div class="ds-vazio"><p class="ds-vazio-titulo">Nenhum chamado com esses filtros</p></div>`;

      container.querySelectorAll('[data-acao="mudar-status"]').forEach((select) => {
        select.addEventListener('change', async () => {
          await apiFetch(`/crm/api/chamados/${select.dataset.id}`, { method: 'PATCH', body: JSON.stringify({ status: select.value }) });
          carregar();
        });
      });
      container.querySelectorAll('[data-acao="detalhe"]').forEach((btn) => {
        btn.addEventListener('click', () => abrirDetalheChamado(btn.dataset.id));
      });
    }

    function abrirDetalheChamado(id) {
      const ch = chamadosAtuais.find((x) => x.id === id);
      if (!ch) return;
      abrirModal('<h3>Detalhe do chamado</h3>', `
        <div class="ds-form">
          <p class="modal-texto"><strong>Produto afetado:</strong> ${escapeHtml(ch.produto_afetado || '—')}</p>
          <p class="modal-texto"><strong>Descrição:</strong><br>${escapeHtml(ch.descricao)}</p>
          <div class="ds-campo"><label class="ds-rotulo" for="ch-resumo">Resumo da resolução</label><textarea class="ds-textarea" id="ch-resumo">${escapeHtml(ch.resolucao_resumo || '')}</textarea></div>
          <div class="modal-erro" id="ch-erro"></div>
          <div class="ds-form-acoes">
            <button type="button" class="ds-btn ds-btn-secundario" id="ch-cancelar">Fechar</button>
            <button type="button" class="ds-btn ds-btn-primario" id="ch-salvar">Salvar resumo</button>
          </div>
        </div>
      `);
      document.getElementById('ch-cancelar').addEventListener('click', fecharModal);
      document.getElementById('ch-salvar').addEventListener('click', async () => {
        const res = await apiFetch(`/crm/api/chamados/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ resolucao_resumo: document.getElementById('ch-resumo').value.trim() || null }),
        });
        if (!res.ok) {
          const dados = await res.json().catch(() => ({}));
          document.getElementById('ch-erro').textContent = dados.error || 'Falha ao salvar';
          return;
        }
        fecharModal();
        carregar();
      });
    }

    carregar();
  </script>
