name: Deploy to EC2

# Mesmo padrão do kyvvo-people/deploy.yml: push na branch `release` -> scp
# -> recria o serviço `crm`. Verificação de saúde ao final (2026-09-25):
# sem isso, "o deploy rodou" só significava que o container foi recriado,
# nunca que o `npm install`/app dentro dele realmente subiu — cada checagem
# precisava de um round-trip manual no CloudShell (docker logs + curl).
# Agora falha o job (com os logs já impressos aqui) se /crm/api/saude não
# responder em ~30s.

on:
  push:
    branches: [release]
    paths:
      - ".npmrc"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - "lib/**"
      - "db/**"
      - "public/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar chave SSH
        id: sshkey
        run: |
          KEY="$(printf '%s' '${{ secrets.EC2_SSH_KEY_B64 }}' | base64 -d)"
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$KEY"
          {
            echo 'value<<KEYEOF'
            printf '%s\n' "$KEY"
            echo 'KEYEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Gravar versão do deploy
        run: |
          COMMIT_CURTO="${GITHUB_SHA::7}"
          echo "{\"commit\":\"${COMMIT_CURTO}\",\"deployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > version.json

      - name: Copiar arquivos pra EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          # scripts/** e docs/{basic,kyvvo-atendimento}/conhecimento/** entram pro seed do
          # agente rodar dentro do container (docker compose exec crm node scripts/seed-agente.js ...)
          source: ".npmrc,index.js,package.json,package-lock.json,version.json,lib/**,db/**,public/**,scripts/**,docs/basic/conhecimento/**,docs/kyvvo-atendimento/conhecimento/**"
          target: "/opt/kyvvo/crm"

      - name: Regenerar env do SSM + recriar container + checar saúde
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          script: |
            set -e
            sudo /opt/kyvvo/scripts/gen-env-from-ssm.sh
            cd /opt/kyvvo && sudo docker compose up -d --force-recreate crm
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:3005/crm/api/saude > /dev/null; then
                echo "OK: /crm/api/saude respondeu na tentativa ${i} (~$((i * 2))s)."
                exit 0
              fi
              sleep 2
            done
            echo "::error::/crm/api/saude não respondeu depois de ~30s — logs do container:"
            sudo docker logs kyvvo-crm-1 --tail 80
            exit 1
