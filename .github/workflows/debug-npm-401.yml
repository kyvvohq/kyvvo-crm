name: Debug 401 GitHub Packages

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Metadados do pacote (com token)
        run: |
          echo "--- status com Authorization ---"
          curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer ${{ secrets.NPM_PACKAGES_TOKEN }}" \
            https://npm.pkg.github.com/@kyvvohq/whatsapp

      - name: Metadados de um pacote PÚBLICO do mesmo jeito (sanity check)
        run: |
          echo "--- status sem token, pacote npmjs público (deve ser 200) ---"
          curl -s -o /dev/null -w "%{http_code}\n" https://registry.npmjs.org/left-pad

      - name: Testar a API normal do GitHub com o mesmo token (não é o registry de pacotes)
        run: |
          echo "--- GET /user com o mesmo token ---"
          curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer ${{ secrets.NPM_PACKAGES_TOKEN }}" \
            https://api.github.com/user
          echo "--- GET /orgs/kyvvohq/packages com o mesmo token ---"
          curl -s -H "Authorization: Bearer ${{ secrets.NPM_PACKAGES_TOKEN }}" \
            "https://api.github.com/orgs/kyvvohq/packages?package_type=npm" | head -c 500
          echo

      - name: IP público deste runner
        run: curl -s https://api.ipify.org; echo
